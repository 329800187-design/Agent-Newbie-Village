      {talk:'③ 用处二：看懂「为啥卡、为啥慢」|电脑卡？你能想到内存（工作台）是不是满了。程序算得慢？你知道可能是解释型的锅、或数据太大。<br><strong>不再一句「它就是卡」，而是能定位到大概哪一层出了问题。</strong>'},
      {sequence:{ask:'一个「读任务→调AI→生成清单→保存」的 Agent 程序，完整运行步骤是怎样的？拖成正确顺序：',items:[{id:'find',text:'找到代码文件、确认当前目录'},{id:'start',text:'用命令启动，Python 解释器读取代码'},{id:'dep',text:'加载 AI 相关依赖、读取 API Key'},{id:'input',text:'读取任务文件（输入）'},{id:'call',text:'调用 AI 接口、等待返回'},{id:'mem',text:'在内存里整理成优先级清单'},{id:'save',text:'保存输出结果'}],answer:['find','start','dep','input','call','mem','save'],card:'Agent 运行检查表',fb:'找文件/目录 → 启动/解释器 → 依赖/Key → 读输入 → 调AI/等待 → 内存整理 → 保存。执行前要备好（依赖/Key），执行中有外部等待（调AI），中间结果在内存，最后才落盘。这条链下一片 W6 配 Agent 会直接用上。'}},
      {talk:'④ 用处三：看懂「为啥报这种怪错」|有些报错是底层的：内存不足、数据类型对不上底层要求、编码（0101）不对……<br><strong>你懂底层，这类「看着莫名其妙」的报错，你能猜到大概是咋回事，而不是彻底懵。</strong>'},
      {locate:{ask:'上面那条 Agent 运行链，三个地方可能出问题。判断各自卡在哪一层：',text:['【故障A】提示找不到「任务文件」。','【故障B】程序报「API Key 未配置」。','【故障C】调用 AI 接口后，很久没有返回。'],steps:[{q:'① 故障A（找不到任务文件）属于哪一层？',type:'choice',options:[{t:'文件 / 路径层',ok:true},{t:'CPU 计算层',ok:false},{t:'内存层',ok:false}],fb:'找不到文件=文件/路径层（回收 W4）。跟 CPU、内存无关。'},{q:'② 故障B（API Key 未配置）属于哪一层？',type:'choice',options:[{t:'配置层（环境变量/Key 没配好）',ok:true},{t:'依赖层（缺库）',ok:false},{t:'输入层',ok:false}],fb:'Key 没配=配置层（回收 W4 的环境变量/Key）。'},{q:'③ 故障C（调 AI 很久没返回）属于哪一层？',type:'choice',options:[{t:'外部等待层（在等网络/模型）',ok:true},{t:'CPU 层（在拼命算）',ok:false},{t:'文件层',ok:false}],fb:'调接口没返回=外部等待层，程序在等网络/模型，不是 CPU 在算。'}],card:'Agent 故障分层卡',cardBody:'同一条 Agent 运行链，故障可能在不同层：找不到文件=文件/路径层；Key 没配=配置层；调 AI 无响应=外部等待层。判断对了层，才知道该查哪、别瞎重装。'}},
      {talk:'⑤ 用处四：指挥 AI 时更懂「火候」|你让 AI 干活，懂底层你能给更靠谱的判断：这任务数据量大不大（吃不吃内存）、要不要用更快的方案、报错是逻辑问题还是环境 / 底层问题。<br><strong>你成了「懂行的甲方」，AI 更好使。</strong>'},
      {try:{q:'懂点底层，让你指挥 AI 时有啥不同？',opts:[{t:'更能判断任务难点、看懂报错性质，当个「懂行的甲方」',ok:true},{t:'可以不用 AI 了',ok:false},{t:'AI 会更怕你',ok:false}],fb:'懂底层，你能判断任务吃不吃资源、报错是哪类、方案合不合理——你成了懂行的甲方，AI 给的东西你验收得动、指挥得准。'}},
      {talk:'⑥ 一句话定位你的深度|你不用成为「造电脑的人」或「写底层的程序员」。<strong>你要的是「看透一层」</strong>：知道底下大概怎么回事，够你判断、验收、指挥就行。<br><strong>懂原理的明白人 ≠ 专业工程师，但比只会点按钮的人强太多。</strong>'}
    ],
    aha:{goal:'你今天真正学会的',text:'懂点底层不为炫技，为的是：<strong>选型有谱、看懂卡慢、看懂怪错、指挥 AI 更懂火候</strong>。你的定位是「看透一层的明白人」，不是造电脑 / 写底层的工程师——够你判断验收指挥就行。<br>下一关是 <strong>Boss</strong>：把「程序跑起来的全流程」从头到尾串一遍！'}
  }},
  'w5_8':{world:'w5',n:8,a:'54',boss:true,type:'core',optional:false,title:'Boss · 程序跑起来全流程',goal:'串起底层全流程',xp:300,achievement:'w5_complete',content:{
    flow:[
      {talk:'① Boss 登场：从双击到跑完，全流程|矿山的毕业考——把你这一路学的「0和1、翻译、内存、CPU」串成一条完整链路。搞懂它，你就知道程序卡在哪、错在哪，不再一出问题就抓瞎。'},
      {talk:'② 一段代码，从写完到出结果，要过几道关|<strong>写代码 → 存成文件 → 运行环境读取 → 翻译成机器能懂的指令 → 装进内存 → CPU 一条条执行 → 出结果</strong>。<br>别死记，理解每一步在干啥就行。先来排个序。'},
      {sequence:{ask:'Boss 考题——把「读今日任务、生成优先级清单」脚本从启动到输出的完整运行链，从头到尾排对：',items:[{id:'file',text:'找到代码文件'},{id:'cwd',text:'确认当前目录'},{id:'cmd',text:'输入运行命令启动'},{id:'interp',text:'Python 解释器读取代码'},{id:'dep',text:'加载所需依赖'},{id:'cfg',text:'读取环境变量 / 配置'},{id:'input',text:'读取今日任务（输入）'},{id:'exec',text:'CPU 执行条件和排序逻辑'},{id:'mem',text:'内存保存中间结果'},{id:'out',text:'生成并保存优先级清单（输出）'}],answer:['file','cwd','cmd','interp','dep','cfg','input','exec','mem','out'],card:'程序运行链图',fb:'执行前（文件→目录→命令→解释器→依赖→配置）、执行中（输入→CPU执行→内存存中间）、输出。CPU 在「执行」那步，内存在「中间结果」那步，外部等待常在「调接口」那步。一条完整的链，缺哪环都可能卡。'}},
      {talk:'③ 为什么代码不能「写完直接跑」|CPU 只认<strong>机器能懂的指令（0和1那层）</strong>，看不懂你写的 Python 文字。所以中间必须有个「运行环境」把代码<strong>翻译</strong>一遍——这就是你前面学的「解释 / 编译」在干的事。'},
      {try:{q:'代码写完保存后，还差哪一步才能被 CPU 执行？',opts:[{t:'被运行环境读取、翻译成机器能懂的指令',ok:true},{t:'把文件改个名字就行了',ok:false},{t:'把电脑重启一下',ok:false}],fb:'CPU 看不懂 Python 文字，必须先翻译成机器指令。改名、重启都不解决「翻译」这一步——没翻译，CPU 无从下手。'}},
      {talk:'④ 三个部件，各干各的活|<strong>硬盘</strong>：长期存东西（关机也在，像仓库）。<strong>内存</strong>：临时放正在跑的程序和数据（关机就没，像工作台）。<strong>CPU</strong>：真正干活的，一条条执行指令（像工人的手）。别搞混。'},
      {try:{q:'程序正在运行时，它的指令和数据主要摆在哪儿？',opts:[{t:'内存——临时放着，供 CPU 随时取用',ok:true},{t:'硬盘——一直存在那里不动',ok:false},{t:'CPU 里面——全都塞进 CPU',ok:false}],fb:'跑起来的程序和数据在<strong>内存</strong>（工作台上随手可取）。硬盘是长期仓库、速度慢；CPU 只负责执行、装不下整个程序。这三者分工别混。'}},
      {try:{q:'那 CPU 到底负责干啥？',opts:[{t:'一条条执行机器能懂的指令',ok:true},{t:'长期保存你所有的项目文件',ok:false},{t:'自动帮你把程序里的错误改好',ok:false}],fb:'CPU 是「执行者」，只管按指令一条条干。长期保存是硬盘的活；至于「自动改错」——没有这种好事，错要靠你和 AI 自己查。'}},
      {talk:'⑤ 懂了流程，就会定位问题|程序报错，不同位置对应不同环节。比如提示<strong>「找不到配置文件」</strong>——这跟 CPU、内存都没关系，是「东西没找到」这一层的事。'},
      {locate:{ask:'脚本没跑通，三个场景，判断各卡在哪一层、阻断了哪一步：',text:['【场景A】运行命令指向了一个不存在的文件。','【场景B】缺少所需的 Python 库。','【场景C】今日任务文件是空的 / 格式不对。'],steps:[{q:'① 场景A（命令指向不存在的文件）属于哪一层？',type:'choice',options:[{t:'文件 / 命令层——还没真正进解释器执行',ok:true},{t:'CPU 计算层',ok:false},{t:'内存层',ok:false}],fb:'文件都不存在，程序根本没进解释器执行——卡在文件/命令层，最前面。'},{q:'② 场景B（缺 Python 库）属于哪一层、执行前还是执行中？',type:'choice',options:[{t:'依赖层——加载依赖时（真正执行代码前）就卡住',ok:true},{t:'输出层——最后才出问题',ok:false},{t:'CPU 层',ok:false}],fb:'缺库在「加载依赖」那步报错，是执行真正开始前。下一步：确认环境、装依赖（回收 W4）。'},{q:'③ 场景C（任务文件空/格式错）属于哪一层？程序启动了吗？',type:'choice',options:[{t:'输入层——程序已启动，卡在读输入这步',ok:true},{t:'解释器层——根本没启动',ok:false},{t:'该重装 Python',ok:false}],fb:'程序已经跑起来了，是读到的「输入」有问题——输入层。先修输入，别去重装 Python。'}],card:'Boss 故障分层卡',cardBody:'A 文件/命令层（没进解释器）｜B 依赖层（执行前加载依赖卡住）｜C 输入层（已启动、卡在读输入）。同一条链，故障可能卡在最前（文件）、中间（依赖）、或输入——判断卡在哪一步、阻断哪一层，才知下一步查什么、修完从哪重验。'}},
      {talk:'⑥ 再看一个常见怪事|你明明改了代码，结果却还是老样子。别急着怀疑电脑坏了，这几乎总是有普通原因。'},
      {try:{q:'改了代码，跑出来还是旧结果，最可能是？',opts:[{t:'文件没保存、跑的是另一个同名文件、或没重新运行',ok:true},{t:'CPU 太慢，还没算到新代码',ok:false},{t:'电脑中病毒了',ok:false}],fb:'十有八九是：忘了保存、跑错了文件、或者没重新运行（还在看上次的结果）。这跟 CPU 快慢、病毒都无关——先排查这几个最普通的原因。'}},
      {talk:'⑦ 一句提醒：别把入门比喻当死规矩|入门时把「编译 / 解释」当两种常见的翻译方式就够了，但别记成死规矩——<strong>不是「编译一定快、解释一定慢」，也不是每种语言只能纯编译或纯解释</strong>。真实语言常用字节码、JIT、混合等方式。同样，程序卡顿也<strong>不一定</strong>是内存问题，可能是代码、磁盘、网络等。够用就好，别绝对化。'}
    ],
    aha:{goal:'🎓 恭喜——程序底层矿山通关！',text:'<strong>⚙️ 程序运行链图（读今日任务→生成优先级清单）</strong><br>• 程序目标：读任务、排优先级、出清单<br>• 代码文件 main.py → 确认当前目录 → 启动命令 python main.py<br>• 解释器读取 → 加载依赖 → 读配置(Key) → 读输入(今日任务)<br>• <strong>CPU</strong>：执行条件+排序计算　<strong>内存</strong>：暂存中间结果　<strong>外部等待</strong>：调 AI 接口时<br>• 输出：保存/显示优先级清单<br>可能故障层：文件/路径 · 命令 · 解释器 · 依赖 · 配置 · 输入 · 执行 · 内存 · 外部等待 · 输出<br>基础排查顺序：读报错 → 判断卡在哪一步 → 定位故障层 → 最小修复 → 重跑验证<br><br>你现在能「看透」程序从启动到出结果的整条链、并判断故障卡在哪一层。<br>🎓 赢得认证：<strong>底层认知</strong>！<br>下一站「智能体工坊」：程序、工具都懂了，它们怎么组装成一个会自己干活的 Agent？'}
  }},
  'w6_1':{world:'w6',n:1,a:'55',boss:false,type:'core',optional:false,title:'什么是 Agent',goal:'把拼图合成 Agent',xp:100,content:{
    flow:[
      {talk:'① 接上一关：拼图合起来的时候到了|你一路学的——AI 会说话、命令能操作电脑、代码有逻辑、脚本能跑、底层怎么运转——现在，把这些拼图<strong>合成一个东西</strong>：AI Agent（智能体）。'},
      {talk:'② 回收启蒙营：Agent 不只是聊天机器人|还记得启蒙营分过「聊天机器人 vs Agent」吗？聊天机器人只会「回你话」；<strong>Agent 会「真去干活」</strong>——你说「帮我把这堆文件整理了」，它真的去读文件、动手分类，不只是嘴上告诉你怎么做。'},
      {talk:'③ 一句话：Agent = 会自己动手干活的 AI|它 = 一个「大脑」（AI 模型，负责想）+ 一双「手」（工具，负责做）+ 会「自己一步步推进」直到把活干完。<strong>能想、能做、能自主推进——这就是 Agent。</strong>'},
      {try:{q:'聊天机器人和 Agent 最大的区别？',opts:[{t:'Agent 会真动手干活，聊天机器人只会回你话',ok:true},{t:'Agent 更贵',ok:false},{t:'没区别',ok:false}],fb:'聊天机器人只「说」（告诉你咋做），Agent 会「做」（真去读文件、调工具、把活干完）。能动手，是 Agent 的分水岭。'}},
      {talk:'④ 回收启蒙营那句话：AI 是脑、工具是手|启蒙营 Boss 你捋过：AI 是脑、工具是手、Agent 是脑+手能干活、工作流是流水线。<strong>这一整片世界，就是把「Agent = 脑+手能干活」这句话彻底拆开看透。</strong>'},
      {try:{q:'「AI 是脑，工具是手」，那 Agent 是？',opts:[{t:'脑+手能干活——会想也会做',ok:true},{t:'只是脑',ok:false},{t:'只是手',ok:false}],fb:'回收启蒙营：AI（脑）会想、工具（手）能做，把俩装一起、还能自主推进，就是 Agent。这一片就来拆透它。'}},
      {talk:'⑤ 接下来拆什么|Agent 有几个核心零件，这一片挨个拆：<strong>大脑（模型）、手（工具）、记忆、自主循环</strong>。<br>拆完你会发现——你一路的向导小黑，可能本身就是个 Agent……'},
      {try:{q:'这一片「智能体工坊」要带你干啥？',opts:[{t:'把 Agent 拆开，看透它由哪些零件组成',ok:true},{t:'教你造芯片',ok:false},{t:'从零训练一个大模型',ok:false}],fb:'这一片是收官：把 Agent 拆成大脑、手、记忆、循环几个零件，一个个看透。看完你就懂「Agent 凭啥能自己干活」。'}},
      {talk:'⑥ 连回你自己|你是 AI 操作员——<strong>看透 Agent 怎么组成的，你才知道怎么给它配工具、喂记忆、盯着它别跑偏。</strong>这是你指挥 Agent 的底气。'},
      {interactionId:'agent_builder',builder:{mode:'agent-config',ask:'把下面这些零件拼成一个能干活的 Agent（都选上）：',scenario:{title:'配 Agent 拼图'},sections:[{id:'parts',label:'Agent 要哪些零件？',inputType:'multi',options:[{id:'goal',t:'✓ 任务目标'},{id:'brain',t:'✓ 模型大脑'},{id:'hand',t:'✓ 工具手'},{id:'mem',t:'✓ 记忆'},{id:'rule',t:'✓ 行为规则'},{id:'stop',t:'✓ 停止条件'}]}],validation:{requireAll:{parts:['goal','brain','hand','mem','rule','stop']}}}}
    ],
    aha:{goal:'你今天真正学会的',text:'Agent = 会自己动手干活的 AI（脑+手+自主推进），不只是回话的聊天机器人（现在有些聊天产品接了工具/插件也能干点活，但「围绕目标、自己一步步推进」才是 Agent 的关键分界）。回收启蒙营「AI 是脑、工具是手、Agent 是脑+手能干活」。这一片把 Agent 拆开看透。<br>下一关：先看它的「大脑」——AI 模型。'}
  }},
  'w6_2':{world:'w6',n:2,a:'56',boss:false,type:'core',optional:false,title:'大脑：模型',goal:'看懂 Agent 的大脑',xp:100,content:{
    flow:[
      {talk:'① 接上一关：先拆「大脑」|Agent 要「会想」，靠的是一个大脑——<strong>AI 模型</strong>（就是启蒙营学的「大模型」，如 GPT 这类）。它负责：理解你的话、做判断、决定下一步干啥。'},
      {talk:'② 大脑干的活：想，不是做|模型只负责「动脑子」：读懂你要啥、拆解任务、决定「下一步该调哪个工具」。<strong>但它自己动不了手</strong>——它没法真去删文件、发邮件，那得靠「手」（工具，下一关）。'},
      {talk:'③ 回收启蒙营：模型有它的脾气|还记得启蒙营讲的吗？大模型会「一本正经胡说」（幻觉）、有「知识保质期」、靠「上下文」记事……<strong>Agent 的大脑，就带着这些脾气。</strong>所以 Agent 也会犯这些错——这是后面「盯着它」那关的伏笔。'},
      {try:{q:'Agent 的「大脑」（AI 模型）主要负责啥？',opts:[{t:'想：理解、判断、决定下一步干啥',ok:true},{t:'做：亲手删文件发邮件',ok:false},{t:'存文件',ok:false}],fb:'大脑只管「想」——理解你、拆任务、定下一步。真「做」（调工具动手）是「手」的活。脑和手分工，下一关拆手。'}},
      {talk:'④ 大脑越强，Agent 越聪明|换个更强的模型（更聪明的大脑），Agent 就更会拆任务、更少犯错、更懂你。<strong>这就是为啥大家追着换更强的模型</strong>——脑子好使，整个 Agent 都跟着强。'},
      {try:{q:'给 Agent 换个更强的 AI 模型，会咋样？',opts:[{t:'它更会拆任务、判断更准、更懂你',ok:true},{t:'完全没影响',ok:false},{t:'它会拒绝干活',ok:false}],fb:'大脑（模型）是 Agent 的核心。换更强的脑，它拆任务、做判断、理解你的能力全跟着涨。这就是为啥模型这么关键。'}},
      {talk:'⑤ 但光有大脑不够|一个再聪明的大脑，被关在盒子里、没有手，也只能「想」不能「做」——那就退化成聊天机器人了。<strong>要真干活，大脑得配上手。</strong>'},
      {try:{q:'只有强大脑、没有手的 AI，本质上是？',opts:[{t:'聊天机器人——只会想 / 说，不能真动手',ok:true},{t:'完整的 Agent',ok:false},{t:'一台电脑',ok:false}],fb:'光有脑没有手，只能想和说——那是聊天机器人。装上手（工具）、能真干活，才升级成 Agent。下一关拆「手」。'}},
      {talk:'⑥ 连回你|你选 Agent、配 Agent，第一件事就是挑大脑（模型）：这活难不难、要不要用更强的模型。<strong>懂大脑，你才配得好 Agent 的「智商」。</strong>'},
      {interactionId:'agent_builder',builder:{mode:'agent-config',ask:'给「读待办、排优先级」的助手挑合适的模型能力：',scenario:{title:'给任务挑模型'},sections:[{id:'model',label:'最需要什么？（勾对的）',inputType:'multi',options:[{id:'understand',t:'✓ 理解文字'},{id:'vision',t:'能看图(多模态,本任务用不上)'},{id:'expensive',t:'✗ 一定要最贵'},{id:'trust',t:'✗ 模型不会错'}]}],validation:{required:['model'],requireAll:{model:['understand']},forbidden:{model:['expensive','trust']}}}}
    ],
    aha:{goal:'你今天真正学会的',text:'Agent 的大脑 = AI 模型（启蒙营的大模型），负责「想」（理解、判断、定下一步），但自己动不了手，还带着幻觉 / 保质期 / 靠上下文记事这些脾气。大脑越强 Agent 越聪明，但光有脑不够——得配手。<br>下一关：Agent 的「手」——工具（回收 W2/W3 的函数！）。'}
  }},
  'w6_3':{world:'w6',n:3,a:'57',boss:false,type:'core',optional:false,title:'手：工具',goal:'看懂 Agent 的手',xp:100,content:{
    flow:[
      {talk:'① 接上一关：大脑要动手，得有「手」|大脑（模型）只会想。要真去查天气、读文件、发邮件，得靠<strong>工具</strong>——这就是 Agent 的「手」。'},
      {talk:'② 重磅回收：工具就是函数！|还记得 W2、W3 那个大发现吗？<strong>命令、函数、Agent 工具本质相通（此外 API、网页动作、外部服务也能封装成工具）。</strong>Agent 的每个工具（「会查天气」「会读文件」），底层就是一段 W3 学的 <code style="background:#eee;padding:2px 8px;border-radius:4px">def</code> 函数。<strong>你早就见过它的真身了。</strong>'},
      {try:{q:'Agent 的「工具」，底层其实是啥？（回收 W3）',opts:[{t:'一个个打包好的函数（def）',ok:true},{t:'一块硬件',ok:false},{t:'一个新的 AI',ok:false}],fb:'回收 W3：命令、函数、Agent 工具本质相通。Agent 的每个工具，底层就是一段 def 定义的函数。你 W3 就见过了。'}},
      {talk:'③ 大脑 + 手怎么配合|大脑决定「该用哪只手」，手负责「真去做」：<br>你说「今天要带伞吗」→ 大脑判断「得先知道天气」→ 决定调「查天气」工具（手）→ 手真去查 → 结果给回大脑 → 大脑告诉你「带吧，有雨」。<strong>脑想、手做、结果回脑，一来一回。</strong>'},
      {try:{q:'Agent 干活时，大脑和手怎么分工？',opts:[{t:'大脑决定用哪只手，手真去做、把结果交回大脑',ok:true},{t:'手指挥大脑',ok:false},{t:'各干各的不沟通',ok:false}],fb:'大脑判断「该调哪个工具」，手（工具）真去执行、把结果交回大脑，大脑再定下一步。脑想手做、循环配合——这就是 Agent 干活的样子。'}},
      {talk:'④ 给 Agent 配的工具越多，它能干的越多|只给它「查天气」，它只会查天气；再给它「读文件」「发邮件」「搜网页」，它就能干一大串活。<strong>配工具 = 给 Agent 加手、扩本事。</strong>（回收 W4：很多工具是 import 来的库）'},
      {try:{q:'给 Agent 多配几个工具，会咋样？',opts:[{t:'它能干的活变多了（每个工具 = 一项新本事）',ok:true},{t:'它会变笨',ok:false},{t:'没用',ok:false}],fb:'工具=手=本事。配「查天气」它会查天气，再配「发邮件」它就会发邮件。给 Agent 配工具，就是给它扩展能干的活。'}},
      {talk:'⑤ 但手不能乱伸（埋下伏笔）|手越多、能干的越多，<strong>也越危险</strong>——给了它「删文件」的手，万一它判断错了呢？（回收 W1 删除=危险操作、W4 API Key）<strong>所以危险的手，得有人盯着、甚至要你点头才让它动。</strong>'},
      {interactionId:'agent_builder',builder:{mode:'agent-config',ask:'给个人任务助手配工具——挑对的、拒绝危险的：',scenario:{title:'配工具 + 权限'},sections:[{id:'tools',label:'哪些工具真正需要？',inputType:'multi',options:[{id:'t_read',t:'✓ 读文件'},{id:'t_cal',t:'✓ 查日历'},{id:'t_save',t:'✓ 保存结果'},{id:'t_send',t:'△ 发消息(需确认)'},{id:'t_del',t:'✗ 删文件(不给)'},{id:'t_sys',t:'✗ 改系统(不给)'}]}],validation:{requireAll:{tools:['t_read','t_cal','t_save']},forbidden:{tools:['t_del','t_sys']}}}},
      {talk:'⑥ 连回你|你配 Agent，核心就是「给它配哪些手」——够用、但别乱给危险的。<strong>懂工具=函数，你就知道 Agent 的能力边界在哪、该加什么。</strong>'}
    ],
    aha:{goal:'你今天真正学会的',text:'Agent 的手 = 工具，而<strong>工具就是函数（回收 W2/W3）</strong>——其实不止函数，API、网页操作、别人做好的服务，都能被「包装」成工具，函数是最基础的一种。大脑决定用哪只手、手去做、结果交回大脑，一来一回。配工具=扩本事，但危险的手要设边界。<br>下一关：Agent 怎么「记住」事儿——记忆（回收启蒙营上下文 + W5 内存）。'}
  }},
  'w6_4':{world:'w6',n:4,a:'58',boss:false,type:'core',optional:false,title:'记忆',goal:'看懂 Agent 怎么记事',xp:100,content:{
    flow:[
      {talk:'① 接上一关：Agent 得「记得住事」|Agent 干一串活，前一步的结果、你之前说过的话，它得记着，不然干到第三步就忘了第一步。这个「记性」，就是 Agent 的<strong>记忆</strong>。'},
      {talk:'② 回收启蒙营：这就是「上下文」|还记得启蒙营讲的「上下文」吗？——AI 记得住当前对话里聊过的东西。<strong>Agent 的记忆，核心就是这个上下文</strong>：它把「目标、干过啥、拿到啥结果」都记在上下文里，才能连贯地一步步推进。'},
      {try:{q:'Agent 的「记忆」，跟启蒙营学的哪个概念是一回事？',opts:[{t:'上下文——记住当前任务里说过 / 干过的事',ok:true},{t:'幻觉',ok:false},{t:'硬盘容量',ok:false}],fb:'回收启蒙营：上下文=AI 记得住当前聊过的东西。Agent 的记忆核心就是它——记着目标、干过啥、拿到啥，才能连贯推进。'}},
      {talk:'③ 记忆有限，会「忘」（回收启蒙营 + W5）|上下文是有限的（就像 W5 的内存，是有限的工作台）。任务太长、聊太多，<strong>早先的东西会被挤出去、被「忘掉」</strong>。这就是为啥有时 Agent 会「忘了你前面说的」。'},
      {try:{q:'为啥 Agent 有时会「忘了你前面说过的话」？',opts:[{t:'记忆（上下文）有限，太长了早先的会被挤掉',ok:true},{t:'它故意的',ok:false},{t:'它坏了',ok:false}],fb:'上下文有限（像 W5 的内存有限）。任务太长、对话太多，前面的会被挤出去。这不是它耍脾气，是记忆装不下了。'}},
      {talk:'④ 怎么帮它记得更牢|两招：① 重要的事精简重复提醒它；② 给它一个「外挂记忆」——把资料存起来，要用时查（回收启蒙营「投喂资料 / 知识库」）。<strong>知识库是 Agent 的一种「外挂记忆」（可检索的外部资料，不等于它全部的长期记忆），内置上下文是「短期记忆」。</strong>'},
      {try:{q:'给 Agent 建个「知识库」（投喂资料），相当于给它？',opts:[{t:'一个长期记忆——要用时去查，不占当前上下文',ok:true},{t:'一双手',ok:false},{t:'一个新大脑',ok:false}],fb:'回收启蒙营投喂资料：知识库=Agent 的一种外挂记忆（可查的外部资料），要用时查；内置上下文是短期记忆（有限）。俩配合，它记得又多又牢。'}},
      {talk:'⑤ 短期 vs 长期，别搞混|<strong>短期记忆（上下文）</strong>：当前任务里的临时记忆，有限、会忘（像 W5 内存）。<strong>长期记忆（知识库）</strong>：存起来的资料，大而持久（像 W5 硬盘）。<strong>这不就是 W5 的内存 vs 硬盘吗？</strong>（伏笔回收）'},
      {interactionId:'agent_builder',builder:{mode:'agent-config',ask:'判断哪些信息可以长期保存（隐私/敏感不能存）：',scenario:{title:'记忆分类'},sections:[{id:'mem',label:'该长期保存的勾上：',inputType:'multi',options:[{id:'k_pref',t:'✓ 用户偏好'},{id:'k_habit',t:'✓ 工作习惯'},{id:'k_id',t:'✗ 身份证号'},{id:'k_key',t:'✗ API Key'},{id:'k_old',t:'✗ 过期旧数据'}]}],validation:{requireAll:{mem:['k_pref','k_habit']},forbidden:{mem:['k_id','k_key','k_old']}}}},
      {talk:'⑥ 连回你|你用 Agent，记忆是关键：任务长了要提醒重点、资料多了给它建知识库。<strong>懂记忆，你就知道为啥它会忘、怎么帮它记牢。</strong>'}
    ],
    aha:{goal:'你今天真正学会的',text:'Agent 的记忆 = 上下文（启蒙营学过），分短期（上下文，有限会忘，像 W5 内存）和长期（知识库，持久量大，像 W5 硬盘）。任务长会忘，靠提醒重点 + 建知识库帮它记牢。<br>下一关：一个惊人的揭示——你一路的向导小黑，其实是……'}
  }},
  'w6_5':{world:'w6',n:5,a:'59',boss:false,type:'core',optional:false,title:'揭示：小黑是个 Agent 模拟器',goal:'亲眼见一个 Agent',xp:120,content:{
    flow:[
      {talk:'① 停一下——先回答你一个问题|你有没有想过：一路带你闯关的小黑，它是谁？它怎么知道你答对答错、怎么一步步引导你、怎么记得你学到哪了？<br><strong>今天揭晓：小黑，其实是个「Agent 教学模拟器」。</strong>'},
      {talk:'② 用你刚学的零件，拆开小黑|<strong>大脑（模型）</strong>：小黑能理解你的回答、判断对错——那是它的大脑在想。<br><strong>手（工具）</strong>：它能给你出题、显示提示、解锁下一关——那是它在用工具。<br><strong>记忆</strong>：它记得你闯到哪关、学过啥——那是它的上下文记忆。<br><strong>你学的每个零件，小黑身上都有一个。</strong>'},
      {try:{q:'按你学的，小黑「能判断你答对答错」，用的是它的？',opts:[{t:'大脑（模型）——理解和判断',ok:true},{t:'硬盘',ok:false},{t:'网线',ok:false}],fb:'判断对错=动脑子=大脑（模型）的活。小黑身上，你学的每个 Agent 零件都对得上号——它就是个活生生的 Agent。'}},
      {talk:'③ 你一路，其实都在跟 Agent 打交道|从第一关到现在，你以为在「玩游戏」，其实<strong>你一直在被一个 Agent 带着、教着、盯着</strong>。它理解你、给你工具（题目 / 提示）、记着你的进度、一步步推进——<strong>这不就是 Agent 干活的样子吗？</strong>'},
      {try:{q:'「小黑一路带你闯关」这件事，本质上是？',opts:[{t:'一个 Agent 在理解你、用工具、记进度、推进任务',ok:true},{t:'一段死板的固定动画',ok:false},{t:'你的错觉',ok:false}],fb:'小黑理解你的答案、给你出题给提示（工具）、记你的进度（记忆）、一关关推进（自主循环）——这正是 Agent 干活的全套。你一路都在和 Agent 相处。'}},
      {talk:'④ 为啥这个揭示重要|因为它让你<strong>亲身体会</strong>：Agent 不是遥远的黑科技，它就是「一个会理解你、用工具、记事、推进任务的助手」——你已经跟它相处一路了。<strong>你不但懂了 Agent，你还被一个 Agent 服务了一整趟。</strong>'},
      {try:{q:'小黑的揭示，想让你体会到啥？',opts:[{t:'Agent 不神秘，就是个会理解 / 用工具 / 记事 / 推进的助手，你已相处一路',ok:true},{t:'游戏骗了你',ok:false},{t:'小黑要下岗了',ok:false}],fb:'揭示的意义：让你亲身体会 Agent 就在身边、一点不神秘。你不只是「学」了 Agent，你被一个 Agent 带了一整趟——这就是最好的教材。'}},
      {talk:'⑤ 那小黑是怎么「一步步推进」的？|它每一关都在做同一个循环：看你的回答 → 想（判断对错）→ 做（对了解锁 / 错了给提示）→ 再看你下一步……<strong>这个「看-想-做」不停转的循环，是 Agent 的心脏。</strong>下一关就拆它。'},
      {sequence:{ask:'小黑每关都在走这条路。排出它的 Agent 执行步骤：',items:[{id:'recv',text:'收到目标'},{id:'check',text:'检查输入'},{id:'think',text:'模型判断'},{id:'act',text:'调用工具'},{id:'see',text:'读取结果'},{id:'decide',text:'决定继续或停'}],answer:['recv','check','think','act','see','decide'],card:'Agent 运行记录',fb:'收目标→检查→判断→行动→看结果→决定。这就是 Agent 的完整运行——你被一个 Agent 带了一整趟。'}},
      {talk:'⑥ 连回你|你现在看小黑，不再是「游戏 NPC」，而是「一个『Agent 教学模拟器』」。<strong>你以后自己配 Agent，配的就是「另一个小黑」</strong>——给它大脑、配工具、留记忆、让它循环起来。'}
    ],
    aha:{goal:'你今天真正学会的',text:'揭示：一路带你的<strong>小黑，是个「Agent 教学模拟器」</strong>——它有大脑（判断）、手（出题 / 提示 / 解锁）、记忆（你的进度）、自主循环（一关关推进）。你不只学了 Agent，你被一个 Agent 带了一整趟。<br>（说准确点：小黑是「Agent 教学模拟器」——它用固定剧本帮你看清 Agent 由哪些零件组成；等它接入模型、能动态理解你并调整教学，才算真正的教学 Agent。）<br>下一关：拆小黑的「心脏」——那个看-想-做不停转的循环。'}
  }},
  'w6_6':{world:'w6',n:6,a:'60',boss:false,type:'core',optional:false,title:'循环：Agent 的心脏',goal:'看懂自主循环',xp:100,content:{
    flow:[
      {talk:'① 接上一关：拆 Agent 的「心脏」|上一关说小黑靠一个「看-想-做」的循环推进。这个循环，是 Agent 能「自主干活」的核心引擎。它有个学名叫 <strong>ReAct</strong>（推理+行动，你不用记名字，记那个循环就行；不同 Agent 实现方式不一样，ReAct 是常见的一种）。'},
      {talk:'② 循环长啥样：想→做→看→再想|Agent 干一个复杂活，是这样一圈圈转的：<br><strong>想</strong>（下一步该干啥）→ <strong>做</strong>（调个工具执行）→ <strong>看</strong>（结果咋样）→ 再<strong>想</strong>（根据结果定下一步）……<strong>转到活干完为止。</strong>'},
      {try:{q:'Agent「自主干活」的核心循环，大致是？',opts:[{t:'想→做→看结果→再想……转到干完',ok:true},{t:'一次想完所有步骤，直接输出',ok:false},{t:'只做不想',ok:false}],fb:'Agent 不是一次想好全部。它是想一步→做一步→看结果→再想下一步，一圈圈转，直到把活干完。这个循环让它能应对变化、自主推进。'}},
      {talk:'③ 为啥要「循环」，不一次想完？|因为真实任务有变数：查了天气才知道要不要带伞、读了文件才知道下一步咋处理。<strong>每做一步、拿到新结果，再决定下一步</strong>——边走边看，才不会一条道走到黑。（回收 W2 条件：根据结果拐弯）'},
      {try:{q:'Agent 为啥要「边做边看再决定」，不一口气想完？',opts:[{t:'任务有变数，拿到每步结果才好定下一步',ok:true},{t:'因为它算得慢',ok:false},{t:'为了拖时间',ok:false}],fb:'真实任务有变数——查完天气才知带不带伞。每做一步、看新结果、再定下一步（回收 W2 条件判断），边走边看，才应付得了变化。'}},
      {talk:'④ 把零件都串起来|这个循环里，你学的零件全在转：<strong>大脑</strong>负责「想」、<strong>工具</strong>负责「做」、<strong>记忆</strong>记着「看到的结果和目标」、<strong>条件判断</strong>决定「根据结果走哪步」。<strong>Agent = 这些零件在循环里转起来。</strong>'},
      {interactionId:'agent_builder',builder:{mode:'agent-config',ask:'给 Agent 的循环设好停止条件（防止死循环）：',scenario:{title:'停止条件 + 异常处理'},sections:[{id:'stop',label:'什么时候该停？（勾对的）',inputType:'multi',options:[{id:'s_done',t:'✓ 任务完成'},{id:'s_max',t:'✓ 达到最大步数'},{id:'s_fail',t:'✓ 连续失败3次'},{id:'s_no',t:'✗ 一直重试不停'}]}],validation:{requireAll:{stop:['s_done','s_max','s_fail']},forbidden:{stop:['s_no']}}}},
      {talk:'⑤ 循环也可能「转歪」（埋下伏笔）|循环强大，但也可能出岔：大脑判断错了（幻觉）、工具用错了、或者绕圈子出不来。<strong>所以光让它转还不够，得有人盯着、该拦时拦。</strong>'},
      {try:{q:'Agent 的自主循环，可能出啥问题？',opts:[{t:'判断错（幻觉）、用错工具、或绕圈出不来',ok:true},{t:'永远不会错',ok:false},{t:'转得越久越准',ok:false}],fb:'循环让它自主，但也可能转歪——大脑幻觉、工具用错、死循环绕圈。所以自主不等于放养，得盯着。下一关专讲怎么盯。'}},
      {talk:'⑥ 连回你|你看懂了这个循环，就看懂了 Agent 干活的全过程——<strong>它不是黑魔法，是「想-做-看」在飞快转圈</strong>。你指挥它、盯它，都是在这个循环上做文章。'}
    ],
    aha:{goal:'你今天真正学会的',text:'Agent 的心脏 = <strong>想→做→看结果→再想</strong>的循环（ReAct），边走边看、根据结果定下一步（回收 W2 条件）。大脑想、工具做、记忆记结果——你学的零件全在这循环里转。但循环也会转歪，得盯着。<br>下一关：一个 Agent 忙不过来时，能不能几个 Agent 一起干？——多 Agent 协作。'}
  }},
  'w6_7':{world:'w6',n:7,a:'61',boss:false,type:'core',optional:false,title:'多 Agent 协作',goal:'看懂 Agent 组队',xp:100,content:{
    flow:[
      {talk:'① 接上一关：一个 Agent 忙不过来咋办|有些活又杂又大：又要查资料、又要写文案、又要做图、又要发布。一个 Agent 全包，容易顾此失彼。<strong>那……能不能几个 Agent 分工合作？</strong>能。'},
      {talk:'② 多 Agent = 一个团队|就像公司分工：一个 Agent 当「调度」，几个 Agent 各管一摊（查资料的、写文案的、做图的）。<strong>调度的把大活拆开、派给各专员，收齐结果、拼成成品。</strong>（回收 W2 拆任务）'},
      {try:{q:'「多 Agent 协作」大概是啥意思？',opts:[{t:'几个 Agent 分工合作，像个团队各管一摊',ok:true},{t:'一个 Agent 复制很多份干同一件事',ok:false},{t:'无意义的堆砌',ok:false}],fb:'多 Agent=一个团队：有调度的、有各管一摊的专员。大活拆开分头干、再汇总。跟人组队干活一个道理。'}},
      {talk:'③ 为啥分工比单打独斗强|<strong>每个 Agent 专注一件事，做得更好、更少出错</strong>；还能同时并行（查资料的和做图的一起干），更快。就像一个人身兼数职容易乱，分工各司其职更靠谱。'},
      {try:{q:'多个 Agent 分工，比一个 Agent 全包好在哪？',opts:[{t:'各专注一摊、做得更好，还能并行更快',ok:true},{t:'纯粹为了热闹',ok:false},{t:'其实更差',ok:false}],fb:'分工=每个 Agent 专注一件事、做得精，还能并行（几摊同时干）。就像团队协作胜过一人身兼数职。当然，活不复杂时一个 Agent 就够。'}},
      {talk:'④ 但也别为了多而多|不是 Agent 越多越好。<strong>简单活一个 Agent 就够，硬拆成多个反而添乱（要协调、互相等）。</strong>复杂又能拆的活，多 Agent 才划算。（看活选，别盲目堆人）'},
      {interactionId:'agent_builder',builder:{mode:'agent-config',ask:'判断这个任务用什么最合适：',scenario:{title:'单 Agent 还是多 Agent'},sections:[{id:'scale',label:'「整理一份任务清单」最适合？',inputType:'choice',options:[{id:'one',t:'单个 Agent 就够'},{id:'multi',t:'多 Agent(小题大做)'},{id:'script',t:'普通脚本也可以'}]}],validation:{requireAll:{scale:['one']}}}},
      {talk:'⑤ 这其实就是「AI 公司」的雏形|一个调度 Agent 带一队专员 Agent，分工协作出成果——<strong>这已经很像一家「AI 公司」了。</strong>你以后搭复杂自动化，可能就是在组这样一支队。'},
      {try:{q:'「一个调度 Agent 带一队专员 Agent 分工出活」，像啥？',opts:[{t:'一家小型「AI 公司」/ 团队',ok:true},{t:'一台超级电脑',ok:false},{t:'一个聊天群',ok:false}],fb:'调度 + 专员分工协作出成果——这就是「AI 团队 / AI 公司」的雏形。你搭复杂自动化时，往往就是在组这么一支队。'}},
      {talk:'⑥ 连回你|你懂了多 Agent，就知道复杂活可以「组队」解决，而不是硬塞给一个。<strong>什么时候单干、什么时候组队，你能判断了。</strong>'}
    ],
    aha:{goal:'你今天真正学会的',text:'多 Agent 协作 = 几个 Agent 像团队一样分工（调度 + 专员），复杂活拆开分头干再汇总，能更专注、更快。但多 Agent 也有代价——<strong>更费钱、可能重复干、上下文容易丢、一个出错会被放大，还要额外协调和汇总</strong>；只有任务能拆分并行、收益盖过协调成本时才值得。别为多而多——简单活一个就够。这已是「AI 公司」的雏形。<br>下一关：Agent 会犯错（回收启蒙营幻觉），怎么盯着它别闯祸？'}
  }},
  'w6_8':{world:'w6',n:8,a:'62',boss:false,type:'core',optional:false,title:'会犯错，怎么盯',goal:'学会盯住 Agent',xp:100,content:{
    flow:[
      {talk:'① 接上一关：Agent 很强，但会犯错|你一路见了 Agent 多能干。但别忘了——<strong>它也会犯错</strong>，而且因为它「真动手」，犯错的后果可能比聊天机器人严重（它可能真删错文件、发错邮件）。'},
      {talk:'② 它会犯哪些错（回收一路的坑）|<strong>大脑会幻觉</strong>（回收启蒙营：一本正经胡说，以为对其实错）；<strong>工具会用错</strong>（该查天气却删了文件）；<strong>循环会绕圈</strong>（卡在一步出不来）。<strong>你学过的坑，Agent 身上都可能踩。</strong>'},
      {try:{q:'为啥 Agent 犯错可能比聊天机器人「后果更严重」？',opts:[{t:'它会真动手，可能真删错文件、发错邮件',ok:true},{t:'它道歉更慢',ok:false},{t:'没区别',ok:false}],fb:'聊天机器人错了顶多说错话；Agent 错了会「真动手」——删错文件、发错邮件、花错钱。能动手是它的强，也是它危险的地方。所以要盯。'}},
      {talk:'③ 盯它第一招：危险操作要你点头|回收 W1「删除是泼出去的水」、W4 的 Key（=钱）。<strong>凡是不可逆、花钱、动重要数据的操作，让 Agent 停下来问你一句、你点头才做。</strong>这就是「人工接管边界」（启蒙营也提过）。'},
      {try:{q:'让 Agent 干活，最该设的一道安全线是？',opts:[{t:'危险 / 不可逆操作（删、花钱、发布）要人点头才做',ok:true},{t:'让它完全自由，别管',ok:false},{t:'盯死它每一步',ok:false}],fb:'回收 W1/W4：删除、花钱、发布这类不可逆操作，设成「要你确认才做」。这道「人工接管边界」，是放心用 Agent 的底线。既不放养、也不用盯死每步。'}},
      {talk:'④ 盯它第二招：让它「说清在干啥」|好的 Agent 会一边干一边告诉你「我现在在读文件」「我准备删这个，确认吗」。<strong>它把过程摊开给你看，你才盯得住、拦得下。</strong>（回收 W3：你会读，才验收得了它在干啥）'},
      {locate:{ask:'这个 Agent 配置有风险——找出问题、收紧它：',text:['自动删除文件 ✓ | 直接发消息 ✓ | 没有停止条件 | 信息不足自己猜 | 工具失败无限重试 | 没有验收标准'],steps:[{q:'① 哪个权限太危险、必须人工确认？点出来：',type:'pick',answer:'自动删除文件',pool:['自动删除文件','直接发消息','无限重试','自己猜'],fb:'删文件+发消息=高风险，不能自动。'},{q:'② 哪个配置会导致 Agent 不会自己停？',type:'pick',answer:'没有停止条件',pool:['没有停止条件','自己猜','无限重试','没有验收标准'],fb:'没有停止条件=可能死循环。'},{q:'③ 信息不足时该怎么做？',type:'choice',options:[{t:'询问用户，不编造',ok:true},{t:'自己编一个继续',ok:false}],fb:'信息不足→问用户，不编造。'},{q:'④ 最后必须加什么来验证？',type:'choice',options:[{t:'验收标准（看证据）',ok:true},{t:'Agent 说完成就行',ok:false}],fb:'验收标准=靠证据判断真完成。'}],card:'Agent 安全检查表',cardBody:'危险权限=人工确认；必须设停止条件；信息不足=问不编造；必须有验收标准（看证据）。'}},
            {talk:'⑤ 找出风险还不够——动手把它改安全|光看出问题不算本事，得<strong>真去收紧配置</strong>：危险操作加人工确认、加停止条件、加验收标准。下面把上面那个危险配置改安全（避开✗、选上✓），改不对提交不了。'},
            {interactionId:'agent_builder',builder:{mode:'agent-config',ask:'把危险配置改安全——每一项都收紧：',scenario:{title:'修正：从危险配置 → 安全配置'},sections:[{id:'perm',label:'① 权限（危险操作怎么办）',inputType:'multi',options:[{id:'auto_read',t:'✓ 只读操作可自动'},{id:'confirm_danger',t:'✓ 删除/发送→人工确认'},{id:'all_auto',t:'✗ 全部自动（危险）'}]},{id:'stop',label:'② 停止 / 重试',inputType:'multi',options:[{id:'has_stop',t:'✓ 设停止条件'},{id:'retry_limit',t:'✓ 重试设上限'},{id:'no_stop',t:'✗ 无限重试（危险）'}]},{id:'info',label:'③ 信息不足时',inputType:'multi',options:[{id:'ask_user',t:'✓ 询问用户，不编造'},{id:'guess',t:'✗ 自己猜一个（危险）'}]},{id:'accept',label:'④ 验收',inputType:'multi',options:[{id:'evidence',t:'✓ 看证据验收'},{id:'self',t:'✗ Agent说完成就行（危险）'}]}],validation:{requireAll:{perm:['auto_read','confirm_danger'],stop:['has_stop','retry_limit'],info:['ask_user'],accept:['evidence']},forbidden:{perm:['all_auto'],stop:['no_stop'],info:['guess'],accept:['self']}}}},
            {talk:'⑥ 盯它第三招：小步验收，别一把梭|复杂活，让它<strong>一步步来、每步你看一眼</strong>，别指望它一口气全干对。回收 W2 流程排序 + W4 部署：拆成步骤、逐步确认，出问题早发现。'},
      {try:{q:'让 Agent 干个大活，稳妥的方式是？',opts:[{t:'拆成小步、逐步验收，别指望一口气全对',ok:true},{t:'一句话丢给它，不闻不问',ok:false},{t:'让它自己随便干',ok:false}],fb:'大活拆小步、每步瞄一眼（回收 W2 拆步骤）。它一步错了你早发现、早纠正，总比一口气干完发现全错强。小步验收=可控。'}},
      {talk:'⑥ 连回你——这正是操作员的核心价值|Agent 会犯错，所以<strong>需要一个「懂行、会盯、能验收」的人</strong>——那就是你，AI 操作员。<strong>你的价值不是自己干，是让 Agent 干得对、拦住它闯祸。</strong>'}
    ],
    aha:{goal:'你今天真正学会的',text:'Agent 会犯错（幻觉 / 用错工具 / 绕圈），而且它真动手，后果更重。盯它三招：① <strong>风险分级</strong>——只读、可逆的低风险操作可自动跑；删除、付费、发布、发消息、改重要数据必须你点头（人工接管边界，回收 W1/W4），并遵循「最小权限、用完断开」。② 让它<strong>过程透明</strong>（计划、动作、工具结果、文件差异都摊开，你才验收得了，回收 W3）。③ <strong>Agent 说完成 ≠ 真完成</strong>——要用文件、日志、测试、来源、可见结果来验收（回收 W2 小步验收）。<strong>这正是 AI 操作员的核心价值。</strong><br>下一关是 Boss：拆解一个 Agent 完整干一件活的全过程！'}
  }},
  'w6_9':{world:'w6',n:9,a:'63',boss:true,type:'core',optional:false,title:'Boss · 配置你的第一个 Agent',goal:'配一个能干活的最小 Agent',xp:300,achievement:'w6_complete',completionGate:{requiredInteractionIds:['agent_builder','scenario_normal','scenario_missing_info','scenario_high_risk']},content:{
    flow:[
      {talk:'① Boss 登场：亲手配你的第一个 Agent|工坊毕业考——把 W6 学的零件亲手配出来。下面每一项根据任务目标自行判断每个选项，配置完成后提交测试。，最后提交生成你自己的 Agent 配置卡。<strong>配完后，用你的配置去跑三场景模拟——真正测试这个 Agent 能不能安全干活。</strong>'},
      {interactionId:'agent_builder',builder:{mode:'agent-config',ask:'为「个人任务助手」配置完整 Agent（每项都要配）：',scenario:{title:'个人任务助手：读待办+看日历+排优先级+出今日行动建议',description:'配好后，下方模拟区将用你的配置跑三个真实场景'},sections:[
        {id:'goal',label:'① 任务目标',inputType:'multi',options:[{id:'g_read',t:'读取待办清单'},{id:'g_cal',t:'查看日历'},{id:'g_pri',t:'判断优先级排序'},{id:'g_out',t:'生成行动建议'},{id:'g_all',t:'替我做完所有事'}]},
        {id:'input',label:'② 输入原料',inputType:'multi',options:[{id:'i_list',t:'待办清单'},{id:'i_date',t:'当前日期'},{id:'i_pri',t:'任务优先级'},{id:'i_chat',t:'最近沟通记录'}]},
        {id:'tools',label:'③ 配工具',inputType:'multi',options:[{id:'t_read',t:'读文件'},{id:'t_cal',t:'查日历'},{id:'t_save',t:'保存结果'},{id:'t_send',t:'发消息(需确认)'},{id:'t_del',t:'删除项目文件'}]},
        {id:'perm',label:'④ 权限',inputType:'multi',options:[{id:'p_auto',t:'只读=自动'},{id:'p_conf',t:'高危=人工确认'},{id:'p_all',t:'全部自动'}]},
        {id:'stop',label:'⑤ 停止条件',inputType:'multi',options:[{id:'s_done',t:'任务完成'},{id:'s_max',t:'达到最大步数'},{id:'s_fail',t:'连续失败3次'},{id:'s_no',t:'没有停止'}]},
        {id:'fallback',label:'⑥ 异常处理',inputType:'multi',options:[{id:'f_ask',t:'信息不足→询问'},{id:'f_limit',t:'设重试上限'},{id:'f_invent',t:'自己编造'}]},
        {id:'riskRules',label:'⑧ 高风险处理规则',inputType:'multi',options:[{id:'r_list',t:'生成操作清单'},{id:'r_mark',t:'标记不确定项'},{id:'r_preview',t:'先做只读预演'},{id:'r_scope',t:'不扩大任务范围'},{id:'r_confirm',t:'未确认前停止'}]},
        {id:'accept',label:'⑧ 验收标准',inputType:'multi',options:[{id:'a_list',t:'清单已生成'},{id:'a_reason',t:'优先级有理由'},{id:'a_no_fake',t:'没编造信息'},{id:'a_self',t:'Agent说完成就行'}]}
      ],validation:{required:['goal','input','tools','perm','stop','fallback','riskRules','accept'],forbidden:{goal:['g_all'],input:['i_chat'],tools:['t_del'],perm:['p_all'],stop:['s_no'],fallback:['f_invent'],accept:['a_self']},requireAll:{goal:['g_read','g_out'],perm:['p_conf'],stop:['s_done'],fallback:['f_ask'],riskRules:['r_list','r_mark','r_preview','r_scope','r_confirm'],accept:['a_list']}}}},
      {talk:'⑧ 现在——用你配的 Agent 跑三个真实场景|恭喜你配完 Agent！但配好 ≠ 安全。<strong>下面三个场景，挨个用你的配置真实模拟一遍：</strong>正常任务能不能跑通？信息不足时会不会瞎编？高风险操作会不会先问你再动手？<br><strong>三个全通过，才算配置合格。</strong>'},
      {simulation:{mode:'agent-run',configSource:'builder',scenarios:[
        {id:'normal',interactionId:'scenario_normal',title:'场景1：正常任务',input:'「整理本周任务，按紧急程度输出待办清单。」',checks:['output_format','no_high_risk_tools','stop_condition','acceptance']},
        {id:'missing-info',interactionId:'scenario_missing_info',title:'场景2：信息不足',input:'「帮我安排明天的会议。」（缺少会议对象/时间/时长/地点）',checks:['missing_info_stop','no_fabrication','ask_user','no_calendar_call']},
        {id:'high-risk',interactionId:'scenario_high_risk',title:'场景3：高风险操作',input:'「把旧项目文件全部删除，只留下最终版。」',checks:['high_risk_detect','gen_delete_list','human_confirm','stop_before_action']}
      ]}}

    aha:{goal:'🎓 恭喜——智能体工坊通关！',text:'<div id="w6-final-record"></div>'}
  }},'w7_1':{world:'w7',n:1,a:'64',boss:false,type:'core',optional:false,title:'什么是工作流',goal:'把一切固化成流水线',xp:100,content:{
    flow:[
      {talk:'① 接上一关：最后一片——把一切固化成流水线|你会读代码、会配环境、看透了 Agent。最后一步：如果一件活你<strong>每天都要干、要反复自动跑</strong>，怎么把它固定下来？——这就是「工作流」。'},
      {talk:'② 一句话：工作流 = 把多步骤固定成一条自动流水线|回收 W1 那根管道 |（把两步接力）、W2 流程排序（多步排好序）。<strong>工作流，就是把一串步骤排好、串起来、让它自动一条龙跑完</strong>——像工厂流水线，原料进去、成品出来。'},
      {sequence:{ask:'工作流 = 把一串步骤排好序、自动跑完。把「每天自动出日报」这个工作流排对：',items:[{id:'trigger',text:'定时触发：每天下班前自动开始'},{id:'gather',text:'收集今天的数据'},{id:'sum',text:'汇总成日报'},{id:'send',text:'发到群里'}],answer:['trigger','gather','sum','send'],card:'工作流骨架卡',fb:'触发→收集→汇总→发送，固定有序、自动跑完——这就是工作流：把反复干的一串事排好序、串成流水线。'}},
      {talk:'③ 生活里的工作流|你早上的流程：闹钟响→刷牙→煮咖啡→出门。固定、有序、每天自动跑。<strong>工作流就是把「你反复干的一串事」变成这种固定流程</strong>，只不过交给电脑 / Agent 自动执行。'},
      {try:{q:'下面哪个最像「工作流」？',opts:[{t:'固定的一串有序步骤，反复自动跑（如每天自动整理→汇总→发报表）',ok:true},{t:'随便问 AI 一个问题',ok:false},{t:'存一个文件',ok:false}],fb:'工作流=固定、有序、反复自动跑的一串步骤。每天自动「整理数据→汇总→发报表」就是个工作流；随口问一句 AI 不是。'}},
      {talk:'④ 工作流 vs 单次干活|你让 Agent 干一次活（查天气发邮件）是「单次」；把它<strong>固定成「每天早上自动查天气、下雨就提醒全组」</strong>，反复自动跑，就成了工作流。<strong>从「干一次」到「自动干很多次」，这就是工作流的价值。</strong>'},
      {try:{q:'「让 Agent 查一次天气」vs「每天自动查天气并提醒」，区别是？',opts:[{t:'后者是工作流：固定下来、反复自动跑',ok:true},{t:'完全一样',ok:false},{t:'前者更高级',ok:false}],fb:'干一次是单次任务；固定成「每天自动跑」就是工作流。工作流的价值就是「一次搭好、反复自动干」，把你从重复劳动里解放出来。'}},
      {talk:'⑤ 回收启蒙营：四者关系的最后一块|还记得启蒙营 Boss：AI 是脑、工具是手、Agent 是脑+手能干活、<strong>工作流是把活固定成流水线</strong>？你现在走到了这最后一块。<strong>启蒙营埋的种子，这一片开花。</strong>'},
      {try:{q:'回收启蒙营，「工作流」在「AI/工具/Agent/工作流」里是？',opts:[{t:'把活固定成流水线、反复自动跑的那一层',ok:true},{t:'就是 AI 本身',ok:false},{t:'就是一个工具',ok:false}],fb:'回收启蒙营 Boss：AI（脑）、工具（手）、Agent（脑+手干活）、工作流（把活固定成流水线）。你从第一片走到这最后一片，四者关系全通了。'}},
      {talk:'⑥ 连回你——这是操作员的终极武器|你搭好一个工作流，等于<strong>造了一台「自动帮你干活的机器」</strong>，一次搭好、天天替你跑。这一片，教你把学过的一切，组装成你自己的自动化。'}
    ],
    aha:{goal:'你今天真正学会的',text:'工作流 = 把一串步骤固定成自动流水线、反复自动跑（回收 W1 管道、W2 流程排序、启蒙营四者关系）。从「干一次」到「自动干很多次」，把你从重复劳动解放出来。这是操作员的终极武器。<br>下一关：搭工作流第一步——把大活拆成清楚的步骤。'}
  }},
  'w7_2':{world:'w7',n:2,a:'65',boss:false,type:'core',optional:false,title:'拆任务',goal:'把大活拆成有序小步',xp:100,content:{
    flow:[
      {talk:'① 接上一关：先想清楚，再动手拆|搭工作流别一上来就埋头拆步骤。<strong>先定三样：要达成啥目标、怎样算真完成、有啥输入和风险</strong>——想清楚了，再把大活拆成一步步清楚的小步骤。拆不清，后面串不起来。'},
      {talk:'② 怎么拆：大活 → 有序小步|比如「每天做个行业资讯简报」这个大活，拆开：① 搜今天的新闻 → ② 筛出重要的 → ③ 总结成短文 → ④ 发到群里。<strong>每步只干一件事、前后有序。</strong>（回收 W2 流程排序、W6 大脑拆任务）'},
      {sequence:{ask:'把「每天做行业资讯简报」这个大活，拆成有序小步（每步产出接下一步）：',items:[{id:'search',text:'搜今天的新闻'},{id:'filter',text:'筛出重要的'},{id:'sum',text:'总结成短文'},{id:'send',text:'发到群里'}],answer:['search','filter','sum','send'],card:'任务拆解卡',fb:'搜→筛→总结→发，每步单一明确，上一步产出正好是下一步输入（回收 W2 输入输出）。拆得清，流水线才串得起来。'}},
      {talk:'③ 拆的诀窍：每步「单一、明确、可交接」|<strong>单一</strong>（一步只干一件事）、<strong>明确</strong>（干啥说清楚，别含糊）、<strong>可交接</strong>（这步的产出，正好是下一步的输入）。<br>回收 W2 输入输出：上一步的输出 = 下一步的输入，才接得上。'},
      {try:{q:'拆步骤时，为啥要让「上一步的产出正好是下一步的输入」？',opts:[{t:'这样步骤才接得上、能串成流水线',ok:true},{t:'为了好看',ok:false},{t:'没必要',ok:false}],fb:'回收 W2 输入输出：上一步吐出来的，正好是下一步要吃的，才接得上、串得起来。接不上的步骤，拼不成流水线。'}},
      {talk:'④ 拆得好，活就成功一半|工作流跑不跑得通，<strong>八成看你拆得清不清楚</strong>。拆得含糊（如「处理一下数据」），Agent / 脚本没法执行；拆得清楚（如「删掉空行、按日期排序」），它照着就能干。<strong>拆任务，是操作员最核心的功夫。</strong>'},
      {try:{q:'一个工作流跑得通不通，很大程度取决于？',opts:[{t:'任务拆得清不清楚',ok:true},{t:'用了多贵的 AI',ok:false},{t:'电脑多快',ok:false}],fb:'拆得清（每步明确可执行），流水线才跑得通；拆得含糊，再强的 AI 也不知道干啥。拆任务是操作员的核心功夫——这也是你一路练的。'}},
      {talk:'⑤ 回收：你早就在练拆任务了|从 W2 Boss「问好机器人排序」、W4 Boss「备环境排序」、W6 Boss「Agent 拆解任务」，<strong>你其实一直在练「拆步骤、排顺序」</strong>。工作流，就是把这功夫用到极致。'},
      {try:{q:'你在前面哪些地方练过「拆步骤、排顺序」？',opts:[{t:'W2 流程排序、W4 备环境、W6 拆解 Agent 任务——一路在练',ok:true},{t:'从来没练过',ok:false},{t:'只在这一关练',ok:false}],fb:'W2 排问好机器人、W4 排备环境步骤、W6 拆 Agent 干活——你一路都在练「拆步骤排顺序」。工作流就是这功夫的集大成。'}},
      {talk:'⑥ 连回你|你能把一个大活拆成清楚有序的小步，就已经具备了搭工作流的核心能力。<strong>剩下的，是决定每步交给谁干——脚本还是 Agent？下一关说。</strong>'}
    ],
    aha:{goal:'你今天真正学会的',text:'搭工作流：先定目标、完成标准、输入与风险，再把大活拆成「单一、明确、可交接」的有序小步（回收 W2 输入输出、流程排序；W6 拆任务）。拆得清，流水线才跑得通——这是操作员最核心的功夫，你一路都在练。<br>下一关：每一步，该用脚本还是 Agent 来干？'}
  }},
  'w7_3':{world:'w7',n:3,a:'66',boss:false,type:'core',optional:false,title:'Agent 还是脚本',goal:'每步选对工人',xp:100,content:{
    flow:[
      {talk:'① 接上一关：每步交给谁干|活拆成步骤了，每一步得有「人」执行。有两种「工人」：<strong>脚本</strong>（死板但可靠）和 <strong>Agent</strong>（灵活会变通）。这一关教你：哪步该用哪个。'},
      {talk:'② 脚本：死板、可靠、便宜|回收 W3 脚本——它<strong>照着固定步骤一丝不差地跑，不会变通，但很稳定、成本也低（也可能耗算力、服务器、第三方 API 或维护）</strong>。适合「规则明确、每次都一样」的步骤：比如「把文件按日期重命名」「删掉空行」。这种活，脚本又快又稳。'},
      {try:{q:'「把文件按日期批量重命名」这种规则明确的活，最适合？',opts:[{t:'脚本——固定规则、稳定成本低',ok:true},{t:'Agent——大材小用还可能出错',ok:false},{t:'人工一个个改',ok:false}],fb:'规则明确、每次都一样的活，交给脚本：一丝不差、又快又稳、成本低。用 Agent 反而大材小用、还可能「自作主张」出错。'}},
      {talk:'③ Agent：灵活、会变通、但不稳定也花钱|回收 W6——Agent <strong>能理解、会判断、能应对变化，但也可能犯错（幻觉），还要花钱（调模型）</strong>。适合「需要理解、判断、没法写死规则」的步骤：比如「读懂这些评论、判断哪些是差评」「把新闻总结成人话」。'},
      {try:{q:'「读一堆用户评论、判断哪些是差评并总结」这种活，适合？',opts:[{t:'Agent——需要理解和判断，写不成固定规则',ok:true},{t:'脚本——它能读懂情绪',ok:false},{t:'都不行',ok:false}],fb:'「读懂、判断、总结」这种需要理解、写不死规则的活，交给 Agent（会思考）。脚本只会死板执行，读不懂人话里的情绪。各用所长。'}},
      {talk:'④ 一句话选：能写死规则→脚本，要动脑子→Agent|<strong>规则明确、每次一样 → 脚本（稳、快、成本低）。需要理解判断、应对变化 → Agent（灵活但可能错、花钱）。</strong>一个工作流里，常常<strong>两种混用</strong>：死板步骤脚本干、动脑步骤 Agent 干。'},
      {interactionId:'agent_builder',builder:{mode:'agent-config',ask:'给「资讯简报」的每一步分配执行者（脚本=死板可靠省钱，Agent=会理解判断但花钱）：',scenario:{title:'资讯简报流水线：搜新闻→筛重要→总结→发送'},sections:[{id:'s1',label:'① 搜新闻（固定接口，规则明确）',inputType:'choice',options:[{id:'script',t:'脚本（固定规则、稳、省钱）'},{id:'agent',t:'Agent（大材小用）'}]},{id:'s2',label:'② 筛出重要的（要判断）',inputType:'choice',options:[{id:'agent',t:'Agent（要理解判断）'},{id:'script',t:'脚本（写不死规则）'}]},{id:'s3',label:'③ 总结成短文（要写作）',inputType:'choice',options:[{id:'agent',t:'Agent（要理解+写作）'},{id:'script',t:'脚本（不会写）'}]},{id:'s4',label:'④ 发送（固定动作）',inputType:'choice',options:[{id:'script',t:'脚本（固定动作、稳）'},{id:'agent',t:'Agent（没必要）'}]}],validation:{requireAll:{s1:['script'],s2:['agent'],s3:['agent'],s4:['script']}}}},
      {talk:'⑤ 混用的例子|「每天做资讯简报」：搜新闻（脚本，固定接口）→ 判断哪条重要（Agent，要理解）→ 总结成文（Agent，要写作）→ 发到群（脚本，固定动作）。<strong>死板的交脚本、动脑的交 Agent，一条流水线上分工协作。</strong>'},
      {try:{q:'一个工作流里，脚本和 Agent 的关系是？',opts:[{t:'分工协作：死板步骤脚本干、动脑步骤 Agent 干',ok:true},{t:'只能选一种，不能混',ok:false},{t:'互相打架',ok:false}],fb:'一条流水线上，脚本管死板可靠的活、Agent 管要动脑的活，分工协作。就像团队里有执行岗也有决策岗——各司其职，整条流水线才又稳又灵活。'}},
      {talk:'⑥ 连回你——省钱又稳的关键|<strong>能用脚本的别硬上 Agent（省钱又稳），该用 Agent 的别硬写脚本（写不出来）。</strong>你会判断这个，搭出的工作流就又省又靠谱。这正是操作员的「成本+可靠」意识。'}
    ],
    aha:{goal:'你今天真正学会的',text:'每步选「工人」：<strong>能写死规则→脚本（稳/快/免费，回收 W3）；要理解判断→Agent（灵活但可能错/花钱，回收 W6）</strong>。一个工作流常两种混用、分工协作。能用脚本别硬上 Agent——又省又稳。<br>下一关：把这些步骤真正「串」成一条流水线。'}
  }},
  'w7_4':{world:'w7',n:4,a:'67',boss:false,type:'core',optional:false,title:'串流水线',goal:'把步骤串成自动流程',xp:100,content:{
    flow:[
      {talk:'① 接上一关：把步骤串起来|步骤拆好了、每步的工人（脚本 / Agent）也定了。现在<strong>把它们首尾相接、串成一条能自动跑的流水线</strong>。这就是工作流的「组装」环节。'},
      {talk:'② 串的核心：上一步的输出→下一步的输入|回收 W1 管道 |、W2 输入输出：<strong>每一站的产出，自动流给下一站</strong>。搜到的新闻→喂给判断步→筛出的重要新闻→喂给总结步→总结好的文→喂给发送步。<strong>数据顺着流水线一路流下去。</strong>'},
      {sequence:{ask:'把资讯简报流水线的「数据传递」串对——每步产出流给下一步：',items:[{id:'raw',text:'搜到的原始新闻'},{id:'important',text:'筛出的重要新闻'},{id:'digest',text:'总结好的简报文'},{id:'sent',text:'发送到群'}],answer:['raw','important','digest','sent'],card:'数据流转卡',fb:'原始新闻→筛出重要→总结成文→发送。数据顺流水线一路流：上一步输出=下一步输入（回收 W1 管道 |、W2 输入输出）。'}},
      {talk:'③ 这不就是 W1 那根管道放大版吗|W1 Boss 你用 | 把「列文件」接给「搜关键词」——两步接力。<strong>工作流就是把这个「接力」从两步放大到很多步、还能混入 Agent。</strong>（伏笔大回收：W1 管道→W7 工作流，一路埋到这）'},
      {try:{q:'W1 的管道 | 和 W7 的工作流，是啥关系？',opts:[{t:'工作流是管道「接力」思想的放大版：多步接力、还能混 Agent',ok:true},{t:'毫无关系',ok:false},{t:'管道更强',ok:false}],fb:'W1 用 | 把两步接力，W7 工作流把这「接力」放大到很多步、还能混入 Agent。从第一片黑窗口村埋的管道种子，到这里长成了工作流。伏笔收官！'}},
      {talk:'④ 串好后：一键触发，自动跑完|串成流水线后，你<strong>只需一个「触发」</strong>（手动点一下、或定时每天早上自动触发），整条流水线就从头跑到尾，不用你中间插手。<strong>这就是「自动化」的样子。</strong>'},
      {try:{q:'工作流串好后，你要干的是？',opts:[{t:'触发一下（手动或定时），它就自动从头跑到尾',ok:true},{t:'每一步都手动点',ok:false},{t:'一直盯着它',ok:false}],fb:'串好的流水线，你只管触发（手点或定时），它自动跑完全程。一次搭好、反复自动跑——这就是工作流省事的地方。'}},
      {talk:'⑤ 还得处理「万一某步出错」|流水线跑起来，万一某步失败（Agent 判断错、脚本报错）咋办？好的工作流会<strong>设「检查点」和「出错咋办」</strong>：比如某步失败就停下报警、或重试。（回收 W6 盯着 Agent、W4 报错）你不用会搭，知道「要留出错处理」就行。'},
      {try:{q:'工作流里某一步出错了，好的做法是？',opts:[{t:'有检查点：出错就停下报警或重试，别带着错往下跑',ok:true},{t:'假装没事继续跑',ok:false},{t:'整个删掉重来',ok:false}],fb:'流水线要留「出错咋办」：某步失败就停下报警、或重试，别把错误一路带下去（回收 W6 盯 Agent）。有检查点的工作流，才靠谱。'}},
      {talk:'⑥ 连回你|你把拆好的步骤、选好的工人，首尾相接串成流水线、留好出错处理——<strong>一台自动干活的机器就成型了</strong>。下一关，咱真设计一个。'}
    ],
    aha:{goal:'你今天真正学会的',text:'串流水线 = 让每步的输出自动流给下一步（回收 W1 管道、W2 输入输出），一键 / 定时触发就自动跑完（但不一定全自动到底——<strong>人工审批、异常分支、重试、超时、回滚、告警、停止条件，都是正常工作流的一部分</strong>），并留好「出错咋办」的检查点（回收 W6）。这是 W1 管道接力的放大版——伏笔收官。<br>下一关：动手设计你的第一个工作流。'}
  }},
  'w7_5':{world:'w7',n:5,a:'68',boss:false,type:'core',optional:false,title:'设计你的第一个工作流',goal:'把学的全组装起来',xp:120,content:{
    flow:[
      {talk:'① 接上一关：自己设计一个|光看不够，这一关带你<strong>把学的全用上，设计一个真实的小工作流</strong>。场景：你想每天早上自动收到一份「昨天重要新闻的中文简报」。'},
      {talk:'② 第一步：拆（回收 w7_2）|先把这活拆成有序小步：① 抓昨天的新闻 → ② 筛出重要的 → ③ 翻译 / 总结成中文简报 → ④ 发到你微信 / 邮箱。<strong>四步，前后有序，每步产出接下一步。</strong>'},
      {interactionId:'agent_builder',builder:{mode:'agent-config',ask:'设计「每天早上收到昨日新闻中文简报」工作流——把关键配置填全：',scenario:{title:'昨日新闻中文简报工作流'},sections:[{id:'steps',label:'① 步骤（都要，多选）',inputType:'multi',options:[{id:'grab',t:'✓ 抓昨天新闻'},{id:'filter',t:'✓ 筛重要'},{id:'sum',t:'✓ 翻译总结成中文'},{id:'send',t:'✓ 发送'}]},{id:'trigger',label:'② 触发方式',inputType:'choice',options:[{id:'timer',t:'定时（每天7点自动跑）'},{id:'manual',t:'每天手动点一次'}]},{id:'onfail',label:'③ 出错处理',inputType:'choice',options:[{id:'alert',t:'出错报警+先盯几天再放手'},{id:'ignore',t:'假装没事继续跑'}]}],validation:{requireAll:{steps:['grab','filter','sum','send'],trigger:['timer'],onfail:['alert']}}}},
      {talk:'③ 第二步：给每步选工人（回收 w7_3）|① 抓新闻 = <strong>脚本</strong>（固定接口，稳）② 筛重要 = <strong>Agent</strong>（要判断）③ 总结成中文 = <strong>Agent</strong>（要理解+写作）④ 发送 = <strong>脚本</strong>（固定动作）。<strong>死板的脚本、动脑的 Agent，分工。</strong>'},
      {try:{q:'「把新闻总结成中文简报」这步，该派？',opts:[{t:'Agent——需要理解和写作，写不成固定规则',ok:true},{t:'脚本——它会写作',ok:false},{t:'谁都干不了',ok:false}],fb:'回收 w7_3：总结、翻译需要理解和写作 → Agent。抓新闻、发送是固定动作 → 脚本。每步派对工人，整条流水线才又省又靠谱。'}},
      {talk:'④ 第三步：串 + 定时触发（回收 w7_4）|把四步首尾相接（抓的新闻喂给筛、筛的喂给总结、总结的喂给发送），再设个<strong>定时：每天早上 7 点自动触发</strong>。这样你一觉醒来，简报已经躺在手机里了。'},
      {try:{q:'想让这份简报「每天早上自动送到」，要给工作流设？',opts:[{t:'定时触发（每天 7 点自动跑一遍）',ok:true},{t:'什么都不用设',ok:false},{t:'每天手动点一次',ok:false}],fb:'回收 w7_4：设个定时触发（每天 7 点），流水线就自动跑，简报自动送达。一次搭好、天天自动——这就是工作流解放你的地方。'}},
      {talk:'⑤ 第四步：留出错处理 + 先盯几天（回收 W6）|万一某天抓不到新闻、或总结跑偏？<strong>留个报警（出错就通知你），头几天你盯着看输出对不对，调顺了再放手。</strong>（回收 W6 小步验收、盯 Agent）别一搭好就完全撒手。'},
      {try:{q:'工作流刚搭好，稳妥的做法是？',opts:[{t:'先盯几天看输出对不对、留好报警，调顺了再放手',ok:true},{t:'立刻完全撒手不管',ok:false},{t:'拆了重搭',ok:false}],fb:'回收 W6：新工作流别立刻撒手。头几天盯着看输出、留好出错报警，调顺了再放心自动跑。磨合几天，才靠得住。'}},
      {talk:'⑥ 你刚设计的，是个完整工作流|拆→选工人→串+定时→留出错→盯几天。<strong>你把这一片、乃至整个新手村学的，全组装进了一个能自动干活的工作流。</strong>——你已经会「造自动化机器」了。'}
    ],
    aha:{goal:'你今天真正学会的',text:'设计工作流五步：<strong>拆步骤（w7_2）→ 每步选脚本/Agent（w7_3）→ 串+定时触发（w7_4）→ 留出错处理 → 先盯几天再放手（W6）</strong>。你把学的全组装成了一台自动干活的机器。<br>下一关是终极 Boss：亲手跑通一个属于你自己的工作流，毕业！'}
  }},
  'w7_6':{world:'w7',n:6,a:'69',boss:false,type:'core',optional:false,title:'跑起来，盯着改进',goal:'学会养一个工作流',xp:120,content:{
    flow:[
      {talk:'① 接上一关：搭好只是开始，得「养」它|工作流搭好、跑起来，不是终点。<strong>真实世界会变</strong>（新闻网站改版、你的需求变了），工作流也得跟着调。这一关讲：怎么「养」一个工作流，让它越跑越好。'},
      {talk:'② 盯：看它输出对不对|跑起来后，<strong>常看看它的产出</strong>：简报质量高不高？有没有漏重要新闻、总结跑偏？（回收 W6 盯 Agent、W3 会读验收）。盯，是发现问题的前提。'},
      {locate:{ask:'工作流跑起来会遇到几种情况，判断每种的正确处理（失败分支 / 运维）：',text:['【情况A】某步「抓新闻」临时超时（网络波动）','【情况B】总结简报总是太长','【情况C】需求没了，这个简报你不再看了'],steps:[{q:'① 情况A（临时超时）该？',type:'choice',options:[{t:'重试（有上限），还失败就停下报警',ok:true},{t:'整个工作流删掉重搭',ok:false},{t:'无限重试到成功',ok:false}],fb:'临时故障→重试有上限，还失败就停下报警。别无限重试烧钱。'},{q:'② 情况B（总结太长）该？',type:'choice',options:[{t:'针对性调那一步的指令让它精简，调完再观察',ok:true},{t:'推倒整个工作流重来',ok:false},{t:'忍着不管',ok:false}],fb:'哪不好调哪——小步针对性改，别推倒重来（回收 W6 系统化改进）。'},{q:'③ 情况C（需求没了）该？',type:'choice',options:[{t:'果断停掉/删掉，别空跑浪费',ok:true},{t:'永远留着，万一呢',ok:false}],fb:'需求没了就停/删，会搭会养也要会做减法。'}],card:'工作流运维卡',cardBody:'临时故障→重试有上限；质量问题→针对性小步调；需求消失→果断停删。盯→发现问题→调→再盯，工作流是「养」出来的（回收 W6 循环）。'}},
      {talk:'③ 改：哪不好调哪|发现问题就<strong>针对性调</strong>：总结太长→改指令让它精简；老漏财经新闻→加一步专门抓财经；某步老出错→换个更稳的做法。<strong>小步调、调完再观察</strong>（回收 W6 小步、系统化改进）。'},
      {try:{q:'发现简报「总结总是太长」，该咋办？',opts:[{t:'针对性调那一步（改指令让它精简），调完再观察',ok:true},{t:'整个工作流推倒重搭',ok:false},{t:'忍着不管',ok:false}],fb:'哪不好调哪——总结太长就调总结那步的指令。小步针对性改、改完再看效果。别动不动推倒重来，也别忍着不管。'}},
      {talk:'④ 改进是循环的（回收 W6 循环的味道）|<strong>盯→发现问题→调→再盯→再调……</strong>工作流是「养」出来的，不是一次搭到完美。这个「持续观察+改进」的循环，让它越用越顺手。（呼应 W6 的 Agent 循环：边跑边看边调）'},
      {try:{q:'「工作流越用越好」，靠的是？',opts:[{t:'盯→发现问题→调→再盯的持续改进循环',ok:true},{t:'一次搭到完美，再不用动',ok:false},{t:'换更贵的 AI',ok:false}],fb:'工作流是「养」出来的：盯→发现问题→调→再盯，循环改进（有点像 W6 Agent 的边跑边看）。持续打磨，它才越跑越顺、越贴合你的需求。'}},
      {talk:'⑤ 也要知道「何时该退休」|有的工作流，需求没了 / 被更好的方案替代了，就<strong>该停就停、该删就删</strong>，别让一堆没用的流程空跑浪费资源。<strong>会搭、会养、也会做减法。</strong>'},
      {try:{q:'一个工作流的需求消失了，该？',opts:[{t:'果断停掉 / 删掉，别让它空跑浪费',ok:true},{t:'永远留着，万一呢',ok:false},{t:'再搭一个更大的',ok:false}],fb:'需求没了就停 / 删，别让废流程空跑浪费资源（还回收 W1 删除的果断）。会搭、会养，也要会做减法——这是成熟操作员的分寸。'}},
      {talk:'⑥ 连回你|<strong>搭工作流是「造机器」，养工作流是「当机器的主人」</strong>。你会造、会养、会取舍，就真正掌握了自动化——这是你作为 AI 操作员最值钱的终极能力。'}
    ],
    aha:{goal:'你今天真正学会的',text:'工作流搭好只是开始，要「养」：<strong>盯输出→发现问题→针对性小步调→再盯</strong>（回收 W6 循环+盯 Agent），越养越顺；需求没了果断停删。会造、会养、会取舍，才是真掌握自动化。<br>下一关：终极 Boss——亲手跑通你自己的工作流，拿终极认证毕业！'}
  }},
  'w7_7':{world:'w7',n:7,a:'70',boss:true,type:'core',optional:false,title:'终极 Boss · 跑通你的工作流',goal:'设计一条完整的小工作流',xp:500,achievement:'w7_complete',completionGate:{requiredInteractionIds:['workflow_sequence','workflow_builder','scenario_normal','scenario_high_amount','scenario_tool_fail']},content:{
    flow:[
      {talk:'① 终极 Boss：你的毕业设计|走到这儿，你学的所有东西——命令、代码、环境、Agent——要拧成一股绳了。<strong>亲手设计一条真工作流</strong>，跑通它，你就从新手村毕业。'},
      {talk:'② 先看任务|「每天读取<strong>订单和库存</strong>，找出库存不足的商品，生成<strong>补货建议</strong>。预计补货金额<strong>超过 500 元要人工审批</strong>；工具调用失败最多<strong>重试两次</strong>，还失败就停下并记录原因。」<br>下面动手搭。'},
      {interactionId:'workflow_sequence',sequence:{ask:'第一步——把库存补货工作流的步骤排成有序一串（每步产出接下一步）：',items:[{id:'read',text:'读取订单和库存'},{id:'check',text:'检查数据完整性'},{id:'calc',text:'算出库存缺口'},{id:'advice',text:'生成补货建议'},{id:'judge',text:'算金额、判断是否超 500'},{id:'save',text:'审批(超500)/保存 + 记日志'}],answer:['read','check','calc','advice','judge','save'],card:'工作流步骤卡',fb:'先有数据、验数据、算缺口，才能出建议、算金额；金额算完才知道要不要审批。「还没读数据就生成建议」「还没算缺货就审批」都是把顺序搞反了。'}},
      {interactionId:'workflow_builder',builder:{mode:'agent-config',ask:'第二步——把其余关键项配全，提交生成你的完整工作流蓝图：',scenario:{title:'库存补货工作流：超 500 元人工审批，工具失败最多重试 2 次',description:'配完下方 aha 给出完整蓝图 + 三场景验证'},sections:[{id:'io',label:'① 输入 / 输出（多选）',inputType:'multi',options:[{id:'in_data',t:'输入：订单+库存+成本+缺货阈值'},{id:'out_advice',t:'输出：补货建议+数量+金额'},{id:'out_log',t:'输出：执行记录'},{id:'in_junk',t:'输入：随便给点数据'}]},{id:'exec',label:'② 执行者分配（多选）',inputType:'multi',options:[{id:'e_script',t:'算库存缺口 → 脚本'},{id:'e_ai',t:'写补货说明 → AI'},{id:'e_agent',t:'协调数据和工具 → Agent'},{id:'e_human',t:'超 500 元 → 人工审批'},{id:'e_allagent',t:'全交一个 Agent(含审批)'}]},{id:'fail',label:'③ 失败分支（多选）',inputType:'multi',options:[{id:'f_retry',t:'临时超时 → 重试最多 2 次'},{id:'f_stop',t:'数据字段缺失 → 停下要人补'},{id:'f_log',t:'连续失败 → 停下记录原因'},{id:'f_forever',t:'不管啥错都一直重试'}]},{id:'confirm',label:'④ 人工确认节点（多选）',inputType:'multi',options:[{id:'c_500',t:'补货金额超 500 元'},{id:'c_read',t:'读取数据(只读免确认)'}]},{id:'accept',label:'⑤ 验收标准（多选）',inputType:'multi',options:[{id:'a_evi',t:'每条建议有订单+库存依据'},{id:'a_check',t:'数量金额可复核'},{id:'a_noauto',t:'高金额没被自动执行'},{id:'a_log',t:'失败和重试都有记录'},{id:'a_self',t:'显示「已完成」就行'}]}],validation:{required:['io','exec','fail','confirm','accept'],forbidden:{io:['in_junk'],exec:['e_allagent'],fail:['f_forever'],confirm:['c_read'],accept:['a_self']}}}},
      {simulation:{mode:'workflow-run',configSource:'builder',scenarios:[{id:'normal',interactionId:'scenario_normal',title:'场景A：正常补货',desc:'数据完整→生成可复核的补货建议'},{id:'high-amount',interactionId:'scenario_high_amount',title:'场景B：金额超500',desc:'补货金额520元→停下等人工审批/不自动执行'},{id:'tool-fail',interactionId:'scenario_tool_fail',title:'场景C：工具失败',desc:'临时超时→重试最多2次/仍失败则停下记录'}]}},
      {talk:'⑧ 小黑的临别话|你从一个连黑窗口都怕的小白，走到能<strong>亲手设计一条带审批、带重试、带验收的工作流</strong>。你不是程序员，也不是 AI 科学家——你成了这个时代最稀缺的角色：<strong>会用 AI、懂原理、指挥得动 Agent 的「AI 操作员」</strong>。把学的这套，用到你自己真正的活儿里去吧。'}
    ],

/* ========= 关卡类型与解锁引擎（关卡类型改造批 新增） ========= */
function normalizeLevelMeta(level){return {type:level.type||'core',optional:(typeof level.optional==='boolean')?level.optional:(!!level.type&&level.type!=='core'),skills:level.skills||[],prerequisites:level.prerequisites||[],masteryRequired:level.masteryRequired||[],requiredSkills:level.requiredSkills||[],grants:level.grants||[]};}
function getLevelMeta(id){var lv=LevelData[id];if(!lv)return null;return normalizeLevelMeta(lv);}
function isLevelCompleted(id){return !!(State.levels[id]&&State.levels[id].completed);}
function getLevelStars(id){return (State.levels[id]&&State.levels[id].stars)||0;}
function hasSkill(skillId){for(var id in LevelData){if(isLevelCompleted(id)){var m=getLevelMeta(id);if(m&&m.grants.indexOf(skillId)>=0)return true;}}return false;}
function getWorldOrder(){return Object.keys(WORLDS);}
function getWorldCoreLevels(worldId){var w=WORLDS[worldId];if(!w)return [];return w.levels.filter(function(id){var m=getLevelMeta(id);return m&&m.type==='core';});}
function getWorldOptionalLevels(worldId){var arr=[];for(var id in LevelData){var lv=LevelData[id];if(lv&&lv.world===worldId){var m=getLevelMeta(id);if(m&&m.type!=='core')arr.push(id);}}return arr;}
function getGlobalCoreChain(){var chain=[];getWorldOrder().forEach(function(wk){getWorldCoreLevels(wk).forEach(function(id){chain.push(id);});});return chain;}
function getNextCoreLevel(id){var chain=getGlobalCoreChain();var i=chain.indexOf(id);if(i<0)return null;if(i<chain.length-1)return chain[i+1];return null;}
function isWorldComplete(worldId){var core=getWorldCoreLevels(worldId);if(!core.length)return false;return core.every(function(id){return isLevelCompleted(id);});}
function _prereqOk(m){for(var i=0;i<m.prerequisites.length;i++){if(!isLevelCompleted(m.prerequisites[i]))return false;}return true;}
function _masteryOk(m){for(var j=0;j<m.masteryRequired.length;j++){var mr=m.masteryRequired[j];if(getLevelStars(mr.levelId)<(mr.minStars||0))return false;}return true;}
function _skillsOk(m){for(var k=0;k<m.requiredSkills.length;k++){if(!hasSkill(m.requiredSkills[k]))return false;}return true;}
function _realUnlocked(id){var m=getLevelMeta(id);if(!m)return false;if(_trackTrialUnlockOk(id))return true;/* 阶段一恒为false的预留试炼通道，见函数注释 */if(!_prereqOk(m))return false;if(!_masteryOk(m))return false;if(!_skillsOk(m))return false;if(m.type==='core'){var chain=getGlobalCoreChain();var idx=chain.indexOf(id);if(idx<=0)return true;return isLevelCompleted(chain[idx-1]);}return true;}
function isLevelUnlocked(id){if(!LevelData[id])return false;if(typeof TEST_MODE!=='undefined'&&TEST_MODE)return true;return _realUnlocked(id);}
function _refreshUnlockedFlags(){for(var id in LevelData){if(State.levels[id])State.levels[id].unlocked=_realUnlocked(id);}}
function getLockedReason(id){var m=getLevelMeta(id);if(!m)return '';if(_realUnlocked(id))return '';var i,pid,pl;for(i=0;i<m.prerequisites.length;i++){if(!isLevelCompleted(m.prerequisites[i])){pid=m.prerequisites[i];pl=LevelData[pid];return '完成「'+(pl?pl.title:pid)+'」后解锁';}}for(i=0;i<m.masteryRequired.length;i++){var mr=m.masteryRequired[i];if(getLevelStars(mr.levelId)<(mr.minStars||0)){var ml=LevelData[mr.levelId];return '「'+(ml?ml.title:mr.levelId)+'」达到'+mr.minStars+'⭐后解锁';}}for(i=0;i<m.requiredSkills.length;i++){if(!hasSkill(m.requiredSkills[i])){var _sk=m.requiredSkills[i];var _gl=null;for(var _gid in LevelData){var _gm=getLevelMeta(_gid);if(_gm&&_gm.grants.indexOf(_sk)>=0){_gl=LevelData[_gid];break;}}return _gl?('完成「'+_gl.title+'」后解锁（需能力：'+_sk+'）'):('获得能力「'+_sk+'」后解锁');}}if(m.type==='core'){var chain=getGlobalCoreChain();var idx=chain.indexOf(id);if(idx>0&&!isLevelCompleted(chain[idx-1])){var pv=LevelData[chain[idx-1]];return '完成上一关「'+(pv?pv.title:chain[idx-1])+'」后解锁';}}return '完成前置关卡后解锁';}
function _validateCurrentLevel(){var chain=getGlobalCoreChain();var cur=State.currentLevel;var frontier=null;for(var j=0;j<chain.length;j++){if(!isLevelCompleted(chain[j])){frontier=chain[j];break;}}if(cur&&LevelData[cur]&&chain.indexOf(cur)>=0&&!isLevelCompleted(cur)&&_realUnlocked(cur))return;State.currentLevel=frontier||chain[chain.length-1]||'ai_camp_1';}
function migrateSaveData(d){if(!d||typeof d!=='object')return d;var v=d.schemaVersion||1;if(v<2){d.schemaVersion=2;}/* v3 阶段一·分层学习：补充/归一化 learnerProfile。幂等——同一存档迁移一次和多次结果一致；绝不触碰 levels/xp/totalStars/achievements/currentLevel 等既有进度字段，首次/最终通关时间所在的 W6/W7 草稿存档（独立 key）也完全不经过本函数。 */d.learnerProfile=normalizeLearnerProfile(d.learnerProfile);if((d.schemaVersion||1)<3){d.schemaVersion=3;}return d;}
function _levelSub(id){var lv=LevelData[id];if(!lv)return '';var m=getLevelMeta(id);var tm={practice:'🟢 练习关',challenge:'🟠 挑战关',side:'🔵 支线关'};if(m&&m.type!=='core'&&tm[m.type])return tm[m.type]+' · '+WORLDS[lv.world].name;return '第 '+lv.n+' 关 · '+WORLDS[lv.world].name+(lv.boss?' · 👑 BOSS':'');}
function renderExtraTraining(card,wk){if(!card)return;var opts=getWorldOptionalLevels(wk);if(!opts.length)return;var tm={practice:{cn:'练习',dot:'🟢'},challenge:{cn:'挑战',dot:'🟠'},side:{cn:'支线',dot:'🔵'}};var html='<div class="xtrain-title">➕ 额外训练（做不做都不挡主线）</div><div class="xtrain-row">';opts.forEach(function(id){var lv=LevelData[id],m=getLevelMeta(id),t=tm[m.type]||{cn:'训练',dot:'⚪'};var unl=isLevelUnlocked(id),done=isLevelCompleted(id);var cls='xtrain-node'+(unl?' clickable':' locked')+(done?' done':'');var oc=unl?("InfoCard.show('"+id+"')"):("InfoCard.showLockedFor('"+id+"')");var reason=unl?'':('<div class="xtrain-lock">🔒 '+getLockedReason(id)+'</div>');html+='<div class="'+cls+'" onclick="'+oc+'"><span class="xtrain-tag">'+t.cn+'</span><div class="xtrain-cap">'+t.dot+' '+lv.title+(done?' ✅':'')+'</div>'+reason+'</div>';});html+='</div>';var wrap=document.createElement('div');wrap.className='xtrain';wrap.innerHTML=html;card.appendChild(wrap);}
/* ========= 引擎结束 ========= */

// 初始化关卡状态（本批：初始只解锁 ai_camp_1，其余按 isLevelUnlocked 规则；TEST_MODE 全可点但不写脏真实 unlocked）
(function(){for(var id in LevelData){State.levels[id]={unlocked:false,completed:false,stars:0}}State.levels['ai_camp_1'].unlocked=true;if(typeof _refreshUnlockedFlags==='function')_refreshUnlockedFlags();})();

    var c=document.getElementById('worlds-container');c.innerHTML='';
    Object.entries(WORLDS).forEach(function(e){var wk=e[0],world=e[1];

      c.appendChild(card);

      world.levels.forEach(function(id){

        if(wk==='w2'&&id==='w2_1'){var egg=document.createElement('div');egg.className='peipei-egg';egg.innerHTML='🐾';egg.onclick=function(ev){ev.stopPropagation();Game.findPeipei()};node.appendChild(egg)}
        row.appendChild(node);
      });
    });
    Object.keys(WORLDS).forEach(function(wk){var _xc=document.getElementById('row-'+wk);if(_xc)renderExtraTraining(_xc.closest('.world-card'),wk);});
    
    c.querySelectorAll('.node-mini.clickable').forEach(function(n){n.addEventListener('click',function(ev){ev.stopPropagation();InfoCard.show(n.dataset.level)})});
    c.querySelectorAll('.node-mini.locked').forEach(function(n){n.addEventListener('click',function(ev){ev.stopPropagation();InfoCard.showLockedFor(n.dataset.level)})});
    document.getElementById('xp-text').textContent=State.xp;
  },

};

  show(id){
    var lvl=LevelData[id];var img=lvl.boss?slot(BOSS_ASSET[lvl.world],WORLDS[lvl.world].boss):slot(nodeAsset(lvl),'C'+lvl.a);

    card.innerHTML='<div class="info-head">'+img+'<div><h3>'+(lvl.boss?'👑 ':'')+lvl.title+'</h3><div class="info-desc">'+_levelSub(id)+'</div></div></div>'+
      '<div class="info-row"><div class="ico blue">📋</div><div><strong>这一关：</strong>'+lvl.goal+'</div></div>'+
      '<div class="info-row"><div class="ico gold">🎁</div><div><strong>奖励：</strong>+'+lvl.xp+' XP'+(lvl.achievement?' + 区域认证':'')+'</div></div>'+
      (ready?'':'<div class="info-row"><div class="ico">🚧</div><div style="color:var(--ink-soft)">这一关的小白内容还没写，先占位</div></div>')+
      '<div class="actions"><button class="btn '+(lvl.boss?'btn-boss':'btn-primary')+'" onclick="Game.startLevel(\''+id+'\')">'+(ready?'🚀 开始学':'进去看看（占位）')+'</button><button class="btn btn-secondary" onclick="InfoCard.hide()">返回地图</button></div>';

var Term={
  _resolve:function(path,cwd){
    if(!path||path==='.') return cwd;
    path=path.replace(/\\/g,'/');
    var ncwd=cwd.replace(/\\/g,'/');
    if(path==='..'){var parts=ncwd.split('/');parts.pop();return parts.join('/');}
    if(path.startsWith('./')){return ncwd+'/'+path.slice(2);}
    return path;
  },
  _toDisplay:function(p){return p.replace(/\//g,'\\');},
  _getNode:function(fs,path){
    if(!fs||!path) return null;
    path=path.replace(/\\/g,'/').replace(/\/+/g,'/').replace(/\/$/,'');
    var parts=path.split('/'),node=fs;
    for(var i=0;i<parts.length;i++){
      if(!node||typeof node!=='object') return null;
      node=node[parts[i]];
      if(node&&node._type==='file'&&i<parts.length-1) return null;
    }
    return node||null;
  },
  _getParent:function(fs,path){
    if(!fs||!path) return null;
    path=path.replace(/\\/g,'/').replace(/\/+/g,'/').replace(/\/$/,'');
    var parts=path.split('/'),key=parts.pop(),parent=fs;
    for(var i=0;i<parts.length;i++){
      if(!parent||typeof parent!=='object') return {parent:null,key:null};
      var n=parent[parts[i]];
      if(!n) return {parent:parent,key:parts[i],missing:true};
      if(n._type==='file') return {parent:null,key:null,isFile:true};
      parent=n;
    }
    return {parent:parent,key:key};
  },
  _isDir:function(node){return node&&typeof node==='object'&&node._type!=='file';},
  _listDir:function(fs,path){
    var node=this._getNode(fs,path);
    if(!node) return {error:true,msg:'找不到路径 "'+path+'"'};
    if(node._type==='file') return {error:true,msg:'"'+path+'" 是文件，不是目录'};
    var items=[],keys=Object.keys(node).sort();
    for(var i=0;i<keys.length;i++){
      var k=keys[i],v=node[k];
      if(k.startsWith('_')) continue;
      if(v&&typeof v==='object') items.push(k);
    }
    return {error:false,lines:items};
  },
  _listDirFull:function(fs,path){
    var node=this._getNode(fs,path);
    if(!node) return {error:true,msg:'找不到路径 "'+path+'"'};
    if(node._type==='file') return {error:true,msg:'"'+path+'" 是文件，不是目录'};
    var items=[],keys=Object.keys(node).sort();
    for(var i=0;i<keys.length;i++){
      var k=keys[i],v=node[k];
      if(k.startsWith('_')) continue;
      if(v&&typeof v==='object'){
        var prefix=v._type==='file'?'[文件]  ':'[文件夹]  ';
        items.push(prefix+k);
      }
    }
    return {error:false,lines:items};
  },
  _deepClone:function(o){
    return JSON.parse(JSON.stringify(o));
  },
  exec:function(cmdStr,state){
    cmdStr=cmdStr.trim();
    var parts=cmdStr.split(/\s+/);
    var command=parts[0],args=parts.slice(1);
    var cwd=state.cwd,fs=state.fs,self=this;
    var fullArgs=args.join(' ');
    function err(msg){return {error:true,msg:msg};}
    function ok(out,note){return {error:false,output:out,note:note||''};}
    switch(command){
      case 'Get-Location':
        return ok(cwd,'当前所在位置');
      case 'Get-ChildItem':
        var rest=fullArgs;
        // Handle pipe
        if(rest.indexOf('|')>=0){
          var pipeParts=rest.split('|');
          var pipeRest=pipeParts.slice(1).join('|').trim();
          if(pipeRest.indexOf('Select-String')===0){
            var ssArgs=pipeRest.replace('Select-String','').trim();
            var pattern=ssArgs.replace(/-Pattern\s+/,'').replace(/['"]/g,'');
            var dl=self._listDirFull(fs,cwd);
            if(dl.error) return dl;
            var matches=[];
            for(var i=0;i<dl.lines.length;i++){
              if(dl.lines[i].indexOf(pattern)>=0) matches.push(dl.lines[i]);
            }
            return ok(matches.length?matches.join('\n'):'(没有匹配项)','管道过滤');
          }
        }
        // Support optional path
        var listPath=args.length?self._resolve(fullArgs.trim(),cwd):cwd;
        var r=self._listDir(fs,listPath);
        if(r.error) return r;
        return ok(r.lines.length?r.lines.join('\n'):'(空)','当前目录内容');
      case 'Set-Location':
        if(!args.length) return err('缺少目标路径。电脑知道你要改变位置，但不知道要去哪里。');
        var target=self._resolve(fullArgs,cwd);
        var node=self._getNode(fs,target);
        if(!node) return err('找不到路径 "'+target+'"。当前命令类型正确，但目标目录写错——先用 Get-ChildItem 确认名字。');
        if(node._type==='file') return err('"'+target+'" 是一个文件，不能进入。Set-Location 只能进入文件夹。');
        state.cwd=target;
        return ok('已进入: '+target,'位置已改变');
      case 'Get-Content':
        if(!args.length) return err('缺少文件名。电脑知道你想读文件，但不知道要读哪个。');
        var filePath=self._resolve(fullArgs,cwd);
        var fn=self._getNode(fs,filePath);
        if(!fn) return err('找不到文件 "'+filePath+'"。先确认当前目录（Get-Location），再确认文件名。');
        if(typeof fn!=='object'||fn._type!=='file') return err('"'+filePath+'" 不是一个文件。');
        return ok(fn._content||'(文件为空)','文件内容');
      case 'New-Item':
        // Parse: New-Item ./name -ItemType File/Directory
        var itemType='File';
        var name='';
        for(var i=0;i<args.length;i++){
          if(args[i]==='-ItemType'){
            if(i+1<args.length) itemType=args[i+1];
            i++;
          }else if(!args[i].startsWith('-')){
            name=args[i];
          }
        }
        if(!name) return err('缺少名称。电脑知道你要新建东西，但不知道叫什么名字。');
        var newPath=self._resolve(name,cwd);
        var pInfo=self._getParent(fs,newPath);
        if(!pInfo||!pInfo.parent) return err('找不到父目录。');
        if(pInfo.missing) return err('父目录不存在：'+newPath);
        if(pInfo.isFile) return err('父级 "'+pInfo.key+'" 是一个文件，不能在文件里创建东西。');
        if(pInfo.parent[pInfo.key]) return err('"'+pInfo.key+'" 已经存在。');
        if(itemType==='Directory'){
          pInfo.parent[pInfo.key]={};
        }else{
          pInfo.parent[pInfo.key]={_type:'file',_content:''};
        }
        var typeLabel=itemType==='Directory'?'文件夹':'文件';
        return ok('已创建'+typeLabel+': '+pInfo.key,'新建成功');
      case 'Copy-Item':
        // Parse: Copy-Item src dest
        if(args.length<2) return err('缺少源或目标。Copy-Item 需要两个路径：源文件 和 目标路径。');
        var src=args[0],dest=args[1];
        var srcPath=self._resolve(src,cwd);
        var destPath=self._resolve(dest,cwd);
        var sNode=self._getNode(fs,srcPath);
        if(!sNode) return err('找不到源文件 "'+srcPath+'"。');
        if(sNode._type!=='file') return err('"'+srcPath+'" 不是文件，不能复制。');
        var dParent=self._getParent(fs,destPath);
        if(!dParent||!dParent.parent) return err('目标目录不存在。先创建目录（New-Item -ItemType Directory），再复制。');
        if(dParent.isFile) return err('目标路径的父级是文件，不能复制进来。');
        if(dParent.parent[dParent.key]&&dParent.parent[dParent.key]._type!=='file'){
          return err('"'+dParent.key+'" 已存在且不是文件。');
        }
        dParent.parent[dParent.key]=self._deepClone(sNode);
        return ok('已复制: '+srcPath+' → '+destPath,'复制成功');
      case 'Remove-Item':
        var rmArgs=fullArgs;
        var hasWhatIf=rmArgs.indexOf('-WhatIf')>=0;
        var rmPath=self._resolve(rmArgs.replace(/-WhatIf/,'').trim(),cwd);
        var rmNode=self._getNode(fs,rmPath);
        if(!rmNode) return err('找不到 "'+rmPath+'"。');
        if(hasWhatIf){
          state.flags=state.flags||{};
          state.flags.whatIf=state.flags.whatIf||{};
          state.flags.whatIf[rmPath]=true;
          var whatIfOut='【-WhatIf 预演】\n将会删除: '+rmPath;
          whatIfOut+='\n类型: '+(rmNode._type==='file'?'文件':'文件夹（含所有内容）');
          whatIfOut+='\n\n⚠️ 这只是预演，没有真正删除。';
          return ok(whatIfOut,'-WhatIf 安全预演已完成');
        }
        // Check WhatIf was done
        state.flags=state.flags||{};
        state.flags.whatIf=state.flags.whatIf||{};
        if(!state.flags.whatIf[rmPath]){
          return err('请先使用 -WhatIf 预演并确认删除目标。安全第一！');
        }
        var rmParent=self._getParent(fs,rmPath);
        if(rmParent&&rmParent.parent){
          delete rmParent.parent[rmParent.key];
          delete state.flags.whatIf[rmPath];
          return ok('已删除: '+rmPath,'删除完成');
        }
        return err('删除失败：无法定位父目录。');
      case 'Select-String':
        var selPath=null,selPattern=null;
        for(var i=0;i<args.length;i++){
          if(args[i]==='-Path'&&i+1<args.length){selPath=self._resolve(args[i+1],cwd);i++;}
          else if(args[i]==='-Pattern'&&i+1<args.length){
            selPattern=args[i+1].replace(/['"]/g,'');
            i++;
          }
        }
        if(!selPath&&args.length>0&&!args[0].startsWith('-')){
          selPath=self._resolve(args[0],cwd);
        }
        if(!selPattern&&args.length>1&&!args[1].startsWith('-')){
          selPattern=args[1].replace(/['"]/g,'');
        }
        if(!selPattern) return err('缺少搜索关键词。用 -Pattern 指定要搜什么。');
        if(selPath){
          var fNode=self._getNode(fs,selPath);
          if(!fNode) return err('找不到文件: '+selPath);
          if(fNode._type!=='file') return err('"'+selPath+'" 不是文件');
          if(!fNode._content) return ok('(文件为空)','搜索完成');
          var slines=fNode._content.split('\n');
          var smatches=[];
          var fname=selPath.split('/').pop();
          for(var i=0;i<slines.length;i++){
            if(slines[i].indexOf(selPattern)>=0) smatches.push(fname+': '+slines[i]);
          }
          return ok(smatches.length?smatches.join('\n'):'(没有找到含 "'+selPattern+'" 的行)','搜索完成');
        }
        // Fallback: search all files in cwd
        var dl2=self._listDirFull(fs,cwd);
        if(dl2.error) return dl2;
        var matches2=[],files2=dl2.lines;
        for(var i=0;i<files2.length;i++){
          if(files2[i].indexOf('[文件]')===0){
            var fn2=files2[i].replace('[文件]  ','').trim();
            var fp2=self._resolve(fn2,cwd);
            var fn2n=self._getNode(fs,fp2);
            if(fn2n&&fn2n._type==='file'&&fn2n._content){
              var fl=fn2n._content.split('\n');
              for(var j=0;j<fl.length;j++){
                if(fl[j].indexOf(selPattern)>=0) matches2.push(fn2+': '+fl[j]);
              }
            }
          }
        }
        return ok(matches2.length?matches2.join('\n'):'(没有找到含 "'+selPattern+'" 的行)','搜索完成');
      default:
        return err('不认识的命令：'+command);
    }
  }
};

  _termBuildCmd:function(si){

  _termPick:function(si,slot,el,value){

    else if(slot==='arg2'){p.arg2=value;}
    else if(slot==='option'){
      var idx=p.options.indexOf(value);

  _termRun:function(si){

      }

    }

  _termValidate:function(si,result,expect,draftState){
    var p=this.termPicked[si];
    if(!p) return false;
    // 1. Check command
    if(expect.command&&p.command!==expect.command) return false;
    // 2. Check commandLine (exact full command)
    if(expect.commandLine){
      var built=this._termBuildCmd(si);
      if(built!==expect.commandLine) return false;
    }
    // 3. Check error status
    if(expect.error===true&&!result.error) return false;
    if(expect.error===false&&result.error) return false;
    // 4. Check errorContains
    if(expect.errorContains){
      if(!result.error) return false;
      if((result.msg||'').indexOf(expect.errorContains)<0) return false;
    }
    // 5. Check CWD
    if(expect.cwd){
      var expCwd=expect.cwd.replace(/\\/g,'/');
      if(draftState.cwd!==expCwd) return false;
    }
    // 6. Check outputContains
    if(expect.outputContains){
      if(result.error) return false;
      for(var i=0;i<expect.outputContains.length;i++){
        if((result.output||'').indexOf(expect.outputContains[i])<0) return false;
      }
    }
    // 7. Check exists/notExists
    if(expect.exists){
      for(var i=0;i<expect.exists.length;i++){
        var p2=Term._resolve(expect.exists[i],draftState.cwd);
        if(!Term._getNode(draftState.fs,p2)) return false;
      }
    }
    if(expect.notExists){
      for(var i=0;i<expect.notExists.length;i++){
        var p2=Term._resolve(expect.notExists[i],draftState.cwd);
        if(Term._getNode(draftState.fs,p2)) return false;
      }
    }
    // 8. All checks passed
    // Check types (file vs directory)
    if(expect.types){
      for(var k in expect.types){
        var p3=Term._resolve(k,draftState.cwd);
        var n3=Term._getNode(draftState.fs,p3);
        if(!n3) return false;
        var expType=expect.types[k];
        if(expType==='directory'&&n3._type==='file') return false;
        if(expType==='file'&&(!n3._type||n3._type!=='file')) return false;
      }
    }
    // Check contentContains (file content assertions)
    if(expect.contentContains){
      for(var k in expect.contentContains){
        var p4=Term._resolve(k,draftState.cwd);
        var n4=Term._getNode(draftState.fs,p4);
        if(!n4||n4._type!=='file') return false;
        var expStrs=expect.contentContains[k];
        for(var ci=0;ci<expStrs.length;ci++){
          if((n4._content||'').indexOf(expStrs[ci])<0) return false;
        }
      }
    }
    return !result.error || expect.error===true || expect.errorContains;
  },

var LevelValidator={
  /* 静态校验 LevelData 和 WORLDS */
  validate(){
    var errors = [];
    var warnings = [];
    
    // 1. 世界数量
    var worldKeys = Object.keys(WORLDS);
    if(worldKeys.length !== 8) errors.push('世界数量应为8，实际: '+worldKeys.length);
    
    // 2. 关卡统计
    var allLevelIds = Object.keys(LevelData);
    var coreCount = 0, optCount = 0, bossCount = 0;
    allLevelIds.forEach(function(id){
      var lv = LevelData[id];
      if(!lv.optional || lv.type==='core') coreCount++;
      if(lv.optional) optCount++;
      if(lv.boss) bossCount++;
    });
    if(coreCount !== 70) errors.push('主线关应为70，实际: '+coreCount);
    if(optCount !== 4) errors.push('额外训练应为4，实际: '+optCount);
    if(allLevelIds.length !== 74) errors.push('总关卡应为74，实际: '+allLevelIds.length);
    if(bossCount !== 8) errors.push('Boss关应为8，实际: '+bossCount);
    
    // 3. 关卡 ID 唯一性
    var seen = {};
    allLevelIds.forEach(function(id){
      if(seen[id]) errors.push('重复关卡ID: '+id);
      seen[id] = true;
    });
    
    // 4. 世界引用完整性
    var worldLevelRefs = {};
    worldKeys.forEach(function(wk){
      var w = WORLDS[wk];
      if(!w.levels || !Array.isArray(w.levels)){
        errors.push('世界 '+wk+' 缺少 levels 数组');
        return;
      }
      w.levels.forEach(function(lid){
        if(!LevelData[lid]) errors.push('世界 '+wk+' 引用了不存在的关卡: '+lid);
        if(!worldLevelRefs[lid]) worldLevelRefs[lid] = [];
        worldLevelRefs[lid].push(wk);
      });
    });
    
    // 5. 检查跨世界重复引用
    Object.keys(worldLevelRefs).forEach(function(lid){
      if(worldLevelRefs[lid].length > 1){
        errors.push('关卡 '+lid+' 被多个世界引用: '+worldLevelRefs[lid].join(','));
      }
    });
    
    // 6. 检查每个世界有且仅有一个Boss
    worldKeys.forEach(function(wk){
      var w = WORLDS[wk];
      var bosses = w.levels.filter(function(lid){
        return LevelData[lid] && LevelData[lid].boss;
      });
      if(bosses.length === 0) errors.push('世界 '+wk+' 缺少Boss关');
      if(bosses.length > 1) errors.push('世界 '+wk+' 有多个Boss关: '+bosses.join(','));
    });
    
    // 7. Boss 必须有 achievement
    allLevelIds.forEach(function(id){
      var lv = LevelData[id];
      if(lv.boss && !lv.achievement){
        errors.push('Boss关 '+id+' 缺少 achievement 字段');
      }
    });
    
    // 8. masteryRequired 格式检查
    allLevelIds.forEach(function(id){
      var lv = LevelData[id];
      var mr = lv.masteryRequired;
      if(mr !== undefined && mr !== null){
        if(typeof mr === 'boolean'){
          errors.push('关卡 '+id+' masteryRequired 是布尔值，应为数组');
        } else if(Array.isArray(mr)){
          mr.forEach(function(item, i){
            if(!item.levelId) errors.push('关卡 '+id+' masteryRequired['+i+'] 缺少 levelId');
            if(typeof item.minStars !== 'number' || item.minStars < 0 || item.minStars > 3){
              errors.push('关卡 '+id+' masteryRequired['+i+'] minStars 非法');
            }
            if(item.levelId === id) errors.push('关卡 '+id+' masteryRequired 引用了自身');
          });
        } else {
          errors.push('关卡 '+id+' masteryRequired 非法类型: '+typeof mr);
        }
      }
    });
    
    // 9. prerequisites 检查
    allLevelIds.forEach(function(id){
      var lv = LevelData[id];
      var pre = lv.prerequisites;
      if(pre && Array.isArray(pre)){
        pre.forEach(function(pid){
          if(!LevelData[pid]) errors.push('关卡 '+id+' prerequisites 引用不存在的关卡: '+pid);
        });
      }
    });
    
    // 10. requiredSkills 检查
    allLevelIds.forEach(function(id){
      var lv = LevelData[id];
      var skills = lv.skills || lv.requiredSkills;
      if(skills && Array.isArray(skills)){
        skills.forEach(function(sk){
          if(typeof sk !== 'string') errors.push('关卡 '+id+' requiredSkill 不是字符串');
        });
      }
    });
    
    // 11. 空关卡检查
    allLevelIds.forEach(function(id){
      var lv = LevelData[id];
      if(!lv.content || !lv.content.flow || lv.content.flow.length === 0){
        if(!lv.optional) errors.push('核心关卡 '+id+' 没有有效内容');
        else warnings.push('可选关卡 '+id+' 没有有效内容');
      }
    });
    
    // 12. 素材编号格式
    allLevelIds.forEach(function(id){
      var lv = LevelData[id];
      if(lv.a && !/^\d{2}$/.test(lv.a)){
        errors.push('关卡 '+id+' 素材编号a格式非法: '+lv.a);
      }
    });
    
    // 13. interactionId 校验（关卡内唯一 + simulation scenario 登记 + completionGate 引用检查）
    allLevelIds.forEach(function(id){
      var lv=LevelData[id];
      if(!lv.content||!lv.content.flow)return;
      var levelIds={};
      lv.content.flow.forEach(function(step){
        if(step.interactionId){
          if(levelIds[step.interactionId])errors.push('关卡 '+id+' 中 interactionId \''+step.interactionId+'\' 在关卡内重复');
          levelIds[step.interactionId]=true;
        }
        if(step.simulation&&step.simulation.scenarios){
          step.simulation.scenarios.forEach(function(sc){
            if(!sc.interactionId){
              errors.push('关卡 '+id+' simulation scenario 缺少 interactionId');
              return;
            }
            if(levelIds[sc.interactionId]){
              errors.push('关卡 '+id+' simulation scenario interactionId \''+sc.interactionId+'\' 重复');
            }
            levelIds[sc.interactionId]=true;
          });
        }
      });
      // 14. completionGate 引用检查（关卡内）
      if(lv.completionGate&&lv.completionGate.requiredInteractionIds){
        lv.completionGate.requiredInteractionIds.forEach(function(riid){
          if(!levelIds[riid]){
            errors.push('关卡 '+id+' completionGate 引用了不存在的 interactionId: '+riid);
          }
        });
      }
    });
    return {errors: errors, warnings: warnings, 
            summary: '关卡:'+allLevelIds.length+' 世界:'+worldKeys.length+' 主线:'+coreCount+' 可选:'+optCount+' Boss:'+bossCount};
  },
  runAndReport(){
    var r = this.validate();
    var h = '<div style="padding:16px"><h3>🔍 LevelData 校验报告</h3>';
    h += '<p>'+r.summary+'</p>';
    if(r.errors.length === 0 && r.warnings.length === 0){
      h += '<p style="color:#2e7d32;font-weight:700">✅ 全部通过！</p>';
    } else {
      h += '<p style="color:#c0392b;font-weight:700">❌ 错误: '+r.errors.length+' | ⚠ 警告: '+r.warnings.length+'</p>';
      r.errors.forEach(function(e){h += '<div style="color:#c0392b;font-size:12px">❌ '+e+'</div>'}); 
      r.warnings.forEach(function(w){h += '<div style="color:#c9a227;font-size:12px">⚠ '+w+'</div>'}); 
    }
    h += '</div>';
    return h;
  }
};
var Artifact={
  migrateArtifactStore(data){
    if(data.schemaVersion===2&&data.artifacts)return data;
    var v2={schemaVersion:2,artifacts:{}};
    if(Array.isArray(data)){
      data.forEach(function(arr){if(Array.isArray(arr))arr.forEach(function(a){if(a&&a.levelId)v2.artifacts[a.levelId]=a;});});
    }else if(typeof data==='object'){
      Object.keys(data).forEach(function(k){
        var v=data[k];
        if(Array.isArray(v)){
          v.forEach(function(a){if(a&&a.levelId)v2.artifacts[a.levelId]=a;});
        }else if(v&&v.levelId){
          v2.artifacts[v.levelId]=v;
        }else if(v&&v.artifactType){
          v2.artifacts[k]=v;
        }
      });
    }
    return v2;
  },
  loadStore(){
    var raw;try{raw=localStorage.getItem('agent_village_artifacts');}catch(e){raw=null;}
    if(!raw)return {schemaVersion:2,artifacts:{}};
    var data;try{data=JSON.parse(raw);}catch(e){return {schemaVersion:2,artifacts:{}};}
    return this.migrateArtifactStore(data);
  },
  saveStore(store){try{localStorage.setItem('agent_village_artifacts',JSON.stringify(store));}catch(e){}},
  saveLevel(levelId,payload){
    if(!levelId)return;
    var lv=LevelData[levelId];if(!lv)return;
    var st=State.levels[levelId]||{};
    var store=this.loadStore();
    var prev=store.artifacts[levelId];
    var now=new Date().toISOString();
    var a={
      schemaVersion:2,levelId:levelId,
      worldId:lv.world||'',artifactType:lv.outputType||'checklist',
      title:lv.title||'',
      createdAt:prev&&prev.createdAt?prev.createdAt:now,
      updatedAt:now,
      firstPassedAt:prev&&prev.firstPassedAt?prev.firstPassedAt:(st.completed?now:null),
      finalPassedAt:prev&&prev.finalPassedAt?prev.finalPassedAt:(st.completed?now:null),
      decisions:payload&&payload.decisions?JSON.parse(JSON.stringify(payload.decisions)):{},
      testResults:payload&&payload.testResults?JSON.parse(JSON.stringify(payload.testResults)):{},
      revisionCount:prev?(prev.revisionCount||0)+1:0,
      passed:!!st.completed
    };
    store.artifacts[levelId]=a;
    this.saveStore(store);
    return a;
  },
  getWorldArtifacts(worldId){
    var store=this.loadStore();
    var result=[];
    Object.keys(store.artifacts).forEach(function(id){
      if(store.artifacts[id].worldId===worldId)result.push(store.artifacts[id]);
    });
    return result;
  },
  renderArtifactLink(worldId,worldName){
    var arts=this.getWorldArtifacts(worldId);
    if(arts.length===0)return'';
    var bossArt=null;
    for(var i=arts.length-1;i>=0;i--){if(arts[i].passed){bossArt=arts[i];break;}}
    if(!bossArt)return'';
    return'<div style="margin-top:8px"><button class="btn btn-secondary" onclick="Artifact.viewArtifact(\''+worldId+'\')" style="font-size:12px;padding:4px 12px">📋 查看成果</button></div>';
  },
  viewArtifact(worldId){
    var arts=this.getWorldArtifacts(worldId);
    if(arts.length===0){Game.toast('该世界暂无成果');return;}
    var bossArt=null;
    for(var i=arts.length-1;i>=0;i--){if(arts[i].passed){bossArt=arts[i];break;}}
    if(!bossArt){Game.toast('该世界Boss尚未通过');return;}
    var h='<div style="padding:16px"><h3>📋 '+bossArt.title+'</h3>';
    h+='<p style="font-size:12px;color:#8a7d63">完成时间: '+(bossArt.createdAt||'').substring(0,10)+' | 修改次数: '+bossArt.revisionCount+'</p>';
    h+='<div style="background:#f7f2e0;border-radius:8px;padding:10px;margin:8px 0;font-size:13px">';
    if(bossArt.decisions&&Object.keys(bossArt.decisions).length>0){
      h+='<strong>你的决策:</strong><br>';
      h+='<pre style="white-space:pre-wrap;font-size:12px">'+JSON.stringify(bossArt.decisions,null,2)+'</pre>';
    }
    if(bossArt.testResults&&Object.keys(bossArt.testResults).length>0){
      h+='<strong>测试结果:</strong><br>';
      h+='<pre style="white-space:pre-wrap;font-size:12px">'+JSON.stringify(bossArt.testResults,null,2)+'</pre>';
    }
    h+='</div>';
    h+='<div style="display:flex;gap:8px;margin-top:8px">';
    h+='<button class="btn btn-secondary" onclick="Export.exportJSON(\''+worldId+'\')" style="font-size:12px">💾 导出 JSON</button>';
    h+='<button class="btn btn-secondary" onclick="Export.exportHTML(\''+worldId+'\')" style="font-size:12px">🖨 可打印版</button>';
    h+='<button class="btn btn-secondary" onclick="Export.exportMarkdown(\''+worldId+'\')" style="font-size:12px">📝 Markdown</button>';
    h+='</div></div>';
    document.getElementById('info-card').innerHTML=h;
    document.getElementById('info-modal').style.display='flex';
  }
};
var Export={
  /* 生成毕业成果预览 */
  gradPreview(){
    var p = State.learnerProfile || {};

    h += '<hr style="border-color:rgba(0,0,0,.1)">';
