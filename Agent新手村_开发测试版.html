    h += '</div>';
    return h;
  },
  _esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');},
  
  /* 导出 JSON */
  exportJSON(worldId){
    var arts = Artifact.getWorldArtifacts(worldId);
    var json = JSON.stringify(arts, null, 2);
    this._download('agent_village_'+worldId+'_artifacts.json', 'application/json', json);
  },
  /* 导出可打印 HTML */
  exportHTML(worldId){
    var arts = Artifact.getWorldArtifacts(worldId);
    var h = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Agent新手村 · '+worldId+' 成果</title>';
    h += '<style>body{font-family:sans-serif;max-width:800px;margin:40px auto;padding:20px;background:#f5f1e8}';
    h += 'h1{font-size:24px}.card{background:#fff;border:2px solid #333;border-radius:12px;padding:16px;margin:12px 0}';
    h += '.tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;background:#eee;margin:4px}';
    h += 'pre{background:#f7f2e0;padding:10px;border-radius:6px;font-size:12px;white-space:pre-wrap}</style></head><body>';
    h += '<h1>📋 Agent新手村 · '+worldId+' 学习成果</h1>';
    h += '<p>导出时间: '+new Date().toISOString().substring(0,19)+'</p>';
    arts.forEach(function(a){
      h += '<div class="card"><h3>'+a.title+'</h3>';
      h += '<span class="tag">'+a.artifactType+'</span>';
      h += '<span class="tag">'+a.worldId+'</span>';
      h += '<span class="tag">'+(a.passed?'✅通过':'⏳未通过')+'</span>';
      h += '<p>修改次数: '+a.revisionCount+' | '+a.createdAt.substring(0,10)+'</p>';
      h += '<pre>'+JSON.stringify({decisions:a.decisions,testResults:a.testResults},null,2)+'</pre>';
      h += '</div>';
    });
    h += '<p style="color:#b8863a;font-size:12px">⚠ 此为模拟训练成果，非正式资格认证。</p></body></html>';
    this._download('agent_village_'+worldId+'_print.html', 'text/html', h);
  },
  /* 导出 Markdown */
  exportMarkdown(worldId){
    var arts = Artifact.getWorldArtifacts(worldId);
    var md = '# Agent新手村 · '+worldId+' 学习成果\n\n';
    md += '导出时间: '+new Date().toISOString().substring(0,19)+'\n\n';
    md += '> ⚠ 此为模拟训练成果，非正式资格认证。\n\n';
    arts.forEach(function(a){
      md += '## '+a.title+'\n\n';
      md += '- 类型: '+a.artifactType+'\n';
      md += '- 状态: '+(a.passed?'✅ 通过':'⏳ 未通过')+'\n';
      md += '- 修改次数: '+a.revisionCount+'\n';
      md += '- 完成时间: '+a.createdAt.substring(0,10)+'\n\n';
      md += '### 决策记录\n\n```json\n'+JSON.stringify(a.decisions,null,2)+'\n```\n\n';
      md += '### 测试结果\n\n```json\n'+JSON.stringify(a.testResults,null,2)+'\n```\n\n';
    });
    this._download('agent_village_'+worldId+'_export.md', 'text/markdown', md);
  },
  /* 下载辅助 */
  _download(filename, mime, content){
    var blob = new Blob([content], {type: mime+';charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    Game.toast('📥 '+filename+' 已下载');
  }
};
var LearningLog={
  /* 记录学习事件 */
  log(eventName, levelId, interactionId, attempt, usedHint, passed){
    var entry = {
      eventName: eventName,
      levelId: levelId||'',
      interactionId: interactionId||'',
      timestamp: new Date().toISOString(),
      attempt: attempt||1,
      usedHint: !!usedHint,
      passed: !!passed
    };
    // 不记录敏感信息
    var logs = this.load();
    logs.push(entry);
    // 最多保留1000条
    if(logs.length > 1000) logs = logs.slice(-1000);
    try{localStorage.setItem('agent_village_learning_log', JSON.stringify(logs));}catch(e){}
  },
  load(){
    try{
      var r = localStorage.getItem('agent_village_learning_log');
      return r ? JSON.parse(r) : [];
    }catch(e){return [];}
  },
  clear(){
    localStorage.removeItem('agent_village_learning_log');
  },
  /* 生成学习报告 */
  report(){
    var logs = this.load();
    var h = '<div style="padding:16px"><h3>📊 学习记录报告</h3>';
    h += '<p>总事件: '+logs.length+' | 时间范围: ';
    if(logs.length > 0){
      h += logs[0].timestamp.substring(0,10)+' ~ '+logs[logs.length-1].timestamp.substring(0,10);
    }else{
      h += '无记录';
    }
    h += '</p>';
    
    // 按关卡统计
    var byLevel = {};
    logs.forEach(function(l){
      if(!byLevel[l.levelId]) byLevel[l.levelId] = {total:0, passed:0, hints:0};
      byLevel[l.levelId].total++;
      if(l.passed) byLevel[l.levelId].passed++;
      if(l.usedHint) byLevel[l.levelId].hints++;
    });
    
    h += '<table style="width:100%;font-size:12px;border-collapse:collapse">';
    h += '<tr><th style="text-align:left;padding:4px">关卡</th><th>尝试</th><th>通过</th><th>提示</th></tr>';
    Object.keys(byLevel).sort().forEach(function(lid){
      var s = byLevel[lid];
      h += '<tr><td style="padding:4px">'+lid+'</td><td style="text-align:center">'+s.total+'</td><td style="text-align:center">'+s.passed+'</td><td style="text-align:center">'+s.hints+'</td></tr>';
    });
    h += '</table>';
    
    // 最近10条
    h += '<p style="margin-top:12px"><strong>最近10条事件:</strong></p>';
    var recent = logs.slice(-10).reverse();
    recent.forEach(function(l){
      var icon = l.passed ? '✅' : (l.eventName==='hint'?'💡':'📝');
      h += '<div style="font-size:11px;padding:2px 0">'+icon+' '+l.timestamp.substring(11,19)+' '+l.eventName+' @'+l.levelId+' (尝试#'+l.attempt+(l.usedHint?',用了提示':'')+')</div>';
    });
    
    h += '<button class="btn btn-secondary" onclick="LearningLog.clear();document.getElementById(\'info-card\').innerHTML=\'<p>已清除</p>\'" style="margin-top:8px;font-size:12px">🗑 清除学习记录</button>';
    h += '</div>';
    return h;
  },
  showReport(){
    var card=document.getElementById('info-card');
    var modal=document.getElementById('info-modal');
    if(!card||!modal){
      console.error('LearningLog report modal missing');
      return;
    }
    card.innerHTML=
      this.report()+
      '<div class="actions">'+
      '<button class="btn btn-secondary" onclick="InfoCard.hide()">关闭</button>'+
      '</div>';
    modal.classList.add('active');
    modal.style.display='flex';
  }
};
var Game={

  starBurst(){var b=document.createElement('div');b.className='star-burst';for(var i=0;i<18;i++){var s=document.createElement('div');s.className='star';s.textContent='⭐';s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*0.4+'s';b.appendChild(s)}document.body.appendChild(b);setTimeout(function(){b.remove()},1400)},
  toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2000)},
  reset(){if(!confirm('确定清空所有进度吗？'))return;try{localStorage.removeItem('agent_village_d');}catch(e){}try{localStorage.removeItem('agent_village_w6_sim_draft');}catch(e){}try{localStorage.removeItem('agent_village_w7_wf_draft');}catch(e){}try{localStorage.removeItem('agent_village_artifacts');}catch(e){}try{localStorage.removeItem('agent_village_learning_log');}catch(e){}location.reload()}
};
