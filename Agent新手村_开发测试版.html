    aha:{goal:'你今天真正学会的',text:'<strong>函数 = 把一串步骤打包成一个「工具」，喊名就用。</strong><br>你还发现——黑窗口村的命令就是函数，而 <strong>Agent 的工具底层也是函数</strong>。<strong>命令、函数、工具，同一个东西的三个名字。</strong>三个世界在这儿接上了。<br>下一关：程序怎么「听你说话、给你回话」——输入输出。'}
  }},
  'w2_5':{world:'w2',n:5,a:'18',boss:false,type:'core',optional:false,title:'输入输出',goal:'接收任务和给出结果',xp:150,content:{
    flow:[
      {talk:'① 接上一关：会存、拐弯、重复、打包了——但程序还得跟人打交道|程序里做了一堆事，结果得让人看见吧？人说的话，程序也得能收吧？<strong>这一听一说——就是「输入」和「输出」。</strong>'},
      {talk:'② 一进一出，两扇门|去餐厅点菜：你跟服务员说「来碗面」——这是<strong>输入</strong>（你说话，他收下）。厨房做好端给你——这是<strong>输出</strong>（他把结果给你看）。<br><strong>输入 = 程序的耳朵（收你的话）。输出 = 程序的嘴（给你结果）。</strong>缺哪扇门，沟通都断。'},
      {try:{q:'在 ATM 机上输密码——对机器来说，这是输入还是输出？',opts:[{t:'输入——你在把信息「给」机器',ok:true},{t:'输出——机器在「告诉」你',ok:false}],fb:'你输密码，是你在「说给它听」——它收下来——这是输入。等它吐出钱来，那是它的输出。先有你的输入，它才会有输出。'}},
      {talk:'③ 写成代码长啥样（顺便回收变量）|<code style="background:#eee;padding:2px 8px;border-radius:4px">名字 = 输入("你叫啥？")</code>——程序问你、等你打字，把你的话存进变量「名字」。<br><code style="background:#eee;padding:2px 8px;border-radius:4px">输出("你好，" + 名字)</code>——程序把拼好的问候显示给你。<br><strong>输入给的东西，得存进变量，后面才用得上——零件是串着用的。</strong>'},
      {sequence:{ask:'把一个「问名字、打招呼」小程序的数据流，拖成正确顺序——看输入怎么一路变成输出：',items:[{id:'in',text:'问用户：你叫啥？（输入）'},{id:'save',text:'把用户的回答存进变量「名字」'},{id:'check',text:'如果名字是空的，就用「朋友」顶上（条件）'},{id:'out',text:'输出：你好，＜名字＞！'}],answer:['in','save','check','out'],card:'数据流卡',fb:'数据流是「进来 → 存住 → 处理 → 出去」：先接输入，存进变量，再条件处理，最后输出。前几关的零件全串起来了，少一环就断。'}},
      {talk:'④ 你天天在「输入输出」|黑窗口村你敲 <strong>Get-Content</strong> 让电脑读文件——那是给文件内容做了一次「输入」；终端把内容<strong>显示给你</strong>——那是「输出」。<br>你给 AI 发一条消息（输入），它回你一段回答（输出）。你跟 AI 每一次对话，都是一进一出。'},
      {try:{q:'你给 AI 发「帮我写首诗」，它回了一首诗——对 AI 来说？',opts:[{t:'你的消息是输入，它写的诗是输出',ok:true},{t:'你的消息是输出，它写的诗是输入',ok:false},{t:'都算输入',ok:false}],fb:'你「给」它的 = 输入。它「回」你的 = 输出。每次对话都是一进一出——耳朵收、嘴巴说。'}},
      {talk:'⑤ 不止对话——Agent 的输入输出更多|Agent 读文件内容（输入文件）、查数据库（输入查询）、调 API（输入请求）、把结果写进新文件（输出到文件）、发消息给你（输出到聊天）……<strong>Agent 跟整个世界交互，全是靠输入输出这两扇门。</strong>'},
      {try:{q:'Agent 「读一个文件、然后把总结输出到屏幕」——这里面？',opts:[{t:'读文件是输入，输出总结是输出——一进一出',ok:true},{t:'两件事都是输出',ok:false}],fb:'读进来 = 输入（耳朵收）。显示出来 = 输出（嘴说）。Agent 干活，就是不停「输入→处理→输出」，循环往复。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'<strong>输入 = 程序的耳朵（收），输出 = 程序的嘴（说）。</strong><br>Agent 读文件、收消息、调接口——全是输入；回消息、写文件、显示结果——全是输出。它跟世界的一切交互，都走这两扇门。<br>下一关——<strong>Boss</strong>：把这五个零件，按正确顺序串成一个能跑的小程序！'}
  }},
  'w2_6':{world:'w2',n:6,a:'19',boss:true,type:'core',optional:false,title:'Boss · 流程排序',goal:'把步骤按顺序排列',xp:300,achievement:'w2_complete',track:'core',skills:['logic-order','sequence'],prerequisites:['w2_1','w2_2','w2_3','w2_4','w2_5'],outputType:'flowchart',masteryRequired:[{levelId:'w2_5',minStars:2}],version:'v2',content:{
    flow:[
      {talk:'① Boss 登场——把五个零件串起来|这一片森林，你攒了五个零件：<strong>变量（存）、条件（拐弯）、循环（重复）、函数（打包）、输入输出（耳朵嘴巴）</strong>。<br>Boss 战就一件事——<strong>按正确顺序串成一个能跑的小程序。</strong>'},
      {talk:'② 顺序为啥是命门|做菜顺序不能乱：不能先装盘再炒菜。<strong>程序也一样——顺序错了，整个就崩。</strong><br>做「问好机器人」，正确的顺序是：<br>① 先问你名字（输入）→ ② 存进变量 → ③ 判断名字空不空（条件）→ ④ 再输出问候。<br><strong>每步咬上一步——没输入就没东西存，没存就没法判断，没判断输出啥？</strong>'},
      {sequence:{ask:'「问好机器人」要能跑通，这五步该怎么排？拖动或用 ▲▼ 排成正确顺序：',items:[{id:'save',text:'把名字存进变量'},{id:'output',text:'把问候说出去（输出）'},{id:'input',text:'问你叫什么名字（输入）'},{id:'act',text:'拼好一句问候语'},{id:'cond',text:'判断名字是不是空的（条件）'}],answer:['input','save','cond','act','output'],card:'程序逻辑流程图：问好机器人',fb:'先输出问候？可你还没问名字呢，程序只能喊半句「你好，」后面是空的。必须先有输入，才有东西可存、可判断、可输出——一步咬一步。'}},
      {talk:'③ 五个零件一个不能少|回头看这条流程——每个零件你都认识：<br>• 「问你名字」= <strong>输入</strong>（耳朵收）<br>• 「存进变量」= <strong>变量</strong>（放进抽屉）<br>• 「判断名字空不空」= <strong>条件</strong>（如果…就拐弯）<br>• 假设名字不空 → 「输出问候」= <strong>输出</strong>（嘴巴说出去）<br>一个程序，就是把你能认出的这些零件，按顺序拼起来。'},
      {try:{q:'五零件里，哪个负责「把中间结果留住，让后面的步骤能接着用」？',opts:[{t:'变量——给中间结果起名字、存起来',ok:true},{t:'条件判断',ok:false},{t:'输出',ok:false}],fb:'条件管拐弯、输出管往外说——留住中间结果是「变量」的活。问完名字存进变量，后面输出才拿得到这个变量用。'}},
      {talk:'④ 这不就是黑窗口村的「管道接力」吗|还记得那根 <strong>|</strong> 吗？把「列出文件」的结果接给「搜关键词」——<strong>两步排好顺序、自动接力跑</strong>。<br>W1 Boss 两步接力，W2 Boss 五步接力。本质一模一样：<strong>排好顺序，串起来，让电脑一口气跑完。</strong>'},
      {try:{q:'W1 黑窗口村的管道 | 和这一关的「流程排序」——共同点是？',opts:[{t:'都是把多个步骤按顺序串起来，让它自动接力跑完',ok:true},{t:'没啥关系，两个世界教的东不同',ok:false}],fb:'| 两步接力；流程排序五步接力——都是「排好顺序，串起来自动跑」。这就是自动化的骨架——从 2 步到 500 步，原理一样。'}},
      {talk:'⑤ 这就是指挥 Agent 的核心功夫|你以后指挥 Agent 干复杂活，干的正是这件事：<strong>把任务拆成清楚的步骤 → 排好先后顺序 → 让它一步步执行。</strong><br>变量的抽屉存中间结果、条件让它拐弯做决定、循环让它批量不喊累、函数是它手里的工具、输入输出是它的耳朵嘴巴。<strong>这五个零件，你现在全认识了。</strong>'},
      {try:{q:'为啥说「拆步骤 + 排顺序」是指挥 AI 最值钱的本事？',opts:[{t:'Agent 干复杂活，就是按你排好的步骤顺序一步步执行；拆不清、排不对，它就乱套',ok:true},{t:'因为变量比条件重要',ok:false}],fb:'你把活拆成清楚的步骤、排好先后，Agent 才能一步步照着跑对。拆不清、排不对，它就跑偏。——这跟代码本身没关系，这是「会指挥」的功夫。'}},
      {talk:'⑥ 你走到这里——回头看一眼|进代码森林之前，你可能觉得「程序」是一堆看不懂的符号。<br>但现在——你看到的是一堆 <strong>你认识的零件</strong>，按顺序拼在一起：哦，这儿在存东西（变量）；那儿在判断（条件）；这儿在重复干（循环）；那个是打包好的工具（函数）；最外面是耳朵和嘴巴（输入输出）。<br><strong>你已经不是那个「怕代码」的人了。</strong>'}
      ,{trace:{ask:'最后一道综合题——读这段同时用到「变量+条件+循环」的小程序，追踪它（证明你不是背了排序，是真读懂了逻辑）：',code:['总数 = 0','对 每个 订单 in [80, 30, 120]：','    如果 订单 >= 100：','        print("大单：" + 订单)','    否则：','        总数 = 总数 + 订单','print("小单合计：" + 总数)'],checkpoints:[{ask:'① 这个循环会重复几次？',accept:['3','三','3次','三次']},{ask:'② 哪个订单会走进 if、被当「大单」打印？',accept:['120'],contains:true},{ask:'③ 循环结束后，总数（小单合计）是多少？',accept:['110','一百一十']}],finalOutput:{ask:'④ 屏幕最后会打印出哪两行？（大致写出，带上数字）',need:['120','110']},hints:['列表 [80, 30, 120] 里有几个数，就循环几次。','订单 >= 100 才算大单：80、30、120 里只有 120 够格。','80 和 30 不够大单，走否则、累加进总数：80+30=110。','大单 120 打印「大单：120」，循环完打印「小单合计：110」。'],card:'综合追踪卡',cardBody:'你追踪了一段同时用到变量（总数）、条件（>=100）、循环（对每个订单）的真程序——这证明你真读懂了逻辑，不是背了排序。'}}
    ],
    aha:{goal:'🎓 恭喜——代码森林通关！',text:'<strong>写程序 = 把变量、条件、循环、函数、输入输出——按正确顺序串成一段能跑的流程。</strong><br>但更重要的，是你拿到了一套 <strong>「读代码」的眼睛</strong>——以后看 AI 写的代码，你不再满头问号，你能认出：哦这是变量，那是条件，它在循环，这是函数在跑……<br>🎓 赢得认证：<strong>逻辑入门</strong>！从「怕代码」到「看懂逻辑、能拆任务指挥 AI」——这是真本事。<br>（后面的 Python 花园——把这些零件换成真 Python 写一遍——还锁着，等你继续。）'}
  }},
  'w3_1':{world:'w3',n:1,a:'26',boss:false,type:'core',optional:false,title:'Python 是什么',goal:'认识真代码语言',xp:100,content:{
    flow:[
      {talk:'① 你已经会「逻辑」了，现在见真代码|在 W2 代码森林，你用中文伪代码（如果…就…、重复N次）学会了逻辑积木。但那是「翻译版」，为了让你好懂。<br>真实世界里，让电脑干活的代码，是用一种真语言写的——最常见的就是 <strong>Python</strong>。这片花园，就是把你学的伪代码，变成真的、能跑的 Python。'},
      {talk:'② Python 到底是啥|Python 是一种<strong>编程语言</strong>——说白了，就是一套电脑能听懂、又最接近人话的「指令写法」。你用它写一串指令、存成文件，电脑就照着一条条跑。<br>（名字来自一个搞笑剧团，跟蟒蛇没关系——虽然它的 logo 真是两条蛇。）'},
      {talk:'③ 为啥偏偏是它这么火|所有编程语言里，Python <strong>最像英文、最好懂</strong>——<code style="background:#eee;padding:2px 8px;border-radius:4px">print("你好")</code> 你都能猜出是「打印你好」。<br>而且 AI、自动化、数据分析、爬虫……几乎都用它。你以后碰到的 AI 工具、脚本，十有八九是 Python 写的。学它，等于学「AI 时代的普通话」。'},
      {try:{q:'那 Python 到底是个啥？',opts:[{t:'一种电脑能懂、又最接近人话的代码语言',ok:true},{t:'一种蟒蛇',ok:false},{t:'一款聊天软件',ok:false}],fb:'它 logo 是蛇、名字来自剧团——但本质是一种编程语言：一套写给电脑看、又很像英文的指令。'}},
      {talk:'④ 跟你学过的接上了：命令 vs 脚本|还记得黑窗口村你一句句敲命令吗？那是「零售」——敲一句、跑一句。<br>Python 是「批发」——把几十上百步写成一整篇、存成文件，让电脑一次照着跑完。<br>复杂的活，零售敲到手酸；写成 Python 脚本，一次搞定。'},
      {try:{q:'黑窗口一句句敲命令，和写 Python 脚本，最大区别是？',opts:[{t:'脚本能把一串步骤写成一篇、存起来一次跑完',ok:true},{t:'完全没关系，两码事',ok:false},{t:'脚本一定跑得更慢',ok:false}],fb:'一句句敲命令是「零售」，把一串步骤写进 Python 文件一次跑完是「批发」——这就是为啥复杂活都用脚本。'}},
      {talk:'⑤ 最关键的一句：你的目标是「会读」，不是「会写」|重点来了——你是 AI 操作员，不是程序员。你不用背语法、手写上千行代码。<br>你的目标是能<strong>读懂</strong>代码：AI 帮你写好一段脚本，你能看出它写了啥、对不对、敢不敢跑。<strong>会读，你就能验收 AI 的活；读不懂，你只能瞎信。</strong>'},
      {blocks:{runType:'template',ask:'空说无益，你也来写一行真代码——填一句想让电脑说的话，运行看它显示出来（这就是「代码」：你写指令，电脑照做）：',lines:['print("‹word›")'],slots:{word:{label:'想说的话',ph:'比如 你好世界'}},outputTemplate:'{word}',goalRuns:1,card:'第一行代码',cardBody:'你写了一行真 Python：print(...) 让电脑把引号里的话显示出来。代码，就是写给电脑的明确指令。'}},
      {talk:'⑥ 这片花园怎么带你走|接下来：先认识 Python 长啥样，再把 W2 学过的零件（变量、条件、循环、函数）一个个换成真 Python 写一遍——你会发现，跟伪代码几乎一样，只是换了身衣服！最后读懂一段真实小脚本。<br>全程「<strong>选词拼真代码</strong>」，不用你手打一个字母。'},
      {sequence:{ask:'用代码干活，基本就三步。把它们拖成正确顺序：',items:[{id:'write',text:'① 写好代码（比如 print("你好")）'},{id:'run',text:'② 运行它（让电脑照着跑）'},{id:'see',text:'③ 看到输出（屏幕显示 你好）'}],answer:['write','run','see'],card:'代码三步卡',fb:'先有代码，才能运行；运行了，才有输出。就像先写菜谱、再下厨、最后上菜——顺序不能乱。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'<strong>Python = 一种最像人话的真代码语言，是 AI 和自动化的通用语。</strong><br>你在这儿的目标不是「会写」，是「<strong>会读</strong>」——读懂了，就能指挥和验收 AI。<br>下一关：你一个不当程序员的人，为啥也非学点 Python 不可？说透。'}
  }},
  'w3_2':{world:'w3',n:2,a:'27',boss:false,type:'core',optional:false,title:'为何操作员必学它',goal:'搞懂学 Python 的意义',xp:100,content:{
    flow:[
      {talk:'① 你可能在想：我又不当程序员|「我是操作员，让 AI 写代码不就行了，干嘛自己学？」——问得好。<br>答案是：<strong>正因为你要指挥 AI，才更得懂点 Python。</strong>下面三个理由，个个戳中你干活的痛点。'},
      {talk:'② 理由一：Agent 的工具，很多是 Python 写的（也有 JS/TS/Shell/API/MCP 等）|还记得 W2 那句「函数 = Agent 的工具」吗？<br>现实里，Agent 那些工具——查天气、读表格、发邮件——<strong>很多是 Python 写的（也有 JS、TS、Shell、API/MCP 等）</strong>。你想看懂 Agent 到底能干啥、怎么给它加新本事，绕不开 Python。'},
      {try:{q:'为啥懂点 Python 能帮你「看懂 Agent」？',opts:[{t:'Agent 的工具大多是 Python 写的，懂它才看得懂工具',ok:true},{t:'因为 Agent 只会说 Python',ok:false},{t:'因为 Python 能控制 Agent 的情绪',ok:false}],fb:'W2 讲过工具=函数，现实里这些函数多是 Python 写的。懂它，你才看得懂 Agent 手里握着哪些工具、能不能给它加。'}},
      {talk:'③ 理由二：AI 写的代码，得有人验收|你让 AI「写个脚本，把这堆文件按日期分类」。它三秒写好一段 Python。<strong>你敢直接跑吗？</strong>万一它写的是「删除所有文件」呢？<br>能读懂，你就能在跑之前扫一眼：哦，它在读文件、按日期建文件夹、移动——安全，跑。读不懂，你只能闭眼信，出了事都不知道咋回事。'},
      {try:{q:'AI 写好一段脚本，你直接跑之前最该干啥？',opts:[{t:'读一遍，看懂它到底要干啥、安不安全',ok:true},{t:'闭眼就跑，反正信 AI',ok:false},{t:'先把重要文件都删了',ok:false}],fb:'AI 也会写错、会误解你。会读代码，你就能在跑之前把关——这正是操作员的价值：不是自己写，是能验收。'}},
      {talk:'④ 理由三：自动化你自己的重复破事|你每天可能都在干重复的破事：整理文件、改表格、批量下图。这些用几行 Python 就能自动化。<br>你不用从零写，但看得懂、改得动 AI 给你的脚本，就能把这些活甩给电脑，自己去喝茶。'},
      {sequence:{ask:'把「整理一堆文件」这件手工活，拆成电脑能一步步照做的顺序（这是让代码自动化的第一步）：',items:[{id:'list',text:'列出文件夹里所有文件'},{id:'loop',text:'对每个文件，看它的日期'},{id:'folder',text:'按日期建好对应文件夹'},{id:'move',text:'把文件移进对应文件夹'}],answer:['list','loop','folder','move'],card:'任务拆解卡',fb:'自动化第一步：把「整理文件」这种含糊的活，拆成电脑能照做的明确步骤——先列出、再逐个看日期、建文件夹、移进去。拆得清，才能交给代码。'}},
      {talk:'⑤ 所以你的正确姿势：会读 &gt; 会改 &gt; 会写|三个层次，你重点练前两个：<strong>会读</strong>（看懂 AI 写的）、<strong>会改</strong>（小修小调）。「从零写」交给 AI 就行。<br>别有心理负担——你不是要成为程序员，是要成为「看得懂、指挥得动」的操作员。'},
      {try:{q:'操作员学 Python 的正确姿势是？',opts:[{t:'重点会读、会改，从零写交给 AI',ok:true},{t:'必须从零手写所有代码',ok:false},{t:'完全不用懂，全甩给 AI',ok:false}],fb:'会读、会改是你的主战场；从零写交给 AI。但完全不懂也不行——那你就没法验收、没法指挥，只能瞎信。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'你不当程序员，但要懂点 Python，因为：<strong>①Agent 的工具多是它写的 ②你得验收 AI 写的代码 ③自动化你自己的重复活。</strong><br>姿势是 <strong>会读 &gt; 会改 &gt; 会写</strong>。<br>下一关：话不多说，来看 Python 到底长什么样——你的第一行真代码。'}
  }},
  'w3_3':{world:'w3',n:3,a:'28',boss:false,type:'core',optional:false,title:'Python 长什么样',goal:'写出第一行真代码',xp:100,content:{
    flow:[
      {talk:'① 见你的第一行真代码|废话不多说，这就是一行真 Python，也是全世界程序员的第一句：<br><code style="background:#eee;padding:2px 8px;border-radius:4px">print("你好，世界")</code><br>跑起来，屏幕上就显示：<strong>你好，世界</strong>。就这么简单。'},
      {talk:'② 拆开看，一点不神秘（回收 W2 输出）|<code style="background:#eee;padding:2px 8px;border-radius:4px">print</code> = 打印/显示，就是 W2 学的「输出」那扇嘴巴。<br>后面括号 <code style="background:#eee;padding:2px 8px;border-radius:4px">( )</code> 里放「要显示的东西」。<br>引号 <code style="background:#eee;padding:2px 8px;border-radius:4px">" "</code> 里是具体的字。<br>连起来：<code style="background:#eee;padding:2px 8px;border-radius:4px">print("你好，世界")</code> = 「把『你好，世界』这几个字显示出来」。'},
      {try:{q:'<code style="background:#eee;padding:2px 8px;border-radius:4px">print("你好")</code> 这行会让电脑干啥？',opts:[{t:'在屏幕上显示「你好」',ok:true},{t:'计算「你好」等于几',ok:false},{t:'把「你好」偷偷存起来',ok:false}],fb:'print = 显示/打印（就是 W2 的输出）。括号引号里放啥，就显示啥。这行就是「显示你好」。'}},
      {talk:'③ 为啥引号这么重要|引号 <code style="background:#eee;padding:2px 8px;border-radius:4px">" "</code> 是在说「这里面是一段字，原样显示」。<br><code style="background:#eee;padding:2px 8px;border-radius:4px">print("你好")</code> → 显示：你好<br><code style="background:#eee;padding:2px 8px;border-radius:4px">print(你好)</code>（没引号）→ 电脑懵了：「你好」是个啥？是变量吗？→ 报错。<br><strong>要显示一段文字，必须用英文引号裹起来。</strong>'},
      {blocks:{runType:'template',ask:'轮到你——把想显示的字填进 print 的引号里，运行看结果。<strong>再换一句话运行一次</strong>，看输出跟着变：',lines:['print("‹msg›")'],slots:{msg:{label:'要显示的话',ph:'比如 早上好'}},outputTemplate:'{msg}',goalRuns:2,card:'print 运行卡',cardBody:'print 把引号里的字原样显示出来。你换一句、它显示一句——这就是「输出」，脚本靠它把结果说给你听。'}},
      {talk:'④ 亲手拼一次，看它跑出来|下面给你三块，选出能正确显示「你好，世界」的那句，敲下去看输出。'},
      {cmd:{ask:'选出能正确显示「你好，世界」的那句，敲下去：',blocks:['print("你好，世界")','print(你好，世界)','PRINT("你好，世界")'],answer:'print("你好，世界")',result:'你好，世界',note:'← print 把引号里的字原样显示出来了。注意：小写 print、英文括号、英文引号——三样都对才跑得起来。',hints:['要「显示」用 print（回收 W2 的输出），别用大写 PRINT。','显示文字要用英文引号裹起来。','就是 print("你好，世界")，全小写、英文符号。']}},
      {talk:'⑤ 小白必知：大小写和符号，电脑很较真|你可能觉得 PRINT 和 print 差不多——电脑不这么想。<br><strong>Python 里 print 必须全小写</strong>，写成 Print、PRINT 都不认；括号、引号也必须是英文的（中文的「（）」「」不行）。<br>别嫌烦——这是新手 90% 报错的来源。以后 AI 代码跑不起来，先怀疑这些小符号。'},
      {try:{q:'下面哪一行铁定跑不起来？',opts:[{t:'PRINT("你好")——print 大写了',ok:true},{t:'print("你好")',ok:false},{t:'print("hi")',ok:false}],fb:'print 必须全小写，PRINT 电脑不认。这种大小写、中英文符号的小坑，是新手报错的头号原因。'}},
      {talk:'⑥ 连回 AI|你以后看 AI 写的脚本，满屏都是 print——它用 print 把「算到哪了」「结果是啥」显示给你看。<br><strong>看到 print，你就知道：哦，这行是在「往外说话」给我看。</strong>读懂 print，你就读懂了脚本的「嘴巴」。'}
    ],
    aha:{goal:'你今天真正学会的',text:'你写出了人生第一行真代码：<code style="background:#eee;padding:2px 8px;border-radius:4px">print("...")</code> = 把引号里的字显示出来（就是 W2 的输出）。<br>还记住了小白铁律：<strong>全小写、英文符号，电脑很较真</strong>——这是新手头号报错来源。<br>下一关：把 W2 的「变量」换成真 Python 写一遍——你会发现几乎没变。'}
  }},
  'w3_4':{world:'w3',n:4,a:'29',boss:false,type:'core',optional:false,title:'变量（真 Python）',goal:'用真 Python 存信息',xp:100,content:{
    flow:[
      {talk:'① 好消息：你 W2 已经学过了|还记得 W2 的变量吗？「给信息起个名字，方便反复用」——手机存「妈妈」那个。<br>真 Python 的变量，跟你学的<strong>几乎一模一样</strong>，你已经会一大半。'},
      {talk:'② 真 Python 长啥样|<code style="background:#eee;padding:2px 8px;border-radius:4px">名字 = "小明"</code>。左边「名字」是标签，右边「小明」是内容——跟 W2 完全一样！<br>区别就俩：① 引号用<strong>英文的</strong> <code style="background:#eee;padding:2px 8px;border-radius:4px">" "</code>；② 它是真能跑的代码，不是伪代码。'},
      {talk:'③ 关键坑：英文引号 vs 中文引号|存文字必须用英文双引号 <code style="background:#eee;padding:2px 8px;border-radius:4px">"小明"</code>。中文的「小明」电脑<strong>不认</strong>，会报错。<br>为啥？代码是给电脑看的，它只认英文那套标点。这跟上一关 print 的引号是同一个道理——电脑很较真。'},
      {try:{q:'真 Python 里给变量存文字，引号该用哪种？',opts:[{t:'英文双引号 "小明"',ok:true},{t:'中文引号「小明」',ok:false},{t:'不用引号',ok:false}],fb:'必须英文引号 " "。中文「」电脑不认——这是伪代码到真代码最容易踩的坑，跟 print 一个道理。'}},
      {talk:'④ 存进去，怎么拿出来用（回收上关 print）|<code style="background:#eee;padding:2px 8px;border-radius:4px">print(名字)</code> → 显示：小明。<br>注意：<code style="background:#eee;padding:2px 8px;border-radius:4px">print(名字)</code> <strong>不加引号</strong>，显示的是变量里存的「小明」。<br>要是写成 <code style="background:#eee;padding:2px 8px;border-radius:4px">print("名字")</code>（加了引号），就变成显示「名字」这俩字了——<strong>引号一加，意思全变。</strong>'},
      {cmd:{ask:'变量 名字 里存了「小明」。选出「把存的小明显示出来」的正确写法，敲下去：',blocks:['print(名字)','print("名字")','PRINT(名字)'],answer:'print(名字)',result:'小明',note:'← 显示的是变量里存的「小明」。若写成 print("名字")，屏幕会显示「名字」两个字——加不加引号，天差地别。',hints:['要显示「变量里存的东西」，print 里直接写变量名，不加引号。','print("名字")会显示「名字」俩字；print(名字)才显示里面的小明。','就是 print(名字)，不加引号、全小写。']}},
      {talk:'⑤ 存数字不用引号|存文字要引号，但存数字<strong>不用</strong>：<code style="background:#eee;padding:2px 8px;border-radius:4px">年龄 = 18</code>（直接写 18，没引号）。<br>为啥？文字是「一段字符」，要引号框起来；数字就是数字，电脑天生认识。这个区别下一关细讲。'},
      {try:{q:'下面哪个把「年龄 18」存对了？',opts:[{t:'年龄 = 18',ok:true},{t:'年龄 = "18岁"（想存数字却加了引号变文字）',ok:false},{t:'18 = 年龄（左右反了）',ok:false}],fb:'数字直接写、不加引号：年龄 = 18。而且等号左边是名字、右边是值——不能反过来写 18 = 年龄。'}},
      {talk:'⑥ 会认变量，你就读懂脚本一大半|AI 写的脚本里满屏是变量：它把「读到的内容」「算出的结果」存进一个个变量，后面接着用。<br>你看到 <code style="background:#eee;padding:2px 8px;border-radius:4px">结果 = ...</code>，一眼就懂：哦，有个叫「结果」的抽屉，存了东西。<strong>认出变量，是读代码的第一步。</strong>'},
      {blocks:{runType:'template',ask:'给变量「商品」填个名、「价格」填个数，运行看整句输出。<strong>改一下价格再运行一次</strong>，看输出跟着变：',lines:['商品 = "‹name›"','价格 = ‹price›','print(商品 + " 卖 " + 价格 + " 元")'],slots:{name:{label:'商品',ph:'比如 苹果'},price:{label:'价格',ph:'比如 5'}},outputTemplate:'{name} 卖 {price} 元',goalRuns:2,card:'变量运行卡',cardBody:'你把数据存进变量（商品、价格），print 时被取出来拼进句子。改了变量的值，输出立刻跟着变——这就是变量：存住数据、随时取用。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'真 Python 变量 = W2 那个变量，只是引号换成英文、数字不加引号。<br><strong>会认变量（<code style="background:#eee;padding:2px 8px;border-radius:4px">xxx = ...</code>），你就读懂了脚本的骨架。</strong><br>下一关：变量里存的东西，分「文字」和「数字」两种——搞混会出大错。'}
  }},
  'w3_5':{world:'w3',n:5,a:'30',boss:false,type:'core',optional:false,title:'数据类型',goal:'分清文字和数字',xp:100,content:{
    flow:[
      {talk:'① 接上一关：存的东西，分两大类|上一关你发现：存文字要引号（<code style="background:#eee;padding:2px 8px;border-radius:4px">"小明"</code>），存数字不用（<code style="background:#eee;padding:2px 8px;border-radius:4px">18</code>）。<br>这不是随便规定的——因为电脑把它俩当<strong>两种不同的东西</strong>看待。这就是「数据类型」。'},
      {talk:'② 两个最常见的类型：文字 和 数字|<strong>文字（也叫字符串）</strong>：用引号裹起来，如 <code style="background:#eee;padding:2px 8px;border-radius:4px">"小明"</code> <code style="background:#eee;padding:2px 8px;border-radius:4px">"你好"</code>。电脑当成「一串字符」。<br><strong>数字</strong>：不加引号，如 <code style="background:#eee;padding:2px 8px;border-radius:4px">18</code> <code style="background:#eee;padding:2px 8px;border-radius:4px">3.14</code>。电脑当成「能算的数」。'},
      {try:{q:'<code style="background:#eee;padding:2px 8px;border-radius:4px">"18"</code>（带引号）和 <code style="background:#eee;padding:2px 8px;border-radius:4px">18</code>（不带引号），对电脑是一回事吗？',opts:[{t:'不是——"18"是文字，18是数字，电脑区别对待',ok:true},{t:'一样，都是18',ok:false},{t:'带引号的那个更大',ok:false}],fb:'加了引号就是「文字18」（一串字符），不加就是「数字18」（能算的数）。电脑看得很清楚，你也得分清。'}},
      {talk:'③ 为啥非要分？因为能干的事不一样|数字能算：<code style="background:#eee;padding:2px 8px;border-radius:4px">18 + 1</code> → 19。<br>文字不能算，但能拼：<code style="background:#eee;padding:2px 8px;border-radius:4px">"你好" + "世界"</code> → 「你好世界」（接起来）。<br>要命的是：<code style="background:#eee;padding:2px 8px;border-radius:4px">"18" + "1"</code>（俩文字）→ 「181」（拼一起，不是19！）。<strong>类型错了，结果全错。</strong>'},
      {trace:{ask:'同样是 5 和 3，加不加引号，结果天差地别。追踪这段，看清「类型」的威力：',code:['a = "5" + "3"','b = 5 + 3','print(a)','print(b)'],checkpoints:[{ask:'① a 的值是多少？（"5"和"3"带引号是文字，相加=拼接）',accept:['53']},{ask:'② b 的值是多少？（5和3不带引号是数字，相加=计算）',accept:['8','八']},{ask:'③ a 是「文字」相加还是「数字」相加？填两字',accept:['文字','字符串'],contains:true}],finalOutput:{ask:'④ print(a) 和 print(b) 依次显示哪两行？',need:['53','8']},hints:['带引号的 "5" 是文字，文字相加是「拼接」——贴在一起。','不带引号的 5 是数字，数字相加是「计算」——算总和。','a="5"+"3" 文字拼接=53；b=5+3 数字计算=8。','屏幕依次显示 53、8。'],card:'类型追踪卡',cardBody:'"5"+"3"=53（文字拼接），5+3=8（数字计算）。加不加引号、类型就变、结果全变——这就是为什么读代码要先分清数据类型。'}},
      {talk:'④ 生活类比：门牌号里的数字|你家门牌「18号」里的 18，你会拿去做加法吗？不会——它只是个标签。手机号也是，没人把手机号相加。<br><strong>长得像数字，不一定是「能算的数」</strong>——这时它其实该当文字。'},
      {try:{q:'手机号 应该存成文字还是数字？',opts:[{t:'文字——它是一串编号，不拿来算，还可能以0开头',ok:true},{t:'数字——因为它全是数',ok:false},{t:'无所谓，随便',ok:false}],fb:'手机号不做加减、还常以0开头（当数字会把开头的0吃掉）。所以它该是「文字」。长得像数字≠是数字，关键看「拿不拿来算」。'}},
      {talk:'⑤ 还有别的类型，先混个脸熟|除了文字和数字，还有：<strong>真/假</strong>（对错，写作 True/False——回收 W2 条件的「成不成立」）；以及下两关的<strong>列表</strong>（一串东西）、<strong>字典</strong>（带标签的一堆）。<br>现在不用记，知道「数据分好几种类型」就行。'},
      {try:{q:'为啥「数据类型」对读代码重要？',opts:[{t:'类型决定这个数据能干啥，错了结果就错',ok:true},{t:'类型只是为了好看',ok:false},{t:'类型能让代码跑更快',ok:false}],fb:'文字能拼、数字能算，类型错了（比如该算的数存成了文字）结果就全错。读代码时看清每个东西是文字还是数字，才不会看走眼。'}},
      {talk:'⑥ 连回 AI|AI 写脚本、或你让它处理数据时，类型是头号翻车点：该算的存成了文字、Excel 里的「数字」其实是文本……<br><strong>你懂类型，就能一眼看出「哦这里 AI 把类型搞错了」，揪出 bug。</strong>'}
    ],
    aha:{goal:'你今天真正学会的',text:'数据分类型：<strong>文字（带引号、能拼）、数字（不带引号、能算）</strong>，还有真假、列表、字典。<br>类型错了结果全错（<code style="background:#eee;padding:2px 8px;border-radius:4px">"5"+"3"="53"</code> 不是 8）。看清类型，是读代码不看走眼的关键。<br>下一关：一串东西怎么装一块儿——列表。'}
  }},
  'w3_6':{world:'w3',n:6,a:'31',boss:false,type:'core',optional:false,title:'列表',goal:'用列表装一串东西',xp:100,content:{
    flow:[
      {talk:'① 处境：一串东西，总不能一个个存吧|你要存全班 30 个人的名字。难道 <code style="background:#eee;padding:2px 8px;border-radius:4px">名字1="小明"</code> <code style="background:#eee;padding:2px 8px;border-radius:4px">名字2="小红"</code>……存 30 个变量？太蠢了。<br>Python 有个专门装「一串东西」的零件——<strong>列表</strong>。'},
      {talk:'② 列表长啥样：一个方括号，装一串|<code style="background:#eee;padding:2px 8px;border-radius:4px">水果 = ["苹果", "香蕉", "橙子"]</code><br>用方括号 <code style="background:#eee;padding:2px 8px;border-radius:4px">[ ]</code> 把一串东西框起来，中间用逗号隔开——这就是一个列表，存进了变量「水果」。<br>类比：一个篮子，里面码着一排东西。'},
      {try:{q:'想把三种水果装一块儿存起来，用哪个？',opts:[{t:'列表：["苹果","香蕉","橙子"]',ok:true},{t:'三个各存一个的单独变量',ok:false},{t:'一个数字',ok:false}],fb:'一串同类东西装一块儿，用列表（方括号 [ ]）。比起存三个单独变量，列表能整体管理、还能循环挨个处理。'}},
      {talk:'③ 怎么取出其中一个：按「位置」|<code style="background:#eee;padding:2px 8px;border-radius:4px">水果[0]</code> → 「苹果」。<br>⚠️ 大坑：<strong>Python 从 0 开始数！</strong>第一个是 <code style="background:#eee;padding:2px 8px;border-radius:4px">[0]</code>，第二个是 <code style="background:#eee;padding:2px 8px;border-radius:4px">[1]</code>，第三个是 <code style="background:#eee;padding:2px 8px;border-radius:4px">[2]</code>。<br>为啥反人类？历史原因，记住就行：<strong>要第 N 个，写 [N-1]</strong>。'},
      {trace:{ask:'列表按「位置」取东西，位置从 0 数起。追踪这个水果列表：',code:['水果 = ["苹果", "香蕉", "橙子"]','print(水果[0])','print(水果[2])'],checkpoints:[{ask:'① 这个列表里一共有几个水果？',accept:['3','三','3个','三个']},{ask:'② 水果[0] 取到的是哪个？（从0数，[0]是第一个）',accept:['苹果'],contains:true},{ask:'③ 水果[2] 取到的是哪个？',accept:['橙子'],contains:true}],finalOutput:{ask:'④ 这段依次打印哪两行？',need:['苹果','橙子']},hints:['方括号里逗号隔开的项，数一数有几个。','Python 从 0 数：[0]是第一个=苹果。','[2]是第三个=橙子（[0]苹果 [1]香蕉 [2]橙子）。','print(水果[0])→苹果，print(水果[2])→橙子。'],card:'列表追踪卡',cardBody:'列表用方括号装一串，按位置取（从 0 数）：[0]苹果、[1]香蕉、[2]橙子。数清长度、认准位置，就能读懂列表操作。'}},
      {cmd:{ask:'水果 = ["苹果","香蕉","橙子"]，选出「取出第一个（苹果）」的写法，敲下去：',blocks:['水果[0]','水果[1]','水果(0)'],answer:'水果[0]',result:'苹果',note:'← 从 0 数，第一个是 [0]。用方括号 [ ] 取，不是圆括号 ( )——圆括号是叫函数用的。',hints:['Python 从 0 开始数，第一个的编号是 0。','取列表元素用方括号 [ ]，不是圆括号。','就是 水果[0]。']}},
      {talk:'④ 列表能干啥：回收 W2 循环|还记得 W2 的「对 每个 …」吗？列表最搭循环：<strong>列表装一串，循环挨个过</strong>——把苹果香蕉橙子一个个处理一遍。<br>这俩是天生一对（下一关字典、再下关 for 会把它们串起来）。'},
      {try:{q:'列表和 W2 学的哪个零件最搭？',opts:[{t:'循环——列表装一串，循环挨个处理',ok:true},{t:'变量的引号',ok:false},{t:'输入',ok:false}],fb:'列表装「一串东西」，循环负责「挨个干一遍」——完美搭配。你要批量处理一堆数据，基本都是「列表+循环」。'}},
      {talk:'⑤ 连回 AI|AI 处理数据时列表无处不在：一批文件名、一堆搜索结果、一串消息……都是列表。<br><strong>你看到方括号 <code style="background:#eee;padding:2px 8px;border-radius:4px">[...]</code>，就知道：哦，这是一串东西打包在一起。</strong>再看到它配循环，就知道 AI 要挨个处理了。'}
    ],
    aha:{goal:'你今天真正学会的',text:'列表 = 用方括号 <code style="background:#eee;padding:2px 8px;border-radius:4px">[ ]</code> 装一串东西，按位置取（<code style="background:#eee;padding:2px 8px;border-radius:4px">[0]</code> 是第一个，<strong>从0数</strong>！）。<br>它跟循环是天生一对，是批量处理数据的基础。<br>下一关：列表按「位置」找东西；要按「名字」找呢？——字典。'}
  }},
  'w3_7':{world:'w3',n:7,a:'32',boss:false,type:'core',optional:false,title:'字典',goal:'用字典按名字存取',xp:100,content:{
    flow:[
      {talk:'① 处境：按「位置」找，不好使的时候|列表按位置找（<code style="background:#eee;padding:2px 8px;border-radius:4px">水果[0]</code>）。但有些东西你记不住位置，只记得「名字」。<br>比如一个人的信息：名字、年龄、城市。你想按「年龄」直接查，而不是记「年龄排第几」。<br>这时候用另一个零件——<strong>字典</strong>。'},
      {talk:'② 字典长啥样：成对的「标签: 内容」|<code style="background:#eee;padding:2px 8px;border-radius:4px">人 = {"名字": "小明", "年龄": 18}</code><br>用花括号 <code style="background:#eee;padding:2px 8px;border-radius:4px">{ }</code>，里面是一对对「标签: 内容」（行话叫 键:值），逗号隔开。<br>类比：真的字典——你按「词」（标签）查「解释」（内容）。或者：一排贴了名字标签的抽屉。'},
      {try:{q:'字典和列表最大的区别是？',opts:[{t:'字典按「名字/标签」找，列表按「位置」找',ok:true},{t:'字典一定更大',ok:false},{t:'没区别',ok:false}],fb:'列表按位置（[0][1]），字典按标签（"名字""年龄"）。记不住位置、但记得叫啥时，用字典。'}},
      {talk:'③ 怎么查：按标签取|<code style="background:#eee;padding:2px 8px;border-radius:4px">人["名字"]</code> → 「小明」。<br>用方括号 <code style="background:#eee;padding:2px 8px;border-radius:4px">[ ]</code>，里面填标签（标签是文字，要带引号）。<br>比列表直观多了——你不用数「名字排第几」，直接按名字问。'},
      {trace:{ask:'字典按「名字标签」取东西，不用数位置。追踪这个字典：',code:['人 = {"名字": "小明", "年龄": 18, "城市": "北京"}','print(人["名字"])','print(人["城市"])'],checkpoints:[{ask:'① 人["名字"] 取到的是？',accept:['小明'],contains:true},{ask:'② 人["城市"] 取到的是？',accept:['北京'],contains:true},{ask:'③ 想取到年龄 18，该写 人[ 什么 ]？填那个标签',accept:['年龄'],contains:true}],finalOutput:{ask:'④ 这段依次打印哪两行？',need:['小明','北京']},hints:['字典按标签取：人["名字"] 就是「名字」标签对应的值。','人["城市"] 取「城市」标签的值=北京。','要取年龄，就用「年龄」这个标签：人["年龄"]。','print(人["名字"])→小明，print(人["城市"])→北京。'],card:'字典追踪卡',cardBody:'字典用花括号装「标签:值」，按标签取：人["名字"]→小明。不用记位置，按名字查一目了然——AI 返回的数据大多是字典。'}},
      {cmd:{ask:'人 = {"名字":"小明","年龄":18}，选出「取出名字（小明）」的写法，敲下去：',blocks:['人["名字"]','人[0]','人(名字)'],answer:'人["名字"]',result:'小明',note:'← 字典按标签取：方括号里填标签「名字」（带引号）。不像列表用数字位置，字典用名字更好记。',hints:['字典按「标签」取，不是位置。','标签是文字，要带引号，放方括号里。','就是 人["名字"]。']}},
      {talk:'④ 列表 vs 字典：啥时候用哪个|<strong>列表</strong>：一串同类的、讲顺序的（30个学生名字、一批文件）。<br><strong>字典</strong>：一个东西的多种属性、按名字查的（一个人的名字/年龄/城市；一件商品的价格/库存）。<br>记不住？列表像「排队」，字典像「贴标签的储物柜」。'},
      {try:{q:'要存「一件商品的：名称、价格、库存」，用哪个更合适？',opts:[{t:'字典——按「价格」「库存」这些标签查',ok:true},{t:'列表——按位置 0/1/2 记',ok:false},{t:'都不行',ok:false}],fb:'一个东西的多种属性，用字典最合适：商品["价格"]、商品["库存"]，按名字查一目了然。列表得记「价格排第几」，反人类。'}},
      {talk:'⑤ 连回 AI（很重要）|AI 返回的数据，十有八九是字典：查天气返回 <code style="background:#eee;padding:2px 8px;border-radius:4px">{"温度":25,"天气":"晴"}</code>、查用户返回 <code style="background:#eee;padding:2px 8px;border-radius:4px">{"名字":...,"ID":...}</code>。<br><strong>你看到花括号 <code style="background:#eee;padding:2px 8px;border-radius:4px">{标签:值}</code>，就知道：哦，这是一个东西的一堆属性，我能按标签把想要的挑出来。</strong>这是读懂 AI/接口返回数据的关键。'}
    ],
    aha:{goal:'你今天真正学会的',text:'字典 = 用花括号 <code style="background:#eee;padding:2px 8px;border-radius:4px">{ }</code> 装「标签: 内容」成对的数据，按标签取（<code style="background:#eee;padding:2px 8px;border-radius:4px">人["名字"]</code>）。<br>列表按位置、字典按名字。<strong>AI 返回的数据大多是字典</strong>——认得它，你就能从一堆返回里挑出想要的。<br>下一关：把 W2 的「如果…就…」换成真 Python 的 if。'}
  }},
  'w3_8':{world:'w3',n:8,a:'33',boss:false,type:'core',optional:false,title:'if（真 Python）',goal:'用真 Python 做判断',xp:100,content:{
    flow:[
      {talk:'① 接上一关：把 W2 的「如果…就…」变成真的|回收 W2 条件！伪代码写 <code style="background:#eee;padding:2px 8px;border-radius:4px">如果 下雨： 带伞</code>。真 Python 几乎一样，只把关键词换成英文 <strong>if</strong>。'},
      {talk:'② 真 Python 的 if 长啥样|<code style="background:#eee;padding:2px 8px;border-radius:4px">if 余额 &lt; 10:</code> 换行、缩进 <code style="background:#eee;padding:2px 8px;border-radius:4px">print("该充值了")</code>。<br>翻译：如果余额小于 10，就显示「该充值了」。跟 W2 完全一个意思，只是「如果」写成 <code style="background:#eee;padding:2px 8px;border-radius:4px">if</code>。'},
      {talk:'③ 两个新东西：冒号 和 缩进|Python 靠这俩表示「下面这段归 if 管」：① <code style="background:#eee;padding:2px 8px;border-radius:4px">if 条件</code> 后面要跟一个<strong>冒号 :</strong>；② 下一行要<strong>缩进</strong>（空几格）。缩进的那几行，才是「条件成立时才干的事」。<br>类比：if 是标题，缩进的是「标题下属的内容」。'},
      {try:{q:'真 Python 里，if 那行结尾要加啥？',opts:[{t:'冒号 :',ok:true},{t:'句号 。',ok:false},{t:'啥都不加',ok:false}],fb:'if 条件后面必须跟冒号 :，然后下一行缩进写「要干的事」。冒号+缩进，是 Python 表示「这段归谁管」的方式。'}},
      {talk:'④ 缩进不是为了好看，是硬规矩|别的语言用括号 <code style="background:#eee;padding:2px 8px;border-radius:4px">{ }</code> 圈代码，Python 偏偏用缩进。<strong>缩进错了，程序就跑错甚至报错。</strong><br>好在你只是「读」——看到缩进就知道：哦，这段归上面那个 if 管。'},
      {try:{q:'为啥 Python 里「缩进」很要紧？',opts:[{t:'缩进决定哪些代码归 if 管，错了就跑错',ok:true},{t:'缩进只是让代码好看',ok:false},{t:'缩进可有可无',ok:false}],fb:'Python 用缩进表示「从属关系」——缩进的行归上面的 if 管。缩错了逻辑就乱。读代码看缩进，就知道谁管谁。'}},
      {talk:'⑤ 还有 else（回收 W2 的「否则」）|<code style="background:#eee;padding:2px 8px;border-radius:4px">if 及格: 发奖状</code> 换行 <code style="background:#eee;padding:2px 8px;border-radius:4px">else: 补考</code>。<code style="background:#eee;padding:2px 8px;border-radius:4px">else</code> 就是 W2 的「否则」——if 不成立时走这条。冒号、缩进规矩一样。'},
      {cmd:{ask:'把「如果余额小于10就提醒」写成真 Python，选正确那句（注意冒号），敲下去：',blocks:['if 余额 < 10:','if 余额 < 10','如果 余额 < 10:'],answer:'if 余额 < 10:',result:'余额是5、小于10 → 条件成立，输出：该充值了',note:'← if + 条件 + 冒号。英文 if（不是中文「如果」）、结尾带冒号——两样都对才行。下一行缩进写「要干的事」。',hints:['真 Python 用英文 if，不是中文「如果」。','if 那行结尾要加冒号 :。','就是 if 余额 < 10:（英文 if、带冒号）。']}},
      {talk:'⑥ 连回 AI|AI 写的脚本里 <code style="background:#eee;padding:2px 8px;border-radius:4px">if</code> 满地都是——它靠 if 判断「文件在不在」「网通不通」「该走哪条路」。<br><strong>你看到 <code style="background:#eee;padding:2px 8px;border-radius:4px">if ...:</code> 加缩进，就知道：哦，这儿 AI 在做判断、分了个岔，缩进里是「满足条件才干的事」。</strong>'},
      {blocks:{runType:'branch',ask:'轮到你跑真 Python 的 if——给「余额」填个数，运行看它走哪条路。<strong>填个小于10的、再填个大于10的，两条路都走一遍：</strong>',lines:['余额 = ‹balance›','if 余额 < 10:','    print("该充值了")','else:','    print("余额充足")'],input:'balance',op:'<',ref:10,whenTrue:{tag:'if 成立',out:'该充值了'},whenFalse:{tag:'else',out:'余额充足'},goalBranches:['true','false'],card:'if 运行卡',cardBody:'余额<10 成立走 if（该充值了），不成立走 else（余额充足）。你改余额、它换分支——这就是 if 让程序「看情况办事」，和 W2 的「如果…就…」是一回事。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'真 Python 条件 = W2 的「如果…就…」，关键词换成 <strong>if</strong>，加两样新东西：<strong>冒号 : + 缩进</strong>（缩进的行归 if 管）。还有 <strong>else</strong> = 「否则」。<br>看到 if 加缩进，你就读懂了脚本的「岔路口」。<br>下一关：把 W2 的循环变成真 Python 的 for。'}
  }},
  'w3_9':{world:'w3',n:9,a:'34',boss:false,type:'core',optional:false,title:'for（真 Python）',goal:'用真 Python 重复处理',xp:100,content:{
    flow:[
      {talk:'① 接上一关：把 W2 的「重复」变成真的|回收 W2 循环！伪代码 <code style="background:#eee;padding:2px 8px;border-radius:4px">对 每个 水果： 打印</code>。真 Python 用关键词 <strong>for</strong>，而且最常配上一关学的<strong>列表</strong>一起用。'},
      {talk:'② 真 Python 的 for 长啥样|<code style="background:#eee;padding:2px 8px;border-radius:4px">for 水果 in 水果们:</code> 换行缩进 <code style="background:#eee;padding:2px 8px;border-radius:4px">print(水果)</code>。<br>翻译：对「水果们」这个列表里的每一个，依次拿出来叫「水果」，然后显示它。跟 W2「对每个…」一个意思——挨个过一遍。'},
      {talk:'③ 它俩配一起：for + 列表|<code style="background:#eee;padding:2px 8px;border-radius:4px">水果们 = ["苹果","香蕉","橙子"]</code>，然后 <code style="background:#eee;padding:2px 8px;border-radius:4px">for 水果 in 水果们:</code> → 会依次显示 苹果、香蕉、橙子。<br><strong>列表装一串，for 挨个拿出来处理</strong>——W3 第6关埋的「天生一对」，这关兑现了。'},
      {trace:{ask:'for 循环挨个拿列表里的东西。追踪这段，看清每一轮「分」是谁：',code:['分数们 = [60, 75, 90]','for 分 in 分数们:','    print(分)'],checkpoints:[{ask:'① 列表 分数们 里有几个数？循环会跑几次？',accept:['3','三','3次','三次']},{ask:'② 第 1 轮，分 的值是多少？',accept:['60']},{ask:'③ 第 3 轮（最后一轮），分 的值是多少？',accept:['90']}],finalOutput:{ask:'④ 这段会依次打印哪三行？',need:['60','75','90']},hints:['循环次数=列表元素个数，数方括号里几个数。','for 挨个拿：第 1 轮 分=第一个=60。','第 3 轮拿最后一个=90（60→75→90）。','每轮 print 一次当前的 分：依次 60、75、90。'],card:'for 循环追踪卡',cardBody:'for 分 in 分数们：把列表里每个数依次拿出来叫「分」，跑一遍缩进里的事。3 个数循环 3 次，分 依次 60、75、90——这就是循环逐项处理。'}},
      {talk:'④ 同样的规矩：冒号 + 缩进|跟 if 一样，<code style="background:#eee;padding:2px 8px;border-radius:4px">for ...:</code> 结尾要冒号，下一行要缩进——缩进的才是「每次重复要干的事」。<br>Python 全靠冒号+缩进表示「这段归谁管」，if 和 for 都这样。'},
      {try:{q:'<code style="background:#eee;padding:2px 8px;border-radius:4px">for</code> 那行，和上一关 <code style="background:#eee;padding:2px 8px;border-radius:4px">if</code> 一样，结尾都要加？',opts:[{t:'冒号 :，下一行缩进',ok:true},{t:'分号 ;',ok:false},{t:'一对括号',ok:false}],fb:'if 和 for 规矩一样：结尾冒号、下一行缩进。缩进里是「每次循环要干的事」。记住这个统一规矩，读代码就顺了。'}},
      {cmd:{ask:'把「对水果们列表里每个，都显示出来」写成真 Python 的开头，选正确的（注意冒号），敲下去：',blocks:['for 水果 in 水果们:','for 水果 in 水果们','repeat 水果们:'],answer:'for 水果 in 水果们:',result:'苹果<br>香蕉<br>橙子',note:'← for X in 列表: —— 依次把列表里每个拿出来叫 X，缩进里对 X 做事。结尾冒号别忘。',hints:['真 Python 用 for … in 列表:，不是 repeat。','结尾要冒号。','就是 for 水果 in 水果们:。']}},
      {talk:'⑤ 大白话记法：for X in 一串东西|你不用记语法细节，记这个人话模板：<strong>「对（for）一串东西里的每一个 X，做…」</strong>。<br>看到 <code style="background:#eee;padding:2px 8px;border-radius:4px">for ... in ...:</code>，脑子里翻译成「挨个拿出来处理」，就够读懂了。'},
      {talk:'⑥ 连回 AI|你让 AI「把这 50 个文件改名」「给 200 条评论打标签」——它写的脚本里，一定有个 for 循环：对每个文件/每条评论，重复干一遍。<br><strong>看到 for，你就知道：哦，AI 在这儿批量干活，缩进里是「对每个都做的事」。</strong>'},
      {try:{q:'W3 的 for 和 W3 的列表，为啥是「天生一对」？',opts:[{t:'列表装一串，for 挨个拿出来处理',ok:true},{t:'它俩其实没关系',ok:false},{t:'for 只能配数字，不配列表',ok:false}],fb:'列表装一串东西，for 负责挨个过一遍——装+处理，天生一对。批量活基本都是「列表+for」。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'真 Python 循环 = W2 的「重复/对每个」，关键词 <strong>for X in 列表:</strong>，配列表用最多，规矩还是冒号+缩进。<br>看到 for，就知道 AI 在批量处理一串东西。<br>下一关：把 W2 的函数变成真 Python 的 def——也就是 Agent 工具的真身。'}
  }},
  'w3_10':{world:'w3',n:10,a:'35',boss:false,type:'core',optional:false,title:'函数（真 Python）',goal:'用真 Python 打包步骤',xp:100,content:{
    flow:[
      {talk:'① 接上一关：把 W2 的「打包」变成真的|回收 W2 函数！伪代码 <code style="background:#eee;padding:2px 8px;border-radius:4px">定义 泡面()： 烧水; 放面; 等3分钟</code>。真 Python 用关键词 <strong>def</strong>（define「定义」的缩写）。'},
      {talk:'② 真 Python 的函数长啥样|<code style="background:#eee;padding:2px 8px;border-radius:4px">def 泡面():</code> 换行缩进 <code style="background:#eee;padding:2px 8px;border-radius:4px">print("烧水")</code> <code style="background:#eee;padding:2px 8px;border-radius:4px">print("放面")</code>。<br>用 def 定义、起名、加冒号，缩进里是打包的步骤。跟 W2 一个意思：把一串动作打包起名。'},
      {talk:'③ 怎么用：喊名字（带括号）|定义好后，写 <code style="background:#eee;padding:2px 8px;border-radius:4px">泡面()</code> 就把里面步骤全跑一遍。<br><strong>括号 ( ) 是「调用」的标志</strong>——看到「名字()」，就是在喊这个函数干活。'},
      {try:{q:'定义了 <code style="background:#eee;padding:2px 8px;border-radius:4px">def 泡面():</code>，以后想让它跑起来，写啥？',opts:[{t:'泡面()——名字加括号就是调用',ok:true},{t:'泡面（没括号）',ok:false},{t:'def 泡面',ok:false}],fb:'定义用 def；调用就写「名字()」。括号是「调用」的标志——泡面() 就是喊泡面这个函数干活。'}},
      {talk:'④ 规矩还是那套：冒号 + 缩进|<code style="background:#eee;padding:2px 8px;border-radius:4px">def 名字():</code> 结尾冒号，下一行缩进——缩进的是「打包进函数的步骤」。<br>def、if、for，全是冒号+缩进这套。你现在应该很眼熟了。'},
      {sequence:{ask:'一个函数从「造出来」到「给你结果」，要经过这几步。拖成正确顺序：',items:[{id:'def',text:'用 def 定义函数、起个名（def 打招呼(名字):）'},{id:'call',text:'喊名字调用它、把参数传进去（打招呼("小明")）'},{id:'run',text:'函数内部的步骤跑一遍（处理传进来的名字）'},{id:'ret',text:'返回结果给你（"你好，小明"）'}],answer:['def','call','run','ret'],card:'函数调用流程卡',fb:'函数要先「定义」（造好），才能「调用」（使用）；一调用，内部步骤跑一遍，最后「返回」结果。定义→调用→执行→返回，缺一不可。'}},
      {cmd:{ask:'把「定义一个叫 问好 的函数」写成真 Python 开头，选正确的（注意 def 和冒号），敲下去：',blocks:['def 问好():','def 问好','函数 问好():'],answer:'def 问好():',result:'定义成功，以后写 问好() 就能调用它',note:'← def + 名字 + () + 冒号。英文 def（不是中文「函数」）、带括号、带冒号。下一行缩进写打包的步骤。',hints:['真 Python 用 def 定义函数，不是中文「函数」。','def 名字() 后面要冒号。','就是 def 问好():。']}},
      {talk:'⑤ 重磅回收：函数 = Agent 的工具|还记得 W2 那个大发现吗？<strong>命令、函数、Agent 工具，本质相通（都是打包好的能力）。</strong><br>现在你看到真 Python 的 def，就是在「造一个工具」。你给 Agent 加的每个工具（查天气、发邮件），底层都是一段 def 定义的函数。'},
      {talk:'⑥ 连回 AI|AI 写的脚本、Agent 的工具，满眼是 def。<br><strong>你看到 <code style="background:#eee;padding:2px 8px;border-radius:4px">def 名字():</code>，就知道：哦，这儿在定义一个「工具/功能」，缩进里是它干的活；看到「名字()」，就是在用这个工具。</strong>读懂 def，你就看懂了 Agent 的「手」是怎么造的。'},
      {try:{q:'「命令、函数、Agent 工具」三者关系，一句话说清？',opts:[{t:'同一个东西的三个名字——都是打包好的一串步骤',ok:true},{t:'三个完全不同的东西',ok:false},{t:'只有函数是真的，另俩是比喻',ok:false}],fb:'W1 命令、W2 函数、Agent 工具——底层都是「打包好的一串步骤」。def 就是造这个东西的真写法。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'真 Python 函数 = W2 的「打包」，关键词 <strong>def 名字():</strong>，冒号+缩进那套，喊名用「名字()」。<br><strong>它就是 Agent 工具的真身</strong>——你造工具、AI 写功能，全靠 def。<br>下一关：不用啥都自己写——别人打包好的一大堆工具，import 拿来就用。'}
  }},
  'w3_11':{world:'w3',n:11,a:'36',boss:false,type:'core',optional:false,title:'库与 import',goal:'拿别人的工具来用',xp:100,content:{
    flow:[
      {talk:'① 处境：难道啥都自己从头写？|你想让程序「随机抽个幸运观众」「算个平方根」「处理日期」。这些难道都自己 def？太累了，而且早有人写好了。<br>Python 有个超能力：<strong>把别人写好的一大包工具，直接拿来用。</strong>这包工具叫「库」，拿来用的动作叫 <strong>import</strong>。'},
      {talk:'② 库是啥：别人打包好的工具箱|回收上关「函数=工具」。一个<strong>库</strong>，就是一大堆现成函数打包成的「工具箱」。<br>比如 <code style="background:#eee;padding:2px 8px;border-radius:4px">random</code> 库里全是「随机」相关的工具，<code style="background:#eee;padding:2px 8px;border-radius:4px">datetime</code> 库里全是「日期时间」工具。'},
      {talk:'③ import = 把工具箱搬进来|<code style="background:#eee;padding:2px 8px;border-radius:4px">import random</code> = 「把 random 这个工具箱搬到我手边」。然后就能用里面的工具：<code style="background:#eee;padding:2px 8px;border-radius:4px">random.choice(名单)</code> → 随机抽一个。<br>类比：你不用自己造锤子，去五金店（库）拿一个（import）就能用。'},
      {try:{q:'<code style="background:#eee;padding:2px 8px;border-radius:4px">import random</code> 这行在干啥？',opts:[{t:'把 random 工具箱搬进来，好用里面现成的工具',ok:true},{t:'随机删掉一个文件',ok:false},{t:'定义一个变量',ok:false}],fb:'import = 把某个库（工具箱）搬进来用。import random 之后，random 里一堆现成工具你就能直接使了。'}},
      {talk:'④ 为啥这是超能力|全世界程序员写好的工具箱有几十万个：算数据的、画图的、发网络请求的、连 AI 的……你一个 import 就白嫖别人几年的成果。<br><strong>「不重复造轮子」——这是编程效率的核心。</strong>'},
      {sequence:{ask:'用别人的库（工具箱），要经过这三步。拖成正确顺序：',items:[{id:'import',text:'import 库名（把工具箱搬进来）'},{id:'call',text:'调用库里的工具（比如 random.choice(名单)）'},{id:'result',text:'得到结果（随机抽出的那个人）'}],answer:['import','call','result'],card:'import 流程卡',fb:'先 import 把工具箱搬进来，才能调用里面的工具，然后得到结果。没 import 就直接用，电脑会说「我不认识这工具」——这正是 W4 要讲的一种报错。'}},
      {talk:'⑤ 你会经常在脚本最上头看到它|脚本开头往往一堆 <code style="background:#eee;padding:2px 8px;border-radius:4px">import xxx</code>——那是在「备齐工具」。<br>看到 <code style="background:#eee;padding:2px 8px;border-radius:4px">import 表格库</code>，你就猜到：哦，这脚本要处理表格；<code style="background:#eee;padding:2px 8px;border-radius:4px">import 网络库</code>，它要联网。<strong>看开头的 import，就能猜出这脚本大概要干啥。</strong>'},
      {try:{q:'一个脚本开头写了 <code style="background:#eee;padding:2px 8px;border-radius:4px">import 发邮件的库</code>，你能猜到啥？',opts:[{t:'这脚本多半要发邮件',ok:true},{t:'这脚本要删邮件',ok:false},{t:'没法猜',ok:false}],fb:'开头的 import 是「备工具」。import 了发邮件的库，基本能猜到脚本要发邮件。看 import 猜用途，是快速读脚本的窍门。'}},
      {talk:'⑥ 连回 AI（回收启蒙营 + W2）|还记得「工具是 Agent 的手」「函数=工具」吗？<strong>Agent 的很多工具，就是 import 进来的现成库。</strong><br>你让 AI「写个查天气的脚本」，它八成 <code style="background:#eee;padding:2px 8px;border-radius:4px">import 一个天气库</code>，调人家的工具。你看到 import，就知道：AI 在给这段程序/这个 Agent 配工具。'},
      {try:{q:'拿到一个陌生脚本，最快猜出它「要干啥」的窍门？',opts:[{t:'看开头 import 了哪些库（备了啥工具）',ok:true},{t:'看它总共有多少行',ok:false},{t:'看变量名长不长',ok:false}],fb:'开头 import 是「备工具」——import 表格库多半处理表格、import 网络库多半联网。看 import 猜用途，又快又准。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'库 = 别人打包好的工具箱；<code style="background:#eee;padding:2px 8px;border-radius:4px">import 库名</code> = 搬进来用里面现成的工具（如 <code style="background:#eee;padding:2px 8px;border-radius:4px">random.choice</code>）。<br><strong>不重复造轮子</strong>是效率核心；Agent 的工具很多就是 import 来的。看脚本开头的 import，能猜出它要干啥。<br>下一关：把这些零件拼成一个 .py 文件，一次跑完——脚本自动化。'}
  }},
  'w3_12':{world:'w3',n:12,a:'37',boss:false,type:'core',optional:false,title:'脚本自动化',goal:'把代码存成文件一次跑完',xp:150,content:{
    flow:[
      {talk:'① 处境：零件都会了，怎么真派上用场？|你现在会读变量、if、for、函数、import 了。但这些零散的句子，怎么变成「真能自动干活」的东西？<br>答案：<strong>把它们按顺序写进一个文件，存成 .py，一运行，从头跑到尾。</strong>这就是「脚本」。'},
      {talk:'② 脚本是啥：一串代码存成一个文件|回收 W1！你在黑窗口敲的是「一句句命令」；把一串 Python 代码写进一个 <code style="background:#eee;padding:2px 8px;border-radius:4px">xxx.py</code> 文件，就是一个<strong>脚本</strong>。<br>运行它（双击、或一条命令），电脑从上到下把每行跑一遍。'},
      {talk:'③ 回收 W2 流程排序：脚本就是排好序的一串步骤|还记得 W2 Boss「把步骤排对顺序」吗？脚本就是它的真身。<br>比如「批量重命名」脚本：① import 文件工具 → ② 列出所有文件（for）→ ③ 每个文件 if 符合条件 → ④ 改名。<strong>排好顺序的一串代码，存成文件，一次跑完。</strong>'},
      {try:{q:'一个 .py 脚本，本质上是？',opts:[{t:'一串按顺序排好的代码，存成文件，一运行从头跑到尾',ok:true},{t:'一堆随机堆在一起的代码',ok:false},{t:'一张图片',ok:false}],fb:'脚本 = 排好顺序的一串代码存成文件。回收 W2：关键是「顺序对」。一运行，电脑从上到下挨行跑。'}},
      {talk:'④ 为啥它值钱：一次写好，长期复用|手动整理文件，每次都得点半天。写成脚本存着，以后<strong>双击一下，几百个文件秒整理完</strong>。<br>回收 W2 循环 + W1 批处理——脚本是「把你的重复劳动一次性固化」。'},
      {sequence:{ask:'一个脚本从「写好」到「出结果」，是这样一条流水线。拖成正确顺序（下一关 Boss 的真脚本就长这样）：',items:[{id:'save',text:'把一串代码存成一个 .py 文件'},{id:'run',text:'运行这个脚本'},{id:'input',text:'脚本读取输入数据（比如一个任务列表）'},{id:'process',text:'用 for / if 处理这些数据'},{id:'output',text:'print 输出处理结果'}],answer:['save','run','input','process','output'],card:'脚本流程卡',fb:'脚本 = 存成文件 → 运行 → 读输入 → 处理 → 输出。这条流水线走通了，下一关 Boss 的真脚本就照这个套路读。'}},
      {talk:'⑤ 你会读它 = 你能验收和改它|一个脚本摆你面前，你现在能从上往下读：import（备了啥工具）→ 变量（存了啥）→ for/if（怎么处理）→ 输出。<br><strong>读懂了，你就敢跑、能改、会验收——不用当程序员，一样掌控它。</strong>'},
      {try:{q:'你能「读懂」一个脚本，意味着？',opts:[{t:'你能验收它对不对、敢不敢跑、要不要改',ok:true},{t:'你必须能从零把它写出来',ok:false},{t:'啥也说明不了',ok:false}],fb:'会读=能验收。脚本摆面前，你能看出它干啥、安不安全、哪里要改——这就是操作员掌控代码的方式，不用会从零写。'}},
      {talk:'⑥ 连回 AI（大伏笔：埋向 W7）|你让 AI「写个脚本自动处理 XX」，它给你的就是这么一个 .py。你读懂、验收、让它跑——<strong>这就是 AI 操作员干活的日常</strong>。<br>而把好几个脚本/步骤串成一条「自动流水线」，就是后面 <strong>W7 工作流工场</strong>要玩的——脚本是工作流的一块块砖。'},
      {try:{q:'AI 给你一个 .py 脚本，你作为操作员的正确动作是？',opts:[{t:'从上到下读懂它干啥、判断安不安全，再决定跑不跑',ok:true},{t:'不看，直接双击跑',ok:false},{t:'让另一个 AI 再写一遍',ok:false}],fb:'会读=会验收。读懂 import→变量→for/if→输出，看清它干啥、安不安全，你才敢跑、能改。这就是操作员掌控代码的方式。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'脚本 = 把一串排好序的代码存成 .py 文件，一次跑完（回收 W1 存文件 + W2 流程排序）。<br>它的价值是「固化重复劳动、长期复用」。你会读脚本，就能验收和改 AI 给的代码。<br>下一关是 <strong>Boss</strong>：读懂一段真实的小脚本，毕业！'}
  }},
  'w3_13':{world:'w3',n:13,a:'38',boss:true,type:'core',optional:false,grants:['code-trace-boss'],title:'Boss · 读懂真实小脚本',goal:'逐行读懂一段真脚本',xp:300,achievement:'w3_complete',content:{
    flow:[
      {talk:'① Boss 登场：读懂一段真脚本|花园毕业考不考写，考<strong>读</strong>——给你一段真实小脚本，你逐行看懂它干啥、能预测输出、还能挑出错。读懂了，你就正式会「验收 AI 写的代码」了。'},
      {talk:'② 先看这段脚本（一行行来，别慌）|<code style="background:#eee;padding:2px 6px;border-radius:4px">tasks = ["整理资料", "发送提醒", "检查结果"]</code><br><code style="background:#eee;padding:2px 6px;border-radius:4px">for task in tasks:</code><br><code style="background:#eee;padding:2px 6px;border-radius:4px">　　if task == "检查结果":</code><br><code style="background:#eee;padding:2px 6px;border-radius:4px">　　　　print("需要人工确认")</code><br><code style="background:#eee;padding:2px 6px;border-radius:4px">　　else:</code><br><code style="background:#eee;padding:2px 6px;border-radius:4px">　　　　print("自动执行：" + task)</code><br>回收 W3 学的：列表、for 循环、if/else、print。下面逐行拆。'},
      {talk:'③ 这次不给选项——换你自己追|前面几关是选择题，Boss 这关换你<strong>自己一行行追</strong>：数列表、算循环、看每轮 task 是谁、判断走哪条分支、最后把输出写出来。<br>下面逐格填，填完点「对答案」。填错不要紧，小黑会给提示，但<strong>不会直接报答案</strong>——自己追出来的，才算真会读代码。'},{trace:{ask:'读这段「任务分拣」脚本，逐格追踪它怎么跑：',code:['tasks = ["整理资料", "发送提醒", "检查结果"]','for task in tasks:','    if task == "检查结果":','        print("需要人工确认")','    else:','        print("自动执行：" + task)'],checkpoints:[{ask:'① tasks 这个列表里，一共装了几个任务？',accept:['3','三','3个','三个','3件','三件']},{ask:'② 这个 for 循环一共会重复几次？',accept:['3','三','3次','三次']},{ask:'③ 循环第 2 轮时，task 的值是哪个任务？（填任务名）',accept:['发送提醒'],contains:true},{ask:'④ 三个任务里，哪一个会走进 if、打印「需要人工确认」？',accept:['检查结果'],contains:true}],finalOutput:{ask:'⑤ 整段脚本从上到下，屏幕会按顺序打印哪三行？（大致写出来，顺序别乱）',need:['整理资料','发送提醒','人工确认']},hints:['先别急着算结果：第 1 行方括号里，用逗号隔开了几项？数出来就是列表长度。','循环跑几次，只看列表有几项——跟 if 判断、跟结果都没关系。','for 是挨个拿：第 1 轮 task=整理资料，第 2 轮 task=发送提醒，第 3 轮 task=检查结果。','按列表顺序追：整理资料走 else→自动执行整理资料；发送提醒走 else→自动执行发送提醒；检查结果走 if→需要人工确认。'],card:'代码追踪卡',cardBody:'列表任务数 3 · 循环 3 次 · 第2轮 task=发送提醒 · 「检查结果」走 if · 输出：自动执行整理资料 / 自动执行发送提醒 / 需要人工确认'}},
      {talk:'⑥ 改一个字，结果就变|假设把第 3 行改成 <code>if task == "发送提醒":</code>，其它不动。再想想：现在哪个走 if、哪个走 else？'},
      {try:{q:'把条件改成 <code>task == "发送提醒"</code> 后，输出会怎么变？',opts:[{t:'「发送提醒」那行变成「需要人工确认」；「检查结果」变回「自动执行：检查结果」',ok:true},{t:'完全不变，还是老样子',ok:false},{t:'只有「发送提醒」变，「检查结果」不受影响',ok:false}],fb:'条件换了，走 if 的人就换了：「发送提醒」进 if→打印人工确认；而「检查结果」不再满足条件，落进 else→打印「自动执行：检查结果」。两处都变，别漏了后者。'}},
      {talk:'⑦ 最后一关：挑错|AI 有时会写出跑不起来的代码，你得看得出。看这行：<br><code style="background:#fee;padding:2px 6px;border-radius:4px">print("自动执行：" task)</code><br>它和正确的 <code>print("自动执行：" + task)</code> 差在哪？'},
      {try:{q:'<code>print("自动执行：" task)</code> 为什么跑不起来？',opts:[{t:'少了个 + ——两段文字要用 + 连起来',ok:true},{t:'少了个逗号',ok:false},{t:'少了个引号',ok:false}],fb:'要把「自动执行：」和 task 拼成一句话，中间得用 + 连。少了 +，两段贴一起 Python 看不懂就报错。引号、冒号这行都不缺，缺的就是这个连接符。'}},
      {talk:'⑧ 你刚干的，超值钱|你没写一个字，却<strong>逐行读懂了一段真代码</strong>：数清列表、算准循环、判断分支、预测输出、看懂改动影响、还挑出一个错。<br>这正是 AI 操作员的核心本事——<strong>AI 写，你验收</strong>：它写的对不对、跑不跑得起来，你看得出来了。'}
    ],
    aha:{goal:'🎓 恭喜——Python 花园通关！',text:'<strong>📋 代码阅读结果卡</strong><br>列表任务数：<strong>3</strong><br>循环次数：<strong>3</strong>（看列表长度，不看分支）<br>判断条件：task 等于「检查结果」才走 if<br>人工确认任务：检查结果<br>自动执行任务：整理资料、发送提醒<br>代码主结构：<strong>列表 → 循环 → 条件判断 → 输出</strong><br><br>你拿到了一双「读代码的眼睛」——AI 写的代码你能逐行读懂、预测输出、挑出错。<strong>这就是操作员最硬的本事：不自己写，但掌控得住。</strong><br>🎓 赢得认证：<strong>Python 入门</strong>！<br>下一站「环境工坊」：代码会读了，可它在哪跑、缺啥跑不起来？'}
  }},
  'w4_1':{world:'w4',n:1,a:'39',boss:false,type:'core',optional:false,title:'什么是环境',goal:'搞懂代码为啥跑不起来',xp:100,content:{
    flow:[
      {talk:'① 接上一关：代码会读了，可它在哪跑？|上一关 Boss 你读懂了那个抽奖脚本。但你要真在自己电脑上双击它，很可能「啪」一下报错：找不到 python、或缺了某个它要用的第三方库……<br>为啥读得懂却跑不起来？因为——<strong>代码要「跑」，得先有个「能跑它的地方」。</strong>这地方，就叫「环境」。'},
      {talk:'② 一句话：环境 = 让代码能跑起来的一整套东西|光有代码（一张菜谱）不够。你还得有<strong>厨房</strong>：灶（能执行代码的程序）、锅碗（各种库）、食材摆放规矩（配置）。<br>这一整套「让代码能真正跑起来」的家当，就是环境。'},
      {talk:'③ 菜谱 vs 厨房，想透这个类比|<strong>代码 = 菜谱</strong>：写着步骤，但它自己变不出菜。<br><strong>环境 = 厨房</strong>：有灶有锅有料，菜谱才能变成真菜。<br>同一张菜谱，在设备齐全的厨房能做，在毛坯房就抓瞎——<strong>代码能不能跑，一半看环境。</strong>'},
      {try:{q:'照这个类比，「代码」对应啥？',opts:[{t:'菜谱——写着步骤，但自己变不出菜',ok:true},{t:'厨房',ok:false},{t:'厨师',ok:false}],fb:'代码=菜谱（步骤），环境=厨房（让菜谱变真菜的家当）。手里有菜谱≠有厨房，所以「会读代码」≠「能跑起来」。'}},
      {talk:'④ 环境里都有啥（这一片要挨个学）|接下来几关，把「厨房」的家当一件件认全：<strong>解释器</strong>（灶，执行代码的）、<strong>库</strong>（锅碗，pip 装）、<strong>虚拟环境</strong>（独立小厨房）、<strong>API Key</strong>（钥匙）、<strong>路径</strong>（食材在哪）。<br>你不用会装，但要懂「少了哪样会咋样」。'},
      {sequence:{ask:'一段代码要在新电脑上真正跑起来，「环境」得按合理顺序备齐。拖一拖：',items:[{id:'py',text:'装好 Python 解释器（那口「灶」）'},{id:'lib',text:'用 pip 装上代码要用的库（锅碗）'},{id:'cfg',text:'配好路径 / API Key 等配置（摆好食材）'},{id:'run',text:'这时代码才能真正跑起来'}],answer:['py','lib','cfg','run'],card:'环境组成卡',fb:'先有灶（解释器），才能装锅碗（库），再摆好料（配置），最后开火做菜（跑代码）。少一样，代码都可能跑不起来——「会读代码」不等于「能跑起来」。'}},
      {talk:'⑤ 为啥操作员必须懂环境|你以后干得最多的一件事：让 AI/Agent 或脚本在某台机器上「跑起来」。<strong>十次跑不起来，八次是环境问题</strong>——不是代码错，是缺库、版本不对、Key 没配、路径不对。<br>懂环境，你才能一眼判断「哦，是环境没备好」，而不是干瞪眼。'},
      {try:{q:'脚本 / Agent 部署「跑不起来」，最常见的原因是？',opts:[{t:'环境没配好（缺库、版本不对、Key/路径问题）',ok:true},{t:'一定是代码逻辑错了',ok:false},{t:'网速太慢',ok:false}],fb:'十次跑不起来八次是环境问题——缺库、版本冲突、Key 没配、路径不对。代码本身往往没错。这就是为啥操作员必须懂环境。'}},
      {talk:'⑥ 这一片「环境工坊」带你干啥|一句话：W3 教你「读代码」，W4 教你「让代码真能跑」。<br>把环境的各个部件认全，以后脚本一跑不起来，你能判断是缺了哪样、该补啥——而不是一句「它坏了」就卡死。'},
      {try:{q:'「环境工坊」这一片主要教你啥？',opts:[{t:'认全「让代码跑起来」需要的环境家当，懂缺啥会咋样',ok:true},{t:'教你写更多代码',ok:false},{t:'教你修电脑硬件',ok:false}],fb:'W3 教「读代码」，W4 教「让代码真能跑」——认全环境部件，脚本跑不起来时你能判断缺了啥。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'环境 = 让代码能跑起来的一整套家当（解释器+库+配置），好比让菜谱变成菜的「厨房」。<br><strong>代码会读还不够，环境备好了才跑得起来</strong>；而部署跑不起来，八成是环境问题。<br>下一关：厨房里最重要的那口「灶」——Python 解释器。'}
  }},
  'w4_2':{world:'w4',n:2,a:'40',boss:false,type:'core',optional:false,title:'Python 解释器',goal:'搞懂谁在执行代码',xp:100,content:{
    flow:[
      {talk:'① 接上一关：厨房里最重要的那口灶|环境里第一件、也最核心的家当：能「执行代码」的东西。<br>Python 代码得靠它才能跑——它叫 <strong>Python 解释器</strong>。'},
      {talk:'② 电脑其实不直接懂 Python|你写的 <code style="background:#eee;padding:2px 8px;border-radius:4px">print("你好")</code> 是「人话式」文本，可电脑的 CPU 只懂 0 和 1。<br>中间得有个「翻译官」，把 Python 一句句翻成电脑能执行的动作——这翻译官，就是<strong>解释器</strong>。'},
      {talk:'③ 「装 Python」装的就是它|你听人说「电脑要先装 Python」——装的其实就是这个解释器。<br>装好了，电脑才有了「能读懂并执行 Python」的能力。没装？那 .py 文件双击就报「找不到 python」。'},
      {try:{q:'「装 Python」本质上是在装啥？',opts:[{t:'Python 解释器——那个把代码翻译执行的翻译官',ok:true},{t:'一个聊天软件',ok:false},{t:'一堆图片素材',ok:false}],fb:'装 Python = 装解释器。有了它，电脑才能读懂并执行 .py。没装，双击脚本就报「找不到 python」。'}},
      {talk:'④ 怎么让它跑一个脚本（回收 W1 敲命令）|在终端敲 <code style="background:#eee;padding:2px 8px;border-radius:4px">python 抽奖.py</code> = 「叫 Python 解释器，来翻译执行『抽奖.py』这个脚本」。<br><code style="background:#eee;padding:2px 8px;border-radius:4px">python</code> 是喊解释器，后面跟要跑的文件名。'},
      {try:{q:'<code style="background:#eee;padding:2px 8px;border-radius:4px">python 抽奖.py</code> 这条命令在干啥？',opts:[{t:'叫解释器来执行「抽奖.py」这个脚本',ok:true},{t:'安装 python',ok:false},{t:'删除抽奖.py',ok:false}],fb:'python = 喊解释器，后面是要跑的脚本文件。这条就是「让 Python 把抽奖.py 跑一遍」。'}},
      {cmd:{ask:'想「让 Python 跑抽奖.py 这个脚本」，在终端敲哪条？',blocks:['python 抽奖.py','py 抽奖','run 抽奖.py'],answer:'python 抽奖.py',result:'恭喜 小红',note:'← python + 脚本文件名 = 让解释器执行这个脚本。它跑完抽奖脚本，抽中了小红。',hints:['喊解释器用 python，后面跟脚本文件名（带 .py）。','就是 python 空格 抽奖.py。','答案：python 抽奖.py。']}},
      {talk:'⑤ 回收 W3：你写的都是交给它执行的|你 W3 学的 print、for、if……全都是写给解释器看的「指令」。<br>解释器从上到下，一句句翻译执行。<strong>脚本能跑，前提是先有解释器。</strong>'},
      {talk:'⑥ 连回 AI|你部署 AI 工具/脚本的第一步，几乎都是「先装 Python」。<br><strong>看到教程让你装 Python，你现在知道：那是在给电脑装能执行代码的那口「灶」。</strong>'},
      {sequence:{ask:'一个 .py 脚本从「文件」到「出结果」，中间怎么走？把这条链排好：',items:[{id:'file',text:'代码文件（抽奖.py，一段人话式文本）'},{id:'interp',text:'Python 解释器接手（翻译官）'},{id:'exec',text:'翻成电脑能懂的动作、一句句执行'},{id:'out',text:'屏幕打印出结果'}],answer:['file','interp','exec','out'],card:'解释执行流程卡',fb:'代码文件是人话，电脑只懂 0101，中间靠解释器翻译执行、最后输出。缺了解释器这一环，.py 双击就报「找不到 python」。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'Python 解释器 = 把 Python 代码翻译成电脑能执行的动作的「翻译官/灶」；「装 Python」装的就是它；<code style="background:#eee;padding:2px 8px;border-radius:4px">python 脚本.py</code> 让它跑一个脚本。没它，代码一步都跑不了。<br>下一关：回收 W3 的 import——想用别人的库，得先用 pip 把库装进来。'}
  }},
  'w4_3':{world:'w4',n:3,a:'41',boss:false,type:'core',optional:false,title:'pip 装库',goal:'把缺的库装上',xp:100,content:{
    flow:[
      {talk:'① 接上一关：回收 W3 的 import|还记得 W3 的 <code style="background:#eee;padding:2px 8px;border-radius:4px">import requests</code>（搬来一个网络库）吗？你满心欢喜 import，结果报错：「没有 requests」。<br>为啥？<strong>因为你电脑上根本没装这个库。</strong>'},
      {talk:'② import 的前提：库得先装在电脑上|import 是「从工具箱拿工具」，但工具箱里得先有那件工具。<br><strong>装库，用 pip。</strong>pip 是 Python 自带的「安装器/进货员」。'},
      {talk:'③ pip = Python 的应用商店|<code style="background:#eee;padding:2px 8px;border-radius:4px">pip install requests</code> = 「从网上下载安装 requests 这个库」。<br>就像手机装 App：应用商店（pip）点一下，App（库）就下到手机（电脑）上了，之后随便用（import）。'},
      {locate:{ask:'跑脚本报了下面这段错。用「小黑四步排错法」一步步定位（发生了什么→在哪里→啥原因→下一步）：',text:['Traceback (most recent call last):','  File "抽奖.py", line 3, in <module>','    import requests',"ModuleNotFoundError: No module named 'requests'"],steps:[{q:'① 发生了什么？点出这段报错的「错误类型」：',type:'pick',answer:'ModuleNotFoundError',pool:['ModuleNotFoundError','requests','抽奖.py','line 3'],fb:'错误类型是那个 Error 结尾的词——ModuleNotFoundError。'},{q:'② 缺的是哪个模块？点出「模块名」：',type:'pick',answer:'requests',pool:['requests','抽奖.py','import','ModuleNotFoundError'],fb:'No module named 后面引号里的，就是缺的模块——requests。'},{q:'③ 可能是什么原因？属于哪一层问题？',type:'choice',options:[{t:'依赖层——这个库还没装',ok:true},{t:'代码逻辑写错了',ok:false},{t:'网络断了',ok:false}],fb:'ModuleNotFoundError = 缺库，属于「依赖」这一层，不是代码逻辑或网络。'},{q:'④ 下一步该做什么？',type:'choice',options:[{t:'python -m pip install requests 把库装上',ok:true},{t:'重装 Python',ok:false},{t:'把 import requests 删掉',ok:false}],fb:'缺依赖就装依赖：pip install requests。重装 Python、删 import 都不解决问题。'}],card:'排错报告',cardBody:'现象：ModuleNotFoundError ｜ 位置：抽奖.py 第3行 import requests ｜ 类型：缺模块 ｜ 故障层：依赖 ｜ 原因：requests 没装 ｜ 下一步：pip install requests ｜ 验证：装完重跑，不再报这个错。'}},
      {talk:'④ 装它：pip install（回收 W1 敲命令）|终端敲 <code style="background:#eee;padding:2px 8px;border-radius:4px">pip install requests</code>，pip 就去网上把 requests 下载装好。<br>装一次，以后这台电脑都能 import 它。'},
      {cmd:{ask:'想装上「requests」这个库，在终端敲哪条？',blocks:['pip install requests','import requests','pip requests'],answer:'pip install requests',result:'成功安装 requests-2.31.0',note:'← pip install + 库名 = 从网上下载安装这个库。装好后，代码里 import requests 就不报错了。',hints:['装库用 pip install，后面跟库名。','import 是「用」，pip install 才是「装」。','答案：pip install requests。']}},
      {talk:'⑤ 分清：pip install（装）vs import（用）|<strong>pip install requests</strong> = 进货（装到电脑上，做一次）。<br><strong>import requests</strong> = 从货架取用（在代码里，每次要用都写）。<br>先进货、再取用。顺序反了、或没进货就取，准报错。'},
      {try:{q:'pip install 和 import 的区别是？',opts:[{t:'pip install 把库装到电脑（一次）；import 在代码里取用（每次）',ok:true},{t:'完全一样',ok:false},{t:'import 才是安装',ok:false}],fb:'pip install=进货（装电脑上，一次就够）；import=取货（代码里用，每次写）。先装后用，别搞反。'}},
      {talk:'⑥ 连回 AI（超高频）|你跑 AI 给的脚本，最常见的报错就是 <code style="background:#eee;padding:2px 8px;border-radius:4px">No module named xxx</code>——翻成人话：「缺 xxx 这个库」。<br><strong>解决办法几乎永远是：pip install xxx。</strong>记住这条，你能自己搞定一大半「跑不起来」。'},
      {try:{q:'跑 AI 脚本报「No module named pandas」，你该？',opts:[{t:'pip install pandas，把缺的库装上',ok:true},{t:'重装电脑',ok:false},{t:'把报错这行代码删了',ok:false}],fb:'「No module named xxx」=缺 xxx 库。pip install xxx 装上就好——这是最高频的「跑不起来」解法。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'pip = Python 的应用商店；<code style="background:#eee;padding:2px 8px;border-radius:4px">pip install 库名</code> 把库装到电脑（进货，做一次），<code style="background:#eee;padding:2px 8px;border-radius:4px">import 库名</code> 在代码里取用（每次）。<br>看到 <code style="background:#eee;padding:2px 8px;border-radius:4px">No module named xxx</code> 一般是缺库——但别急着盲装陌生包：先确认虚拟环境、看项目依赖清单（<code style="background:#eee;padding:2px 8px;border-radius:4px">python -m pip install -r requirements.txt</code>），单个再 <code style="background:#eee;padding:2px 8px;border-radius:4px">python -m pip install requests</code>（注意：导入名不一定等于安装包名）。<br>下一关：装库会打架——虚拟环境给每个项目一个独立小房间。'}
  }},
  'w4_4':{world:'w4',n:4,a:'42',boss:false,type:'core',optional:false,title:'虚拟环境',goal:'给项目隔离库空间',xp:100,content:{
    flow:[
      {talk:'① 接上一关：装库，会打架|你手头俩项目：项目 A 要 requests 老版本，项目 B 要新版本。<br>你 pip install 装了一个，另一个就用不了了——<strong>它俩在抢同一套库，打架。</strong>'},
      {talk:'② 解决：给每个项目一个「独立小房间」|与其所有项目共用一套库，不如<strong>每个项目单独一个房间，各装各的库、各用各的版本，互不干扰</strong>。<br>这个「独立小房间」，就叫<strong>虚拟环境</strong>。'},
      {talk:'③ 类比：合租 vs 独立厨房|所有项目共用系统那套库 = 合租共用一个厨房，张三放的料李四乱动，打架。<br>虚拟环境 = 每个项目一间独立厨房，自己的料自己管。<strong>互不影响，想拆哪个拆哪个。</strong>'},
      {try:{q:'虚拟环境是用来干啥的？',opts:[{t:'给每个项目独立的库空间，互不干扰、不打架',ok:true},{t:'让电脑跑得更快',ok:false},{t:'安装 Python 本身',ok:false}],fb:'虚拟环境=给每个项目一个「独立小厨房」，各装各的库各用各的版本。这样 A 项目 B 项目的库不会互相打架。'}},
      {talk:'④ 你会看到它长这样|建了虚拟环境后，项目文件夹里会多出个 <code style="background:#eee;padding:2px 8px;border-radius:4px">venv</code>（或 <code style="background:#eee;padding:2px 8px;border-radius:4px">.venv</code>）文件夹——那就是这个项目的「独立小房间」，里面装着它专用的 Python 和库。<br>你不用会建，但<strong>看到 venv，就知道：哦，这个项目做了环境隔离。</strong>'},
      {try:{q:'看到一个项目文件夹里有个 <code style="background:#eee;padding:2px 8px;border-radius:4px">venv</code> 文件夹，说明？',opts:[{t:'这个项目建了虚拟环境，做了库隔离',ok:true},{t:'这个项目坏了',ok:false},{t:'venv 是病毒',ok:false}],fb:'venv/.venv 是虚拟环境文件夹，装着这个项目专用的 Python 和库。看到它，就知道项目做了环境隔离——很规范的做法。'}},
      {talk:'⑤ 为啥这几乎是标配|但凡正经点的 Python 项目、Agent 项目，第一步基本都是「建个虚拟环境」。<strong>免得把系统搞乱、免得项目之间打架。</strong><br>这就像装修先分好房间，别一锅烩。'},
      {try:{q:'为啥正经项目一般都先建虚拟环境？',opts:[{t:'隔离库、免得项目间打架和污染系统',ok:true},{t:'纯粹为了显得专业',ok:false},{t:'强制要求，没得选',ok:false}],fb:'隔离——每个项目自己一套库，互不干扰，也不污染系统。这是省心省事的规范做法，不是花架子。'}},
      {talk:'⑥ 连回 AI|你部署一个 Agent 项目，教程往往让你先「建虚拟环境 + 激活 + pip install」。<br><strong>现在你懂了：那是在给这个 Agent 圈一块干净地盘，装它专用的库。</strong>'},
      {sequence:{ask:'给一个新项目用虚拟环境，正确顺序是？拖一拖：',items:[{id:'create',text:'建虚拟环境（在项目文件夹里生成 venv）'},{id:'activate',text:'激活它（进这个项目的「独立小房间」）'},{id:'install',text:'在里面 pip install 装这个项目要的库'},{id:'run',text:'运行脚本（用的就是这个房间里的库）'}],answer:['create','activate','install','run'],card:'虚拟环境流程卡',fb:'先建房间（create）、再进屋（activate）、屋里备料（install）、最后开工（run）。没激活就装，库会装到外面全局去——白忙活。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'虚拟环境 = 给每个项目一个独立的库空间（那个 <code style="background:#eee;padding:2px 8px;border-radius:4px">venv</code> 文件夹），各装各的、互不打架，好比每个项目一间独立厨房。正经项目 / Agent 部署几乎都先建它。<br>下一关：让 Agent 调用 AI，得给它一把「钥匙」——API Key，而且它得藏好。'}
  }},
  'w4_5':{world:'w4',n:5,a:'43',boss:false,type:'core',optional:false,title:'环境变量 / API Key',goal:'搞懂钥匙藏哪',xp:100,content:{
    flow:[
      {talk:'① 处境：让 Agent 调 AI，得给它一把「钥匙」|你想让自己的脚本/Agent 去调用 GPT、调某个服务，人家不会白给你用——你得出示一把「身份钥匙」，证明是你、也好计费。<br>这把钥匙，就叫 <strong>API Key</strong>（一长串字母数字）。'},
      {talk:'② 关键问题：钥匙不能直接写进代码里|新手最容易犯的错：把 API Key 直接写在代码里 <code style="background:#eee;padding:2px 8px;border-radius:4px">key = "sk-abc123..."</code>。<br>危险！代码一旦发给别人、传上网（比如 GitHub），<strong>钥匙就泄露了——别人能拿你的钥匙花你的钱。</strong>'},
      {try:{q:'为啥不能把 API Key 直接写死在代码里？',opts:[{t:'代码一旦外传，钥匙就泄露，别人能拿它花你的钱',ok:true},{t:'写代码里会让程序变慢',ok:false},{t:'代码里放不下这么长的钥匙',ok:false}],fb:'API Key = 钱 + 权限。写死在代码里，代码一外传（发人、传 GitHub）钥匙就漏了，别人白嫖你的额度。回收启蒙营讲的隐私——这就是活生生的例子。'}},
      {talk:'③ 正确姿势：放进「环境变量」|把钥匙存在<strong>环境里</strong>（不是代码里），代码用的时候去环境里「取」。这种存在环境里的「秘密配置」，就叫<strong>环境变量</strong>。<br>类比：家门钥匙不刻在门板上（代码），揣你兜里（环境），要用时掏出来。'},
      {talk:'④ 代码里长这样：去环境里取，而不是写死|坏写法：<code style="background:#eee;padding:2px 8px;border-radius:4px">key = "sk-abc123"</code>（写死，会泄露）。<br>好写法：<code style="background:#eee;padding:2px 8px;border-radius:4px">key = 从环境变量读取("OPENAI_KEY")</code>（代码里不见真钥匙，只去环境里取）。<br>这样代码可以随便给人看，钥匙始终不在代码里。'},
      {try:{q:'把 API Key 放进「环境变量」的好处是？',opts:[{t:'代码里不出现真钥匙，代码能安全外传，钥匙留在环境里',ok:true},{t:'钥匙会变短',ok:false},{t:'程序跑得更快',ok:false}],fb:'环境变量把「秘密」和「代码」分开：代码只写「去环境取钥匙」，真钥匙留在环境里。这样代码能安全分享，钥匙不外泄。'}},
      {talk:'⑤ 环境变量不只放钥匙|除了 API Key，一些「换台机器就可能不同」的配置也放环境变量：数据库地址、运行模式（测试/正式）等。<br>共同点：<strong>不写死在代码里，交给环境来给</strong>——换环境改配置，不用动代码。'},
      {sequence:{ask:'让脚本安全地用 API Key 去调 AI，正确的数据流是？拖一拖：',items:[{id:'store',text:'把 Key 存进环境变量（不写进代码）'},{id:'read',text:'代码运行时从环境变量把 Key 读出来'},{id:'check',text:'检查 Key 读到了没、对不对'},{id:'call',text:'带上 Key 去调用 AI 接口'}],answer:['store','read','check','call'],card:'API Key 数据流卡',fb:'先把 Key 存环境变量（不进代码），运行时读出来、检查一下，再带它调接口。Key 始终不出现在代码里——代码才能安全分享。'}},
      {talk:'⑥ 连回 AI|你在用各种 AI 工具、配 Agent 时，界面上让你填的那个「API Key」输入框，填进去后，程序多半就把它存进了环境变量。<br><strong>现在你懂了：那一步是在给 Agent 递钥匙，而且是安全地递——不写进代码。</strong>'},
      {try:{q:'你在某 AI 工具界面填了 API Key，程序把它存哪最稳妥？',opts:[{t:'存进环境变量，代码去取、不写死进代码',ok:true},{t:'直接贴进代码文件里',ok:false},{t:'发到群里当备份',ok:false}],fb:'存环境变量——代码去取、不外泄。写死进代码、或到处发，等于把钥匙（=钱）往外撒。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'API Key = 调用 AI/服务的「身份钥匙」（= 钱 + 权限），<strong>绝不能写死在代码里</strong>（会泄露）。正确做法：存进<strong>环境变量</strong>，代码去环境里取。配置和代码分家，代码才能安全分享。<br>下一关：脚本老报「找不到文件」——问题多半出在「路径」上（回收 W1 的「我在哪」）。'}
  }},
  'w4_6':{world:'w4',n:6,a:'44',boss:false,type:'core',optional:false,title:'文件与路径',goal:'让脚本找得到文件',xp:100,content:{
    flow:[
      {talk:'① 处境：脚本报「找不到文件」|你的脚本要读「账单.txt」，结果报错 <code style="background:#eee;padding:2px 8px;border-radius:4px">FileNotFoundError</code>（找不到文件）。<br>文件明明就在电脑里啊？——问题是：<strong>脚本不知道它在哪。</strong>这就要说「路径」。'},
      {talk:'② 路径 = 文件的「门牌地址」（回收 W1！）|还记得黑窗口村的 Get-Location（我在哪）、Set-Location（进文件夹）吗？那时候你就在跟「路径」打交道。<br><strong>路径，就是告诉电脑「这个文件住在哪条街哪个门牌」。</strong>'},
      {talk:'③ 两种路径：绝对 vs 相对|<strong>绝对路径</strong>：从盘符一路写全，如 <code style="background:#eee;padding:2px 8px;border-radius:4px">C:\\村庄\\账单.txt</code>——像写完整地址「XX省XX市XX路8号」，在哪都找得到。<br><strong>相对路径</strong>：相对「我现在在哪」来说，如 <code style="background:#eee;padding:2px 8px;border-radius:4px">账单.txt</code>（就在当前文件夹）——像说「隔壁那间」，得先知道你站哪。'},
      {try:{q:'<code style="background:#eee;padding:2px 8px;border-radius:4px">C:\\村庄\\账单.txt</code> 是哪种路径？',opts:[{t:'绝对路径——从盘符写全，在哪都找得到',ok:true},{t:'相对路径',ok:false},{t:'这不是路径',ok:false}],fb:'从盘符 C: 一路写全的是绝对路径（完整门牌）。只写「账单.txt」这种相对当前位置的，才是相对路径。'}},
      {talk:'④ 为啥老「找不到文件」|多半是：脚本以为文件在 A 处（相对路径按「当前位置」找），可你人在 B 处运行它，或文件其实在 C 处。<strong>「当前在哪」和「文件在哪」对不上，就找不到。</strong><br>回收 W1：先搞清「我在哪」（Get-Location），才知道相对路径从哪算起。'},
      {locate:{ask:'脚本报了下面这段错。用四步排错法定位（发生了什么→在哪里→啥原因→下一步）：',text:['Traceback (most recent call last):','  File "记账.py", line 4, in <module>','    f = open("账单.txt")',"FileNotFoundError: [Errno 2] No such file or directory: '账单.txt'"],steps:[{q:'① 错误类型是哪个？点出来：',type:'pick',answer:'FileNotFoundError',pool:['FileNotFoundError','账单.txt','记账.py','line 4'],fb:'Error 结尾的那个——FileNotFoundError（找不到文件）。'},{q:'② 找不到的是哪个文件？点出「文件名」：',type:'pick',answer:'账单.txt',pool:['账单.txt','记账.py','open','line 4'],fb:'No such file 后面那个就是找不到的文件——账单.txt。'},{q:'③ 这属于哪一层问题？',type:'choice',options:[{t:'路径层——文件路径/当前位置对不上',ok:true},{t:'依赖层——缺库',ok:false},{t:'权限层——没授权',ok:false}],fb:'找不到文件是「路径」问题（回收 W1 的「我在哪」），不是缺库、也不是权限。'},{q:'④ 下一步最该查什么？',type:'choice',options:[{t:'查脚本运行时「当前在哪」+文件真实路径，对不上就用绝对路径',ok:true},{t:'重装 Python',ok:false},{t:'把这行 open 删掉',ok:false}],fb:'先搞清「当前位置」和「文件位置」对没对上（回收 W1 Get-Location）。拿不准就把路径写全（绝对路径）。'}],card:'排错报告',cardBody:'现象：FileNotFoundError ｜ 位置：记账.py 第4行 open("账单.txt") ｜ 类型：找不到文件 ｜ 故障层：路径 ｜ 原因：当前位置和文件位置对不上 ｜ 下一步：查当前目录+改用绝对路径 ｜ 验证：重跑不再报错。'}},
      {talk:'⑤ 小白最稳的做法|拿不准时，<strong>用绝对路径</strong>（写全地址），最不容易出错——虽然啰嗦，但在哪跑都找得到。<br>你不用记规则，遇到「找不到文件」，先怀疑路径、把地址写全试试。'},
      {try:{q:'拿不准文件路径时，最稳的办法是？',opts:[{t:'用绝对路径（把完整地址写全）',ok:true},{t:'随便写，碰运气',ok:false},{t:'把文件名改短',ok:false}],fb:'绝对路径=完整门牌，在哪跑都找得到，最不容易出错。相对路径省事但依赖「当前在哪」，新手容易踩坑。'}},
      {talk:'⑥ 连回 AI|AI 给你的脚本报 <code style="background:#eee;padding:2px 8px;border-radius:4px">FileNotFoundError</code> / 「file not found」，十有八九是路径没对上——不是代码逻辑错。<br><strong>你现在能一眼判断：哦，是文件地址的问题，把路径理清就好。</strong>'},
      {try:{q:'相对路径 <code style="background:#eee;padding:2px 8px;border-radius:4px">账单.txt</code> 能不能找到文件，取决于？',opts:[{t:'你运行脚本时「当前在哪个文件夹」',ok:true},{t:'文件有多大',ok:false},{t:'文件名有多长',ok:false}],fb:'相对路径相对「当前位置」算。你人在别的文件夹跑它，就找不到。拿不准就用绝对路径（写全地址）。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'路径 = 文件的「门牌地址」（回收 W1 的我在哪/进文件夹）。<strong>绝对路径</strong>写全、在哪都找得到；<strong>相对路径</strong>依赖「当前在哪」。脚本报「找不到文件」，先查路径，拿不准就用绝对路径。<br>下一关：为啥你这能跑、发给别人就跑不了？——环境不一致。'}
  }},
  'w4_7':{world:'w4',n:7,a:'45',boss:false,type:'core',optional:false,title:'我这能跑，你那不行',goal:'理解环境差异',xp:100,content:{
    flow:[
      {talk:'① 处境：编程界最经典的甩锅现场|你写的脚本，在自己电脑跑得好好的。兴冲冲发给同事——他一跑，报错。<br>他说「你这代码有问题」，你说「我这明明能跑」。<strong>谁都没撒谎，但就是跑不起来。</strong>为啥？'},
      {talk:'② 真相：两台电脑的「环境」不一样|代码一样，但你俩的<strong>厨房不一样</strong>：你装了库他没装、你 Python 是新版他是旧版、你有 API Key 他没配、文件路径也不同……<br><strong>代码没变，环境变了，结果就跑不了。</strong>'},
      {try:{q:'「我这能跑、你那不行」，根子上是啥问题？',opts:[{t:'两台电脑的环境不一样（库/版本/Key/路径有差异）',ok:true},{t:'一定是对方电脑坏了',ok:false},{t:'代码会自己变坏',ok:false}],fb:'代码是同一份，变的是环境——他缺库、或版本不同、或没配 Key、或路径不对。这四样，正是你前几关学的环境差异点。'}},
      {talk:'③ 回收前几关：差异就藏在这几处|想想你这一片学的：<strong>库装没装（pip）、Python 版本对不对、虚拟环境隔没隔离、API Key 配没配、文件路径一不一样</strong>。<br>两台机器只要这几处有一处不同，就可能「你能跑我不行」。'},
      {sequence:{ask:'「我这能跑你那不行」，按什么顺序对比两台电脑的环境？把检查顺序拖对：',items:[{id:'py',text:'先比 Python 版本一不一样'},{id:'lib',text:'再比库装没装、版本一不一样'},{id:'key',text:'看 API Key 等配置配没配'},{id:'path',text:'最后比文件路径/工作目录对不对'}],answer:['py','lib','key','path'],card:'环境差异检查表',fb:'从「灶」到「料」一层层比：Python 版本→库→Key→路径。哪一处不同，就可能「你能跑我不行」。这四处正是这一片学的环境差异点。'}},
      {talk:'④ 解决思路：把环境也「说明白、对齐」|既然差异在环境，那就<strong>把环境也交代清楚</strong>：需要哪些库、什么版本、要配哪些 Key——写成一份「环境清单」，对方照着备一遍，就能跑。<br>（正经项目会用一个 <code style="background:#eee;padding:2px 8px;border-radius:4px">requirements.txt</code> 文件列出所有要装的库，你不用会写，知道「它是环境清单」就行。）'},
      {try:{q:'要让脚本在别人电脑也能跑，正确思路是？',opts:[{t:'把需要的环境（库/版本/Key）说清楚，让对方对齐',ok:true},{t:'让对方别用他的电脑',ok:false},{t:'把代码改乱',ok:false}],fb:'代码是好的，差的是环境。把「要装什么库、什么版本、配什么 Key」交代清楚，对方照着备好环境，就能跑。对齐环境，是解决「你能跑我不行」的正路。'}},
      {talk:'⑤ 这就是为啥部署这么讲究|你以后部署 AI 工具/Agent，教程为啥那么啰嗦地列「装这个、装那个、配这个」？<strong>就是在帮你把环境对齐</strong>，免得「作者能跑你不行」。<br>照着环境清单一步步来，就是在复刻作者的厨房。'},
      {talk:'⑥ 连回 AI|AI 帮你写的脚本、给你的部署教程，本质都在解决同一件事：<strong>让代码在「你的环境」里也能跑</strong>。你懂了环境差异，就能看明白每一步在补哪块环境，出问题也知道往哪查。'},
      {try:{q:'同一份代码，作者能跑、你跑不了，最该做的是？',opts:[{t:'对齐环境——照作者说明把库/版本装齐、Key 配好',ok:true},{t:'断定作者在骗人',ok:false},{t:'把代码删了自己重写',ok:false}],fb:'代码没问题，是你俩环境不同。照环境清单把库/版本/Key/路径对齐，就能跑。这就是部署的正路。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'「我这能跑你那不行」= 代码一样、<strong>环境不一样</strong>（库/版本/虚拟环境/Key/路径的差异）。解决靠<strong>把环境说明白、对齐</strong>（如 requirements.txt 列清单）。这就是部署为啥讲究。<br>下一关是 <strong>Boss</strong>：在一台新电脑上，按正确顺序把运行环境备齐！'}
  }},
  'w4_8':{world:'w4',n:8,a:'46',boss:true,type:'core',optional:false,title:'Boss · 备好运行环境',goal:'按报错把环境查好',xp:300,achievement:'w4_complete',content:{
    flow:[
      {talk:'① Boss 登场：脚本报错了，你来排查|环境工坊的毕业考——不背概念，实战排错。你把 W3 那个脚本拿到一台新电脑上跑，一敲回车，蹦出一段红字。别慌，操作员的功夫就是<strong>看懂报错、按顺序查</strong>。'},
      {talk:'② 先读完整报错（第一步永远是读完它）|<code style="background:#fee;padding:2px 6px;border-radius:4px">ModuleNotFoundError: No module named &#39;requests&#39;</code><br>别一看红字就慌。<strong>先把这行读完</strong>——它已经把问题说清楚了：找不到一个叫 requests 的模块（库）。'},
      {locate:{ask:'把 W3 那个脚本拿到新电脑上一跑，蹦出这段完整报错。用四步排错法逐项定位：',text:['Traceback (most recent call last):','  File "抽奖.py", line 5, in <module>','    data = pd.read_csv("名单.csv")','  File "抽奖.py", line 2, in <module>','    import pandas as pd',"ModuleNotFoundError: No module named 'pandas'"],steps:[{q:'① 发生了什么？点出「错误类型」：',type:'pick',answer:'ModuleNotFoundError',pool:['ModuleNotFoundError','pandas','抽奖.py','line 5'],fb:'Error 结尾的词——ModuleNotFoundError。'},{q:'② 缺的「关键对象」（模块）是哪个？点出来：',type:'pick',answer:'pandas',pool:['pandas','抽奖.py','read_csv','名单.csv'],fb:'No module named 后面引号里的——pandas。'},{q:'③ 出错的是哪个文件？点出「文件名」：',type:'pick',answer:'抽奖.py',pool:['抽奖.py','名单.csv','pandas','import'],fb:'File 后面引号里的文件名——抽奖.py。'},{q:'④ 这属于哪一层问题（故障层）？',type:'choice',options:[{t:'依赖层——pandas 这个库没装（或跑错环境）',ok:true},{t:'路径层——文件找不到',ok:false},{t:'权限层——没授权',ok:false}],fb:'ModuleNotFoundError=缺库，依赖层。真正卡住的是 import pandas 这行。'},{q:'⑤ 下一步该做什么？',type:'choice',options:[{t:'先确认当前 Python 环境，再 python -m pip install pandas',ok:true},{t:'直接把 Python 卸了重装',ok:false},{t:'关机重启，等库自己出现',ok:false}],fb:'先定位环境再装库：python -m pip install pandas。重装 Python、关机都没用。'}],card:'排错报告',cardBody:'现象：ModuleNotFoundError ｜ 位置：抽奖.py 第2行 import pandas ｜ 错误类型：缺模块 ｜ 关键对象：pandas ｜ 故障层：依赖 ｜ 可能原因：pandas 没装或跑错环境 ｜ 下一步：确认环境+pip install pandas ｜ 修复验证：重跑，ModuleNotFoundError 消失。'}},
      {talk:'③ 判断完类型，第一步查什么|缺库？先别急着装。<strong>先搞清你现在用的是哪个 Python 环境</strong>，再看这个环境装没装 requests。很多「明明装了还报错」，都是装到了 A 环境、跑的是 B 环境。'},
      {try:{q:'确认是缺库后，正确的第一步是？',opts:[{t:'先确认当前用哪个 Python 环境，再看它装没装这个库',ok:true},{t:'直接把整个 Python 卸了重装一遍',ok:false},{t:'随便找个终端就敲安装命令',ok:false}],fb:'先定位环境，再对症下药。重装整个 Python 是把小事搞大；随便找终端装，很可能又装错环境——「装了还报错」就是这么来的。'}},
      {talk:'④ 对症修复|确认了环境、也确认缺 requests，就在<strong>这个环境里</strong>装上它：<br><code style="background:#eee;padding:2px 6px;border-radius:4px">python -m pip install requests</code><br>用 python -m pip，能保证装到「当前这个 python」对应的库里，不装串。'},
      {sequence:{ask:'把「小黑四步排错法」的完整排查步骤按正确顺序排好——这就是你毕业带走的排错习惯：',items:[{id:'read',text:'① 读完整报错原文（别一看红字就慌）'},{id:'type',text:'② 判断错误类型（缺库/路径/权限/版本）'},{id:'where',text:'③ 查对应位置（缺库→先确认是哪个环境）'},{id:'fix',text:'④ 做最小范围修复（pip install，别重装全部）'},{id:'verify',text:'⑤ 重跑验证（原报错消失才算好）'}],answer:['read','type','where','fix','verify'],card:'排错步骤卡',fb:'读报错→判类型→查位置→最小修复→重跑验证。这套顺序走下来，遇到任何报错都不慌——这就是操作员的排错功夫。'}},
      {talk:'⑤ 修完必须验证|装完别以为就完事。<strong>重新跑一遍原脚本</strong>：原来的红字消失 = 这个问题解决了；如果又蹦出新报错，那是<strong>下一个</strong>问题，同样方法再来一轮。'},
      {try:{q:'怎么算「这个报错真的修好了」？',opts:[{t:'重跑原脚本，原来那条 ModuleNotFoundError 不再出现',ok:true},{t:'装库时没报错，就默认脚本也好了',ok:false},{t:'感觉应该好了，不用再跑',ok:false}],fb:'判断标准只有一个：重跑，原报错消失。装库成功 ≠ 脚本能跑（可能还缺别的）。验证永远靠「再跑一遍看结果」。'}},
      {talk:'⑥ 再认一个常见报错|顺手记一个：<code style="background:#fee;padding:2px 6px;border-radius:4px">401 Unauthorized</code>，它跟缺库是两码事——'},
      {try:{q:'<code>401 Unauthorized</code> 更可能是什么问题？',opts:[{t:'登录、Token、API Key 或权限不对',ok:true},{t:'服务器暂时繁忙，等会儿再试',ok:false},{t:'请求的网址写错、页面找不到',ok:false}],fb:'401 = 「没授权」，是 Key/Token/登录/权限的事。它跟「服务器繁忙」(等会重试)、「网址写错找不到页」(404) 是不同类型的错——认得类型，才知道往哪个方向查。'}},
      {talk:'⑦ 你毕业了：手里有了排错习惯|你没背任何东西，但走了一遍真实排错：<strong>读完报错 → 判断类型 → 查对应位置 → 最小修复 → 重跑验证</strong>。以后 AI/脚本报错，你不再干瞪眼——你知道从哪下手。'}
    ],
    aha:{goal:'🎓 恭喜——环境工坊通关！',text:'<strong>🔧 基础排错顺序卡</strong><br>1. 读完整错误原文（别一看红字就慌）<br>2. 判断类型：缺依赖 / 路径 / 权限 / 版本 / 网络<br>3. 检查对应位置（缺库→先查是哪个环境）<br>4. 执行最小范围修复（别动不动重装全部）<br>5. 重跑验证：原报错消失才算好<br><br>你学会的不是「背命令」，是<strong>一套遇错不慌的排查习惯</strong>。<br>🎓 赢得认证：<strong>环境搭建</strong>！<br>下一站「程序底层矿山」：代码能跑了，可它在电脑里到底怎么一步步跑起来？'}
  }},
  'w5_1':{world:'w5',n:1,a:'47',boss:false,type:'core',optional:false,title:'电脑只懂 0 和 1',goal:'看透最底层',xp:100,content:{
    flow:[
      {talk:'① 接上一关：能跑了，但它到底咋跑的？|W4 你把脚本跑起来了。可你有没有想过——电脑里没有小人在读你的代码，它<strong>到底怎么「看懂」并执行</strong>的？<br>这一片矿山，带你挖到最底下那一层。'},
      {talk:'② 一个反直觉的真相：电脑其实啥都不「懂」|它不认识「苹果」、不认识 print、更不懂中文。<strong>电脑骨子里只认两个东西：0 和 1。</strong><br>所有的字、图、视频、代码，进了电脑，最后全变成一长串 0 和 1。'},
      {talk:'③ 为啥偏偏是 0 和 1|电脑是电子的：一根线，<strong>通电 = 1，断电 = 0</strong>。就这么简单粗暴。<br>它没法搞「半通电」表示 2、3——太不稳。所以只用两个最稳的状态：有电 / 没电 = 1 / 0。<strong>电脑本质就是一大堆「开关」。</strong>'},
      {try:{q:'电脑最底层其实只认得啥？',opts:[{t:'0 和 1（通电 / 断电两个状态）',ok:true},{t:'中文和英文',ok:false},{t:'0 到 9 十个数字',ok:false}],fb:'电脑是电子的：通电=1、断电=0，只有两个最稳的状态。所有东西进电脑最后都变成一长串 0 和 1。它就是一大堆开关。'}},
      {talk:'④ 那「苹果」「图片」咋变成 0 和 1？|靠「编码」约定：约定某串 0101 代表「A」、另一串代表「苹」字，图片则是每个像素点的颜色编成 0101……<br><strong>一切信息，都能翻译成 0 和 1 的组合。</strong>你不用会编，知道「底层全是 0101」就行。'},
      {sequence:{ask:'一段程序处理数据，基本走这条路。把顺序拖对（这是整条「程序运行链」的起点）：',items:[{id:'in',text:'用户输入内容（文字、数字、图片…）'},{id:'data',text:'进入程序，变成程序能处理的「数据」'},{id:'proc',text:'程序按规则处理这些数据'},{id:'out',text:'输出结果'}],answer:['in','data','proc','out'],card:'数据流卡',fb:'输入→变成数据→处理→输出。这是任何程序的基本骨架，也是后面完整「运行链」的开头。0 和 1 只是数据在最底层的样子，你不用管它。'}},
      {talk:'⑤ 那问题来了：你写的 Python 呢？|你写的 <code style="background:#eee;padding:2px 8px;border-radius:4px">print("你好")</code> 是给人看的字，电脑根本不认。<strong>它也得先被翻译成一长串 0 和 1（叫「机器码」），电脑才能执行。</strong><br>——谁来翻译？下一关说。'},
      {try:{q:'你写的 <code style="background:#eee;padding:2px 8px;border-radius:4px">print("你好")</code>，电脑能直接执行吗？',opts:[{t:'不能，得先翻译成 0 和 1（机器码）电脑才认',ok:true},{t:'能，电脑认识 print',ok:false},{t:'能，电脑认识中文',ok:false}],fb:'print、中文，电脑都不认。你的代码得先被翻译成一长串 0/1（机器码），电脑才能一步步执行。谁翻译？下一关揭晓。'}},
      {talk:'⑥ 连回：这就是「底层」|你平时用的一切——AI 回你话、Python 跑脚本、视频播放——<strong>再上层花哨，落到最底下都是 0 和 1 在流动</strong>。<br>看懂这一层，你就不会觉得电脑「神秘」了，它只是个超快的开关阵列。'},
      {blocks:{runType:'template',ask:'给程序喂个输入，运行看它变成「数据」再输出。<strong>换个值再运行一次</strong>，看程序内部跟着变：',lines:['用户输入 = "‹inp›"','程序数据 = 用户输入','print("程序收到并处理了：" + 程序数据)'],slots:{inp:{label:'你输入的内容',ph:'比如 你好 或 42'}},outputTemplate:'程序收到并处理了：{inp}',goalRuns:2,card:'数据流运行卡',cardBody:'你输入的东西进了程序，就变成能处理的「数据」，存进变量、再输出。改输入、变量和输出就跟着变——这是运行链的起点：输入 → 数据。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'电脑骨子里只认 <strong>0 和 1</strong>（通电 / 断电）；文字、图片、代码进电脑全变成 0101。你写的 Python 也得先翻译成 0/1（机器码）电脑才能执行。<br>下一关：谁把你的代码翻译成 0 和 1？——翻译官登场。'}
  }},
  'w5_2':{world:'w5',n:2,a:'48',boss:false,type:'core',optional:false,title:'需要翻译',goal:'搞懂谁把代码翻成机器码',xp:100,content:{
    flow:[
      {talk:'① 接上一关：代码和电脑之间，差一个翻译|你写的是「人话式」代码（print、if），电脑只认 0 和 1。<strong>中间隔着一条鸿沟</strong>，得有个翻译官把代码翻成 0101（机器码）。'},
      {talk:'② 回收 W4：解释器就是翻译官|还记得 W4 的 Python 解释器吗？它干的正是这活：<strong>把你的 Python 一句句翻译成电脑能执行的 0 和 1</strong>。你写人话，它翻成机器话。'},
      {talk:'③ 机器码 = 电脑的母语|翻译出来的那串 0 和 1，叫<strong>机器码</strong>——是电脑唯一「天生就懂」的语言。<br>人几乎没法直接读机器码（全是 0101），所以我们才用 Python 这种「人话式」语言写，再翻译。'},
      {try:{q:'为啥人不直接用 0 和 1（机器码）写程序？',opts:[{t:'全是 0101，人根本读不了写不了，太反人类',ok:true},{t:'机器码是要收费的',ok:false},{t:'机器码写出来跑得慢',ok:false}],fb:'机器码是电脑母语，但对人是天书（全是 0101）。所以人用 Python 这种好懂的语言写，再靠翻译官翻成机器码。分工：人写人话，机器认机器话。'}},
      {talk:'④ 类比：你和外国人谈生意|你说中文、对方只懂英文，得有个翻译。<br><strong>你 = 写代码的人（说「人话」），电脑 = 只懂英文的老外（只认 0101），翻译 = 解释器 / 编译器。</strong>没翻译，俩人干瞪眼。'},
      {sequence:{ask:'一个 .py 文件从「代码」到「出结果」，中间必须经过谁？把运行链排对：',items:[{id:'file',text:'代码文件（main.py，一段文本，自己不会跑）'},{id:'read',text:'Python 解释器读取它'},{id:'trans',text:'翻译成电脑能执行的步骤'},{id:'exec',text:'电脑执行'},{id:'out',text:'输出结果'}],answer:['file','read','trans','exec','out'],card:'解释执行链卡',fb:'代码文件光保存着不会自己跑——必须由解释器读取、翻译，电脑才执行、最后输出。缺了解释器这一环，代码就是一段死文本。'}},
      {talk:'⑤ 翻译有两种搞法|同样是翻译，可以「边说边翻」（现场口译），也可以「先把整本书翻译好再给对方看」（笔译成书）。<br><strong>代码的翻译，也正好这两种路子</strong>——这就是下一关的「解释」和「编译」。'},
      {cmd:{ask:'代码文件 main.py 存好了，但它不会自己跑。选出「叫解释器来执行它」的命令，敲下去：',blocks:['python main.py','main.py','save main.py'],answer:'python main.py',result:'今日任务清单已生成',note:'← python + 文件名 = 叫解释器执行这个脚本。光有文件不运行，永远没有输出——运行命令才是那个「启动键」。',hints:['喊解释器用 python，后面跟文件名。','光双击、光保存都不算运行，得用命令启动。','就是 python main.py。']}},
      {talk:'⑥ 连回 AI|你懂了「代码要翻译才能跑」，就明白 W4 为啥非装 Python 不可——<strong>装的解释器，就是那个翻译官</strong>。<br>没翻译官，代码就是一堆电脑看不懂的字。'},
      {try:{q:'「人写 Python、机器认机器码、中间靠翻译」，这套分工的好处是？',opts:[{t:'人写好懂的代码，翻译官负责翻成机器码，各干各的',ok:true},{t:'纯粹为了给人添麻烦',ok:false},{t:'为了让程序变慢',ok:false}],fb:'人读不了 0101，机器读不了中文 print。中间加个翻译官（解释器/编译器），人写人话、机器认机器话，各司其职。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'代码（人话）和电脑（只认 0101）之间隔着鸿沟，靠<strong>翻译官（解释器 / 编译器）</strong>把代码翻成<strong>机器码</strong>（电脑母语，全是 0101）。翻译有「边跑边翻」和「先全翻好」两种路子。<br>下一关：这两种方式——解释 vs 编译，到底差在哪。'}
  }},
  'w5_3':{world:'w5',n:3,a:'49',boss:false,type:'core',optional:false,title:'编译 vs 解释',goal:'分清两种翻译方式',xp:100,content:{
    flow:[
      {talk:'① 接上一关：两种翻译方式|上一关说翻译有两路：边跑边翻、先全翻好。它俩有专门名字：<strong>解释</strong>和<strong>编译</strong>。这是理解「程序怎么跑」的关键一环。'},
      {talk:'② 解释：边跑边翻（Python 这类）|解释器<strong>拿到代码，一句一句边翻译边执行</strong>——翻一句、跑一句、再翻下一句。<br>像现场口译：你说一句，翻译立刻翻一句。<strong>Python 就是这种</strong>，所以你 <code style="background:#eee;padding:2px 8px;border-radius:4px">python 脚本.py</code> 一敲就开始跑。'},
      {talk:'③ 编译：先全翻好，再一次性跑（C 这类）|编译器<strong>先把整个代码从头到尾全翻译成机器码，打包成一个可执行文件，之后运行的是那个翻好的成品</strong>。<br>像笔译：先把整本书翻译成册，读者拿到的是成书。<strong>C 语言就是这种</strong>。'},
      {sequence:{ask:'先排「解释型」（Python 这类）的执行路线：',items:[{id:'code',text:'代码'},{id:'read',text:'解释器读取'},{id:'run',text:'边读边执行（翻一句、跑一句）'},{id:'out',text:'输出'}],answer:['code','read','run','out'],card:'解释路线卡',fb:'解释型：解释器拿到代码，边翻边跑、一句句来（像现场口译）。Python 就是这种，改完直接 python 跑。'}},
      {talk:'④ 一个关键区别：改代码之后|<strong>解释型（Python）</strong>：改完直接跑，省事——反正它每次都现翻。<br><strong>编译型（C）</strong>：改完得<strong>重新编译一遍</strong>（重新翻译打包），才能跑新的。这也是为啥 C 项目改一次要「编译等半天」。'},
      {sequence:{ask:'再排「编译型」（C 这类）的执行路线，它多了一步：',items:[{id:'code',text:'代码'},{id:'compile',text:'编译（先整个翻译、打包）'},{id:'exe',text:'生成可执行成品'},{id:'run',text:'运行那个成品'},{id:'out',text:'输出'}],answer:['code','compile','exe','run','out'],card:'编译路线卡',fb:'编译型：先把整个代码翻好、打包成成品，再运行成品（像先出书再读）。C 就是这种，改完得重新编译。这是面向小白的简化模型——别绝对化说「Python 只能解释、C 只能编译」。'}},
      {talk:'⑤ 各有各的好（别急着分高下）|<strong>解释型</strong>：灵活、改完就跑、跨平台方便，但每次要现翻 → 慢一点。<br><strong>编译型</strong>：提前全翻好 → 跑得飞快，但改一次要重编、跨平台麻烦。<strong>没有谁绝对好，看你要啥。</strong>'},
      {try:{q:'关于编译和解释，下面哪句对？',opts:[{t:'各有优劣：解释灵活但慢，编译快但改了要重编',ok:true},{t:'编译在所有方面都碾压解释',ok:false},{t:'它俩完全一样',ok:false}],fb:'没有绝对好坏。解释（Python）胜在灵活、改完就跑；编译（C）胜在跑得快。选哪种看需求——要快选编译，要灵活选解释。'}},
      {talk:'⑥ 连回 AI / 你的工作|你以后会发现：要「快、跑在很多设备上的底层程序」，常用编译型（C / C++ / Go）；要「快速写、快速改、搞 AI 和自动化」，用解释型（Python）。<br><strong>懂这个区别，你就能判断『这活该用哪类语言』。</strong>'},
      {try:{q:'「改完代码马上就能跑、不用等编译」是哪种的特点？',opts:[{t:'解释型（如 Python，每次现翻）',ok:true},{t:'编译型（如 C）',ok:false},{t:'两种都这样',ok:false}],fb:'解释型每次现翻，改完直接跑（Python）；编译型改了要重新编译打包才能跑（C）。这是俩最直观的区别。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'两种翻译方式：<strong>解释</strong>（边翻边跑，如 Python，灵活但慢、改完即跑）vs <strong>编译</strong>（先全翻成成品再跑，如 C，快但改了要重编）。各有优劣，看需求选。<br>下一关：那为啥「边翻边跑」就慢、「先全翻好」就快？——把 Python 慢 C 快说透。'}
  }},
  'w5_4':{world:'w5',n:4,a:'50',boss:false,type:'core',optional:false,title:'为何 Python 慢 C 快',goal:'搞懂快慢的根子',xp:100,content:{
    flow:[
      {talk:'① 接上一关：承诺兑现——为啥一慢一快|你常听说「Python 慢、C 快」。上一关埋了根：一个边翻边跑、一个先全翻好。这一关说透到底差在哪。'},
      {talk:'② 打个比方：边看菜谱边做 vs 背熟了再做|<strong>Python（解释）</strong>像「边看菜谱边炒」：每做一步都要低头看一眼菜谱（现翻译）——多了个「看」的动作，慢。<br><strong>C（编译）</strong>像「背得滚瓜烂熟直接炒」：菜谱早内化成肌肉记忆（提前全翻成机器码），动作一气呵成——快。'},
      {try:{q:'为啥「边翻边跑」（解释型）会慢一些？',opts:[{t:'每跑一步都要现翻译一次，多了道工序',ok:true},{t:'因为解释器是坏的',ok:false},{t:'因为 Python 代码更长',ok:false}],fb:'解释型每执行一步都要「现翻译」——好比边看菜谱边做，多了「看」这道工序。编译型提前全翻好、直接跑，省了这道，所以快。'}},
      {talk:'③ 快多少？差挺多|同一个重活（比如算几亿次），C 可能几秒，Python 要几十秒甚至几分钟。<strong>差几倍到几十倍很常见。</strong><br>所以对「要疯狂算、要极致快」的场景，C 这类编译语言有明显优势。'},
      {sequence:{ask:'为啥 Python 通常比 C 慢？把「解释型每跑一步」多出来的那道工序，在执行循环里排出来：',items:[{id:'step',text:'准备执行下一句代码'},{id:'trans',text:'解释器现场翻译这一句（← 多出来的工序）'},{id:'do',text:'电脑执行这一句'},{id:'next',text:'循环回去，翻下一句…'}],answer:['step','trans','do','next'],card:'解释开销卡',fb:'解释型每执行一步都要「现翻译一次」，多了道工序，所以慢；编译型提前全翻好、直接跑，省了这道。但慢一点对多数活无所谓——Python 胜在好写好改、省人的时间。（严格说 Python 先转字节码再执行，这是入门类比。）'}},
      {talk:'④ 那 Python 慢，为啥还这么火？|因为<strong>对绝大多数活，慢一点根本无所谓</strong>——你写个自动整理文件的脚本，快 0.1 秒还是 0.3 秒，你根本感觉不到。<br>而 Python <strong>好写、好改、库多</strong>，省的是你的时间。<strong>省人的时间，往往比省机器的时间值钱。</strong>'},
      {try:{q:'Python 慢却依然主流，主要因为？',opts:[{t:'大多数活对速度不敏感，而 Python 好写好改、省人的时间',ok:true},{t:'其实 Python 比 C 快',ok:false},{t:'因为没人会 C',ok:false}],fb:'对多数活（脚本、AI、自动化），慢零点几秒无所谓；而 Python 好写好改、库多，省的是你的时间。省人的时间通常比省机器的更值。'}},
      {talk:'⑤ 所以怎么选：看你在乎啥|<strong>在乎机器速度（底层、海量计算）→ 编译型（C）。在乎开发速度（快速写、搞 AI、自动化）→ 解释型（Python）。</strong><br>很多大项目还两者混用：核心慢的部分用 C 写，外层用 Python 调。'},
      {try:{q:'编译型和解释型，到底怎么选？',opts:[{t:'看你在乎「机器速度」还是「开发速度」，甚至可以混用',ok:true},{t:'永远只选 C',ok:false},{t:'永远只选 Python',ok:false}],fb:'要机器快 → 编译（C）；要开发快、搞 AI → 解释（Python）。大项目常混用：重活 C 写、外层 Python 调。没有唯一答案，看需求。'}},
      {talk:'⑥ 连回 AI|有意思的是：很多 Python 的 AI 库（算得飞快的那些），<strong>底层其实是 C 写的</strong>——Python 只是个好用的「外壳」，真正的重活交给底层 C。<strong>快和好写，被聪明地结合了。</strong>'}
    ],
    aha:{goal:'你今天真正学会的',text:'Python 慢是因为「边翻边跑」（每步现翻），C 快是因为「先全翻好直接跑」。但慢一点对多数活无所谓，Python 胜在<strong>省人的时间</strong>（好写好改库多）。选型看你在乎机器速度还是开发速度。<br>（严格说：Python 一般先把代码转成「字节码」再由虚拟机执行，慢不只是「每步现翻」；算法、库实现、数据类型也影响速度——这里的「边翻边跑」是入门类比，别当完整定义。）<br>下一关：代码跑起来，数据放哪？——内存（回收 W2 变量！）。'}
  }},
  'w5_5':{world:'w5',n:5,a:'51',boss:false,type:'core',optional:false,title:'内存',goal:'搞懂数据放哪',xp:100,content:{
    flow:[
      {talk:'① 接上一关：程序跑起来，东西放哪？|程序一跑，要临时记一堆东西：算到一半的结果、你输入的名字……这些放哪？<strong>放「内存」</strong>。<br>这一关回收你 W2 学的变量——它就住在内存里。'},
      {talk:'② 内存 = 电脑的「工作台」|电脑有两种「存东西的地方」：<strong>硬盘</strong>（仓库，断电也在，存文件，大但慢）和<strong>内存</strong>（工作台，断电就清空，放「正在用的东西」，小但快）。<br>程序跑起来，数据摊在内存这张「桌面」上，现用现取。'},
      {try:{q:'内存和硬盘最大的区别？',opts:[{t:'内存是「工作台」（快、断电清空）；硬盘是「仓库」（慢、断电还在）',ok:true},{t:'内存一定比硬盘大',ok:false},{t:'完全一样',ok:false}],fb:'硬盘=仓库（存文件，断电还在，大而慢）；内存=工作台（放正在用的，断电就没，小而快）。程序运行时数据摊在内存上。'}},
      {talk:'③ 回收 W2：变量就住在内存里|还记得 W2 说「变量是程序的记性、记忆小抽屉」吗？<strong>那些抽屉，就摆在内存这张桌面上。</strong><br>你写 <code style="background:#eee;padding:2px 8px;border-radius:4px">名字 = "小明"</code>，电脑就在内存里划一小块，贴上「名字」标签，放进「小明」。<strong>伏笔回收了！</strong>'},
      {trace:{ask:'程序跑起来，变量就摊在「内存」这张工作台上。追踪这段，看内存里存了啥、啥时候变：',code:['price = 20','count = 3','total = price * count','print(total)'],checkpoints:[{ask:'① price 这个变量存的是多少？',accept:['20']},{ask:'② count 存的是多少？',accept:['3','三']},{ask:'③ total 是算出来的「中间结果」，它的值是多少？',accept:['60','六十']},{ask:'④ 程序跑完、关掉后，这些内存里的变量还在吗？填「在」或「不在」：',accept:['不在','没了','清空','不'],contains:true}],finalOutput:{ask:'⑤ print(total) 会显示什么？',need:['60']},hints:['price 直接存了 20。','count 直接存了 3。','total = price * count = 20 × 3 = 60，在第 3 行才算出来。','内存是「工作台」，程序一结束就清空——变量不会自动存进硬盘文件。'],card:'程序内存状态卡',cardBody:'price=20、count=3 是输入数据；total=60 是运行中算出的「中间结果」。它们都住在内存（工作台），程序一结束就清空、不会自动落盘——要保存得专门写到硬盘。一次读 100 万条会比读 10 条更容易占满内存。'}},
      {talk:'④ 为啥「内存不够」会卡|内存是有限的桌面。开太多程序、处理太大的数据，<strong>桌面摆不下就卡、甚至崩</strong>——就像桌子太小，东西堆满了没法干活。<br>这就是「内存不足」。加内存条 = 换张更大的桌子。'},
      {try:{q:'电脑开太多东西变卡，常见原因之一？',opts:[{t:'内存（工作台）被占满，摆不下了',ok:true},{t:'硬盘太大了',ok:false},{t:'屏幕太小了',ok:false}],fb:'内存是有限的工作台，开太多、数据太大就摆满了，电脑只能卡。加内存=换更大的桌子。这就是「内存不足」卡顿。'}},
      {talk:'⑤ 内存 vs 硬盘，别搞混（高频误区）|「我电脑 512G」——那是<strong>硬盘</strong>（仓库容量）。「我 16G 内存」——那是<strong>内存</strong>（工作台大小）。<br>买电脑看的两个数：一个管「能存多少文件」，一个管「能同时开多少活」。'},
      {try:{q:'「我这电脑 16G 内存、1T 硬盘」，这俩数分别管啥？',opts:[{t:'16G 内存管「同时能开多少活」，1T 硬盘管「能存多少文件」',ok:true},{t:'反过来',ok:false},{t:'两个是一回事',ok:false}],fb:'内存（16G）=工作台大小，管同时能干多少活；硬盘（1T）=仓库大小，管能存多少文件。别把这俩搞混——高频误区。'}},
      {talk:'⑥ 连回 AI|AI 处理大文件、跑大模型，吃的就是内存——数据得先摊到内存上才能算。<strong>「内存不够」是跑 AI 时的常见拦路虎</strong>。<br>你懂了内存，就明白为啥有时候 AI 任务会因「内存不足」失败。'}
    ],
    aha:{goal:'你今天真正学会的',text:'内存 = 程序运行时的「工作台」（快、断电清空），硬盘 = 「仓库」（慢、断电还在）。<strong>W2 的变量就住在内存里</strong>（伏笔回收！）。内存有限，占满就卡。别和硬盘容量搞混。<br>下一关：谁在这张桌面上真正动手干活？——CPU。'}
  }},
  'w5_6':{world:'w5',n:6,a:'52',boss:false,type:'core',optional:false,title:'CPU',goal:'搞懂谁在真正干活',xp:100,content:{
    flow:[
      {talk:'① 接上一关：桌面（内存）有了，谁动手？|数据摊在内存这张桌面上，可总得有个「人」真正去算、去执行吧？<br>——这个真正干活的，是 <strong>CPU</strong>，电脑的「大脑」。'},
      {talk:'② CPU = 一个超快但很「轴」的工人|CPU 干活的方式特别死板：<strong>从内存拿一条机器码指令 → 执行 → 再拿下一条 → 执行……一条接一条。</strong><br>它不聪明、不会变通，但快得离谱——一秒能执行几十亿条指令。'},
      {try:{q:'CPU 是干啥的？',opts:[{t:'电脑的「大脑」，一条条执行机器码指令、真正干活的',ok:true},{t:'存文件的地方',ok:false},{t:'显示画面的',ok:false}],fb:'CPU=大脑/工人，从内存拿机器码指令一条条执行。存文件是硬盘、显示是屏幕。真正「算」和「执行」的是 CPU。'}},
      {talk:'③ 「几核几核」是啥意思|你听说 CPU「四核」「八核」——<strong>一核 = 一个工人</strong>。八核就是八个工人一起干，能同时处理更多活。<br>这就是为啥核多的电脑「多开不卡」——人手多。'},
      {try:{q:'CPU「八核」大概是啥意思？',opts:[{t:'有八个能同时干活的「工人」，并行处理更多任务',ok:true},{t:'能存八倍的文件',ok:false},{t:'屏幕大八倍',ok:false}],fb:'一核=一个工人，八核=八个工人并行干活，能同时处理更多任务。核多，多任务就更从容。跟存储、屏幕都没关系。'}},
      {talk:'④ 串起来：程序跑起来的那一刻|把这几关连起来：你的代码被<strong>翻译成机器码</strong>（前几关）→ 机器码和数据摆到<strong>内存</strong>（上一关）→ <strong>CPU</strong> 从内存一条条取指令执行 → 结果再写回内存 / 显示出来。<strong>这就是「程序在跑」的真相。</strong>'},
      {locate:{ask:'同样是「程序卡着不动」，原因可能天差地别。读两个场景，判断各自卡在哪：',text:['【场景A】程序正在做 1000 万次循环计算，进度慢慢走。','【场景B】程序调用 AI 接口后，卡了 30 秒没反应。'],steps:[{q:'① 场景A（1000万次计算）主要在消耗谁？',type:'choice',options:[{t:'CPU——在拼命做计算',ok:true},{t:'网络——在等外部返回',ok:false},{t:'硬盘——在存文件',ok:false}],fb:'大量循环计算是 CPU 在真干活，属于「执行与计算层」。'},{q:'② 场景B（调 AI 接口卡住）主要卡在哪？',type:'choice',options:[{t:'外部等待——在等网络/AI 返回，CPU 其实闲着',ok:true},{t:'CPU 在拼命算',ok:false},{t:'内存满了',ok:false}],fb:'调接口卡住是在「等外部返回」（网络/模型），CPU 这会儿基本闲着——外部等待层，跟 CPU 计算不是一回事。'},{q:'③ 所以「程序卡」能一律怪 CPU 吗？',type:'choice',options:[{t:'不能——先分清是 CPU 在算、还是在等外部',ok:true},{t:'能，卡就是 CPU 的锅',ok:false}],fb:'关键区分：CPU 计算 vs 外部等待。前者加算力有用，后者加算力没用（它在等别人）。分清了才不瞎折腾。'}],card:'CPU vs 等待判断卡',cardBody:'CPU 计算（大量循环）≠ 外部等待（调接口/网络）。程序卡不一定是 CPU——可能在等网络、等模型、等文件。分清「在算」还是「在等」，是判断故障层的关键一步。'}},
      {talk:'⑤ 为啥 C 快能「榨干」CPU|回收上关：C 编译成的机器码，是 CPU 能直接、高效执行的「母语」。而 Python 边翻边跑，CPU 还要等翻译——所以榨不干 CPU 的速度。<br><strong>越贴近 CPU 母语（机器码），跑得越猛。</strong>'},
      {try:{q:'为啥编译型（C）更能发挥 CPU 的速度？',opts:[{t:'它直接给 CPU 现成的机器码，不用边跑边等翻译',ok:true},{t:'它能让 CPU 转得更快',ok:false},{t:'它给电脑换了个 CPU',ok:false}],fb:'C 编译成机器码=CPU 母语，拿来就执行；Python 边翻边跑，CPU 得等翻译，发挥不满。越贴近 CPU 母语，越快。'}},
      {talk:'⑥ 连回 AI|跑大 AI 模型为啥还要「显卡（GPU）」？因为 GPU 是「几千个小工人」专干重复计算，比 CPU 更适合 AI 那种海量并行算。<br><strong>你懂了 CPU 是「少数快工人」、GPU 是「海量小工人」，就明白为啥跑 AI 拼显卡。</strong>'}
    ],
    aha:{goal:'你今天真正学会的',text:'CPU = 电脑的大脑 / 工人，从内存一条条取机器码指令飞快执行（几核=几个工人）。<strong>程序在跑 = CPU 从内存取指令执行</strong>。越贴近 CPU 母语（机器码）越快，所以 C 猛；跑 AI 还爱用 GPU（海量小工人）。<br>下一关：你一个操作员，懂这些底层到底有啥用？'}
  }},
  'w5_7':{world:'w5',n:7,a:'53',boss:false,type:'core',optional:false,title:'操作员为何懂点底层',goal:'搞懂懂底层的用处',xp:100,content:{
    flow:[
      {talk:'① 你可能在想：这些底层，跟我有啥关系？|「我又不写 C、不造 CPU，懂这些干嘛？」——这一关就说清：<strong>懂点底层，不是为了炫技，是为了让你判断得更准、遇事不慌。</strong>'},
      {talk:'② 用处一：判断「这活该用啥」|有人要你做个「要跑得飞快的底层小工具」，你知道该往编译型（C / Go）想；做「快速搞 AI、自动化」，Python。<br><strong>懂编译 vs 解释、快 vs 灵活，你选型就有谱，不会瞎选。</strong>'},
      {try:{q:'懂「编译快、解释灵活」这个区别，对你最实际的用处？',opts:[{t:'判断某个活该用哪类语言 / 工具，选型有谱',ok:true},{t:'能自己造 CPU',ok:false},{t:'能手写机器码',ok:false}],fb:'你不用会写 C。但懂「要快用编译、要灵活用解释」，接活 / 选工具时你就判断得准——这才是操作员要的。'}},
