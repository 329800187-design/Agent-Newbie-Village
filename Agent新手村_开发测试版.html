<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5f1e8">
<title>Agent 新手村 · v1 内容版</title>
<style>
:root{--paper:#f5f1e8;--paper-dark:#ebe5d0;--paper-light:#fbf8f0;--ink:#1a1a1a;--ink-soft:#3a3a3a;--ink-fade:#8a8a8a;--line-soft:rgba(26,26,26,.22);--c-current:#3a5a40;--c-current-dark:#2d4530;--c-completed:#c89b3c;--c-completed-dark:#a07c2b;--c-locked:#3a3d4a;--c-boss:#FF9600;--c-boss-dark:#b06c00;--c-star:#FFC800;--c-error:#e74c3c;--g-locked:repeating-linear-gradient(45deg,#d8d4c4 0 8px,#cdc8b8 8px 16px);--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--radius:18px;--radius-sm:8px;--radius-lg:24px;--fs-xs:11px;--fs-sm:13px;--fs-md:15px;--fs-lg:18px;--fs-xl:22px;--fs-2xl:32px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;color:var(--ink)}
body{background:linear-gradient(135deg,#3a1c71,#1e6f50);display:flex;justify-content:center;align-items:center}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.phone-frame{position:relative;width:100%;height:100%;max-width:480px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
/* ========== 响应式：仅 CSS，不动 JS / HTML class / id ========== */
/* 极窄屏（<360）：防挤压 */
@media(max-width:359px){:root{--fs-md:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:26px}.node-mini{width:46px;height:46px}.node-mini.boss{width:54px;height:54px}}
/* 平板（480-767）：手机壳居中，底部导航保持 */
@media(min-width:480px) and (max-width:767px){body{padding:16px;align-items:flex-start}.phone-frame{height:calc(100vh - 32px);max-height:900px;max-width:520px;border-radius:24px;box-shadow:0 16px 48px rgba(0,0,0,.4);margin:0 auto}}
/* 平板横屏（768-1023）：主区域扩到 90%，左右紫色收窄 */
@media(min-width:768px) and (max-width:1023px){body{align-items:flex-start;padding:12px}.phone-frame{max-width:none;width:100%;height:100vh;max-height:none;border-radius:0;box-shadow:none;flex-direction:column}.scroll-y{padding-bottom:24px}#worlds-container{padding:0 16px 24px}.world-card{margin-left:8px;margin-right:8px}}
/* 桌面（1024-1279）：左侧竖栏 + 主区避让，地图 2 列 */
@media(min-width:1024px) and (max-width:1279px){body{align-items:stretch;padding:0;background:var(--paper)}.phone-frame{max-width:none;width:100%;height:100vh;max-height:none;border-radius:0;box-shadow:none;position:relative;background:var(--paper)}.bottom-nav{position:absolute;left:0;top:0;bottom:0;z-index:50;flex-direction:column;width:220px;height:100%;border-top:none;border-right:1.5px solid var(--ink);justify-content:flex-start;padding:24px 0;gap:4px;flex-shrink:0;background:var(--paper-light)}.nav-item{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;padding:14px 24px;font-size:14px}.nav-item .ico{font-size:20px}.page{flex:1;width:100%;padding-left:220px}.scroll-y{padding-bottom:32px}#worlds-container{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 18px 18px;align-items:start}.world-card{margin:0}#worlds-container .world-card.locked{grid-column:1 / -1}.level-content{max-width:780px;margin:0 auto;padding:24px}.simple-page{max-width:760px}.info-card{border-radius:var(--radius);max-width:480px}.modal-overlay{align-items:center}}
/* 大屏（≥1280）：左侧 240 竖栏 + 主区 1280 居中，地图 3 列 */
@media(min-width:1280px){body{align-items:stretch;padding:0;background:var(--paper)}.phone-frame{max-width:1400px;width:calc(100% - 32px);height:100vh;max-height:none;border-radius:0;box-shadow:0 0 60px rgba(0,0,0,.3);position:relative;margin:0 auto;background:var(--paper)}.bottom-nav{position:absolute;left:0;top:0;bottom:0;z-index:50;flex-direction:column;width:240px;height:100%;border-top:none;border-right:1.5px solid var(--ink);justify-content:flex-start;padding:28px 0;gap:6px;flex-shrink:0;background:var(--paper-light)}.nav-item{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:16px;padding:16px 28px;font-size:15px}.nav-item .ico{font-size:22px}.page{flex:1;width:100%;padding-left:240px}.scroll-y{padding-bottom:32px}#worlds-container{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 24px 24px;align-items:start}.world-card{margin:0}#worlds-container .world-card.locked{grid-column:1 / -1}.level-content{max-width:880px;margin:0 auto;padding:32px}.simple-page{max-width:820px}.info-card{border-radius:var(--radius);max-width:520px}.modal-overlay{align-items:center}.hero{padding-top:32px}.locked-preview{grid-template-columns:repeat(5,1fr)}}
.imgslot{position:relative;overflow:hidden;background:var(--g-locked);display:flex;align-items:center;justify-content:center}
.imgslot img{width:100%;height:100%;object-fit:cover;display:block}
.imgslot .tag{position:absolute;font-size:9px;color:#6b6150;font-weight:800;text-align:center;padding:1px 3px;background:rgba(245,241,232,.55);border-radius:3px;pointer-events:none;line-height:1.2}
.imgslot.has-img .tag{display:none}
.page{flex:1;display:none;flex-direction:column;overflow:hidden;position:relative;z-index:2}
.page.active{display:flex}
.scroll-y{overflow-y:auto;flex:1;padding-bottom:80px}
#splash{position:absolute;inset:0;z-index:300;background:linear-gradient(160deg,#3a1c71,#d76d77);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-6);padding:var(--sp-6);color:#fff;text-align:center}
#splash.hide{display:none}
#splash .splashimg{position:absolute;inset:0;width:100%;height:100%;border-radius:0;border:none;z-index:0;background:#1a0f2e}
#splash .splashimg img{width:100%;height:100%;object-fit:contain;display:block;object-position:center center}
#splash::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,15,60,.4),rgba(30,15,60,.72));z-index:1;opacity:0}
#splash .splashimg .tag{color:#fff;background:rgba(0,0,0,.25)}
#splash .splash-hotspot{position:absolute;bottom:5.5%;left:38%;width:24%;height:6%;z-index:10;cursor:pointer}
#splash .splash-hotspot::before{content:"";position:absolute;inset:-4px;border-radius:8px;background:radial-gradient(ellipse at center,rgba(255,200,80,.2) 0%,rgba(255,160,40,.08) 40%,transparent 70%);animation:hotspotGlow 2.2s ease-in-out infinite}
#splash .splash-hotspot::after{content:"";position:absolute;inset:-1px;border:1.5px solid rgba(255,200,80,.3);border-radius:6px;animation:hotspotRing 2.2s ease-in-out infinite}
@keyframes hotspotGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
@keyframes hotspotRing{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.03)}}
#splash .splash-hotspot .hotspot-hint{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);font-size:18px;animation:hintBounce 1.6s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,200,80,.6))}
@keyframes hintBounce{0%,100%{transform:translateX(-50%) translateY(0);opacity:.7}50%{transform:translateX(-50%) translateY(-8px);opacity:1}}
#splash .splash-hotspot:active ~ .splashimg{transform:scale(.98)}
@media(max-width:767px){.locked-preview{display:none}.locked-teaser{display:none}.locked-foot{display:none}.locked-mobile{display:flex !important}}
@media(min-width:768px){.locked-mobile{display:none}}
.hero{padding:var(--sp-5) var(--sp-5) var(--sp-3);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3)}
.hero h1{font-size:var(--fs-2xl);font-weight:900;letter-spacing:2px;font-family:"Noto Serif SC",serif;line-height:1.1}
.hero h1 .en{display:block;font-size:var(--fs-md);font-weight:700;margin-top:4px}
.hero .xp-chip{background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:20px;font-size:var(--fs-sm);font-weight:700;flex-shrink:0;display:flex;align-items:center;gap:6px}
.hero .xp-chip::before{content:"★";color:var(--c-star)}
.world-card{margin:var(--sp-3) var(--sp-4);background:linear-gradient(135deg,var(--parchment-light,#fbf8f0),var(--paper-light,#fbf8f0));border:var(--border-etch,2px solid var(--ink));border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-card,0 4px 0 var(--ink));position:relative;transition:transform .15s,box-shadow .15s}
.world-card:not(.locked):hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--etch-ink,var(--ink)),0 12px 28px rgba(26,15,46,.15)}
.world-card.locked{background:var(--g-locked);color:var(--ink-soft)}
.world-banner{height:88px;position:relative}
.world-banner .world-name{position:absolute;left:var(--sp-4);bottom:var(--sp-2);color:#fff;font-weight:900;font-size:var(--fs-lg);text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:2}
.world-banner .world-progress{position:absolute;right:var(--sp-4);top:var(--sp-3);color:#fff;font-size:var(--fs-xs);background:rgba(0,0,0,.35);padding:2px 8px;border-radius:10px;z-index:2}
.nodes-row{display:flex;align-items:center;justify-content:space-around;flex-wrap:wrap;gap:var(--sp-4) var(--sp-2);padding:var(--sp-4) var(--sp-3) var(--sp-5);position:relative}
.node-mini{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);position:relative;z-index:2;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.4);transition:transform .15s}
.node-mini .imgslot{width:100%;height:100%;border-radius:50%}
.node-mini .imgslot .tag{font-size:8px}
.node-mini:active{transform:scale(.95)}
.node-mini.clickable:hover{transform:scale(1.08)}
.sim-panel{margin:12px 0;padding:16px;background:rgba(0,0,0,.025);border:1px solid rgba(0,0,0,.1);border-radius:12px}
.sim-header{font-size:17px;font-weight:700;margin-bottom:4px;color:#3a3020}
.sim-disclaimer{font-size:11px;color:#b8863a;margin-bottom:10px;font-style:italic}
.sim-config-summary{font-size:12px;color:#6a5c40;padding:8px 12px;background:rgba(0,0,0,.04);border-radius:8px;margin-bottom:12px;line-height:1.5;word-break:break-all}
.sim-sc{background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:10px;padding:12px;margin-bottom:10px}
.sim-sc-pass{background:rgba(107,208,138,.08);border:1px solid #6bd08a;border-radius:10px;padding:12px;margin-bottom:10px}
.sim-sc-title{font-size:15px;font-weight:700;margin-bottom:4px}
.sim-sc-input{font-size:13px;color:#5a4a20;margin-bottom:4px;font-style:italic}
.sim-sc-goal{font-size:12px;color:#8a7d63;margin-bottom:8px}
.sim-sc-btns{display:flex;gap:8px;flex-wrap:wrap}
.sim-btn{padding:6px 18px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
.sim-btn-run{background:#c9a84a;color:#fff}
.sim-btn-run:hover{background:#b89020}
.sim-fail{margin-top:10px;padding:10px;background:rgba(208,66,66,.08);border:1px solid rgba(208,66,66,.25);border-radius:8px;font-size:12.5px;line-height:1.6}
.sim-fail ul{padding-left:20px;margin:4px 0}
.sim-fail-action{margin-top:6px;color:#c96028;font-weight:600}
.sim-log{margin-top:14px;padding:14px;background:rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.12);border-radius:10px}
.sim-log-title{font-size:15px;font-weight:700;margin-bottom:8px}
.sim-log-ol{padding-left:24px;line-height:1.7;font-size:13px}
.sim-log-ok{color:#3a6d3a}
.sim-log-warn{color:#b84020;font-weight:600}
.sim-log-fail{margin-top:10px;padding:10px;background:rgba(208,66,66,.07);border:1px solid rgba(208,66,66,.2);border-radius:8px;font-size:12.5px;line-height:1.6}
.sim-actions{margin-top:12px;font-size:14px}
@media(max-width:600px){.sim-panel{padding:10px}.sim-config-summary{font-size:11px}.sim-sc{padding:10px}}
.xtrain{margin:6px 12px 12px;padding:8px 4px 2px;border-top:1px dashed rgba(0,0,0,.12)}.xtrain-title{font-size:12px;color:#8a7d63;margin-bottom:7px;font-weight:600}.xtrain-row{display:flex;flex-wrap:wrap;gap:8px}.xtrain-node{position:relative;min-width:130px;max-width:200px;flex:1 1 130px;background:rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.12);border-radius:10px;padding:8px 10px;cursor:pointer;transition:transform .12s,border-color .12s}.xtrain-node.clickable:hover{transform:translateY(-2px);border-color:#c9a84a}.xtrain-node.locked{opacity:.62;cursor:default}.xtrain-node.done{border-color:#6bd08a;background:rgba(107,208,138,.08)}.xtrain-tag{display:inline-block;font-size:10px;padding:1px 8px;border-radius:8px;background:rgba(0,0,0,.08);margin-bottom:5px;color:#6a5c40}.xtrain-cap{font-size:12.5px;line-height:1.35;color:#3a3020}.xtrain-lock{font-size:11px;color:#b8863a;margin-top:5px;line-height:1.3}@media(max-width:600px){.xtrain-node{min-width:0;flex:1 1 100%;max-width:none}}
.node-mini.locked{filter:grayscale(1) brightness(.7)}
.node-mini.locked::after{content:"🔒";position:absolute;bottom:-4px;right:-4px;font-size:9px;background:var(--ink);color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--paper);z-index:3}
.node-mini.completed::after{content:"✓";position:absolute;top:-4px;right:-5px;font-size:11px;color:var(--c-completed-dark);font-weight:900;background:#fff;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);z-index:3}
.node-mini.current{border-color:var(--c-current);box-shadow:0 0 0 4px rgba(58,90,64,.28),0 2px 0 var(--c-current-dark);animation:breathe 1.6s ease-in-out infinite}
.node-mini.current::after{content:"▶";position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--c-current)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.node-mini.boss{width:62px;height:62px;border-color:var(--c-boss-dark)}
.node-mini.boss::before{content:"👑";position:absolute;top:-14px;right:-8px;font-size:16px;z-index:3}
.node-cap{position:absolute;top:106%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--ink-soft);white-space:nowrap;font-weight:700}
.locked-grid{display:flex;justify-content:space-between;padding:var(--sp-4);gap:var(--sp-2);flex-wrap:wrap}
.locked-pill{flex:1;min-width:60px;height:34px;border-radius:17px;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:900;color:var(--ink-soft);border:1.5px solid rgba(0,0,0,.15)}
.locked-foot{text-align:center;font-size:var(--fs-xs);opacity:.6;padding:var(--sp-2) var(--sp-3) var(--sp-3)}
.locked-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--sp-3);padding:var(--sp-4)}
.locked-world-item{background:#fff;border:2px solid var(--ink);border-radius:var(--radius-sm);padding:var(--sp-3);text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .15s}
.locked-world-item:hover{transform:translateY(-2px)}
.locked-world-item .lw-icon{width:56px;height:56px;margin:0 auto var(--sp-2);border-radius:50%;border:2px solid var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--paper-light)}
.locked-world-item .lw-icon img{width:100%;height:100%;object-fit:cover}
.locked-world-item .lw-name{font-size:var(--fs-sm);font-weight:900;color:var(--ink);margin-bottom:2px}
.locked-world-item .lw-desc{font-size:10px;color:var(--ink-soft);line-height:1.4}
.locked-world-item .lw-tag{display:inline-block;margin-top:var(--sp-1);font-size:9px;background:var(--paper-dark);padding:2px 8px;border-radius:8px;color:var(--ink-fade);font-weight:700}
.locked-teaser{background:linear-gradient(135deg,#fff9e6,#fff);border:2px dashed var(--c-boss);border-radius:var(--radius);padding:var(--sp-4);margin:var(--sp-3) var(--sp-4);text-align:center}
.locked-teaser .lt-title{font-size:var(--fs-md);font-weight:900;color:var(--c-boss-dark);margin-bottom:var(--sp-2)}
.locked-teaser .lt-sub{font-size:var(--fs-xs);color:var(--ink-soft);line-height:1.6}
.locked-mobile{display:none;flex-direction:column;align-items:center;gap:var(--sp-3);padding:var(--sp-5) var(--sp-4)}
.locked-mobile .locked-mobile-img{width:100%;max-width:320px;height:180px;border-radius:var(--radius);overflow:hidden;position:relative;background:var(--g-locked);border:2px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.locked-mobile .locked-mobile-img img{width:100%;height:100%;object-fit:cover;opacity:.65;filter:grayscale(30%)}
.locked-mobile .locked-mobile-img .tag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:var(--fs-lg);font-weight:900;color:var(--ink);background:rgba(255,255,255,.9);padding:4px 16px;border-radius:20px;border:2px solid var(--ink);pointer-events:none}
.locked-mobile .locked-mobile-text{text-align:center;font-size:var(--fs-md);font-weight:900;color:var(--ink);line-height:1.6}
.locked-mobile .locked-mobile-text span{font-size:var(--fs-xs);color:var(--ink-soft);font-weight:700;display:block;margin-top:2px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.info-card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius) var(--radius) 0 0;box-shadow:0 -8px 0 var(--ink);width:100%;max-width:420px;padding:var(--sp-5) var(--sp-4) var(--sp-6);max-height:80vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.info-head{display:flex;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-3)}
.info-head .imgslot{width:66px;height:66px;border-radius:var(--radius-sm);border:2px solid var(--ink);flex-shrink:0}
.info-card h3{font-family:"Noto Serif SC",serif;font-size:var(--fs-xl);font-weight:900}
.info-card .info-desc{font-size:var(--fs-xs);color:var(--ink-soft)}
.info-row{display:flex;gap:var(--sp-2);font-size:var(--fs-sm);line-height:1.6;padding:var(--sp-2) 0;border-bottom:1px dashed var(--line-soft)}
.info-row .ico{flex-shrink:0;width:24px;height:24px;background:var(--ink);color:var(--paper);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.info-row .ico.gold{background:var(--c-star);color:var(--ink)}
.info-row .ico.blue{background:#3a5a80}
.actions{display:flex;flex-direction:column;gap:var(--sp-3);margin-top:var(--sp-4)}
.btn{width:100%;padding:var(--sp-4);border:2.5px solid var(--ink);border-radius:30px;font-weight:900;letter-spacing:2px;font-size:var(--fs-md);box-shadow:0 4px 0 var(--ink);transition:transform .1s;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn-primary{background:#1a2940;color:#fff}
.btn-secondary{background:var(--paper);color:var(--ink)}
.btn-boss{background:var(--c-boss);color:#fff}
.locked-card{text-align:center;padding:var(--sp-6) var(--sp-4) var(--sp-5)}
.locked-card .lock-icon{font-size:56px;margin-bottom:var(--sp-3);opacity:.6}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;z-index:100;background:var(--paper);border-top:1.5px solid var(--ink);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--fs-xs);color:var(--ink-soft);padding:6px 0;cursor:pointer;font-weight:600}
.nav-item .ico{font-size:18px}
.nav-item.active{color:var(--ink);font-weight:900}
.level-page{flex:1;overflow-y:auto;padding-bottom:80px;background:var(--paper)}
.level-header{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink);padding:var(--sp-3) var(--sp-4);display:flex;align-items:center;gap:var(--sp-3);z-index:10}
.level-header .back{width:36px;height:36px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 0 var(--ink)}
.level-header .title .name{font-weight:900;font-size:var(--fs-md)}
.level-header .title .sub{font-size:var(--fs-xs);color:var(--ink-soft);display:block;margin-top:2px}

/* ═══════════════ R1.2 正式视觉系统 ═══════════════ */
/* 设计方向：羊皮纸旧档案 × 暗黑童话 × 手绘蚀刻 */
/* 设计令牌 */
:root{
  /* 羊皮纸色系（扩展现有 --paper 体系） */
  --parchment-light:#faf3e0;
  --parchment:#f0e2c0;
  --parchment-deep:#d4b896;
  --parchment-burn:#b8956e;
  --parchment-edge:#8b6914;
  /* 暗黑童话色系 */
  --nocturne-deep:#1a0f2e;
  --nocturne:#2d1b4e;
  --nocturne-mid:#3e2a5c;
  --nocturne-fade:#5a4a7a;
  --nocturne-glow:#c9a84a;
  /* 蚀刻/墨水 */
  --etch-ink:#1c1008;
  --etch-wash:rgba(28,16,8,.15);
  --etch-line:rgba(28,16,8,.3);
  /* 语义色 */
  --clr-success:#3a5a30;
  --clr-danger:#8b2a1a;
  --clr-warn:#8b6914;
  --clr-info:#2a4a6b;
  --clr-completed:#6b8a3a;
  --clr-boss-aura:#c07020;
  /* 字体栈 */
  --ff-display:'Georgia','Noto Serif SC','Times New Roman',serif;
  --ff-body:'Segoe UI','PingFang SC',system-ui,sans-serif;
  --ff-mono:'Consolas','SF Mono','Courier New',monospace;
  /* 装饰 */
  --border-etch:2px solid var(--etch-ink);
  --shadow-etch:0 2px 0 var(--etch-ink);
  --shadow-card:0 4px 0 var(--etch-ink),0 8px 20px rgba(26,15,46,.15);
  --radius-leaf:16px 4px 16px 4px;
  --radius-scroll:4px 16px 4px 16px;
}
/* 全局氛围 */
body{background:linear-gradient(160deg,var(--nocturne-deep),var(--nocturne),#1e3a2e)}
#splash{background:linear-gradient(160deg,var(--nocturne-deep),var(--nocturne-mid),#4a2040)}
/* 羊皮纸面板组件 */
.parchment-panel{
  background:linear-gradient(135deg,var(--parchment-light),var(--parchment));
  border:var(--border-etch);
  border-radius:var(--radius);box-shadow:var(--shadow-card);
  position:relative
}
.parchment-panel::after{
  content:'';position:absolute;inset:4px;border:1px solid var(--etch-wash);
  border-radius:calc(var(--radius) - 4px);pointer-events:none
}
/* 蚀刻标题 */
.etch-title{
  font-family:var(--ff-display);font-weight:900;letter-spacing:.03em;
  color:var(--etch-ink);text-shadow:1px 1px 0 rgba(212,184,150,.5)
}
.etch-subtitle{font-family:var(--ff-display);color:var(--etch-ink);opacity:.7;letter-spacing:.02em}
/* 暗黑卡片 */
.dark-card{
  background:linear-gradient(135deg,var(--nocturne),var(--nocturne-mid));
  border:2px solid var(--nocturne-glow);border-radius:var(--radius);
  color:#e8dcc8;box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 20px rgba(201,168,74,.1)
}
/* 按钮增强 */
.btn-gold{background:linear-gradient(135deg,var(--nocturne-glow),#a08030);color:#1a0f2e;font-weight:900}
.btn-etch{border:var(--border-etch);box-shadow:var(--shadow-etch);font-family:var(--ff-body)}
.btn-etch:hover{background:var(--parchment)}
/* 关卡完成弹窗增强 */
.completion-overlay{
  position:fixed;inset:0;z-index:400;background:rgba(26,15,46,.8);
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fadeIn .3s ease
}
.completion-card{
  background:linear-gradient(135deg,var(--parchment-light),var(--parchment));
  border:3px solid var(--parchment-edge);border-radius:var(--radius-scroll);
  box-shadow:0 0 0 4px var(--nocturne-glow),0 8px 32px rgba(0,0,0,.5);
  max-width:420px;width:100%;max-height:85vh;overflow-y:auto;padding:0
}
.completion-card .cc-badge{
  text-align:center;padding:24px 16px 12px;
  background:linear-gradient(180deg,rgba(201,168,74,.15),transparent);
  border-bottom:2px dashed var(--parchment-deep)
}
.completion-card .cc-badge .cc-icon{font-size:48px;display:block;margin-bottom:8px}
.completion-card .cc-badge .cc-title{font-family:var(--ff-display);font-size:22px;font-weight:900;color:var(--parchment-edge)}
.completion-card .cc-body{padding:16px 20px}
.completion-card .cc-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--etch-line)}
.completion-card .cc-row .cc-r-icon{font-size:18px;flex-shrink:0;width:28px;text-align:center}
.completion-card .cc-row .cc-r-text{font-size:13px;line-height:1.5;color:var(--etch-ink)}
.completion-card .cc-row .cc-r-text strong{display:block;font-size:14px;margin-bottom:2px}
.completion-card .cc-actions{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
/* 首次进入引导增强 */
.splash-enhanced{text-align:center;z-index:2;position:relative}
.splash-enhanced .se-logo{font-family:var(--ff-display);font-size:36px;font-weight:900;color:var(--nocturne-glow);text-shadow:0 0 20px rgba(201,168,74,.4);margin-bottom:8px;letter-spacing:.05em}
.splash-enhanced .se-tagline{font-size:14px;color:rgba(232,220,200,.7);letter-spacing:.08em;margin-bottom:24px}

.imgslot-fallback{background:var(--g-locked);position:relative}
.imgslot-fallback::after{content:attr(data-fallback);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-fade);text-align:center;padding:4px}
/* 地图增强 */
.world-card-enhanced{border:var(--border-etch);box-shadow:var(--shadow-card);transition:transform .15s,box-shadow .15s}
.world-card-enhanced:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--etch-ink),0 12px 28px rgba(26,15,46,.2)}
.world-card-enhanced .world-banner{border-bottom:2px solid var(--etch-ink)}
/* 响应式补充 */
@media(max-width:767px){.completion-card{max-width:92vw;margin:0 auto}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>

<script>
function slot(src,tag,cls){return '<div class="imgslot '+(cls||'')+'"><img src="'+src+'" alt="'+tag+'" onload="this.parentNode.classList.add(\'has-img\')" onerror="this.remove()"><span class="tag">'+tag+'</span></div>'}
var AB='assets/';
function nodeAsset(l){return AB+'nodes/C'+l.a+'.png'}
function doneAsset(l){return AB+'done/G'+l.a+'.png'}
var BG_ASSET={},BOSS_ASSET={},CERT_ASSET={};


var KURO_ASSET=AB+'kuro/H01.png';
/* ================================================================
   阶段一 · 分层学习系统 — 数据层（用户档案 / 学习路线 / 能力判断）
   本阶段只建骨架：不新增正式关卡、不修改现有 74 关与主线解锁规则。
   ================================================================ */
/* —— 用户档案默认值（learnerProfile schemaVersion:1）—— */
function defaultLearnerProfile(){return{
 schemaVersion:1,
 ageMode:'standard',        /* standard | youth（青少版本阶段仅记录模式+说明，完整青少内容后续阶段制作） */
 learningTrack:'beginner',  /* beginner | foundation —— 当前生效路线 */
 role:'learner',            /* learner | guardian（guardian 仅预留字段，本阶段不启用监护人功能） */
 onboardingCompleted:false,
 assessmentCompleted:false,
 declaredBasis:null,        /* none | some —— 用户自选基础情况（仅记录，不参与推荐计算） */
 assessment:{terminal:0,codeReading:0,debugging:0,agentConcepts:0,workflow:0},
 recommendedTrack:'beginner',
 confirmedTrack:null,
 unlockedByAssessment:[],   /* 预留：世界试炼阶段由试炼系统写入，阶段一无任何写入口 */
 passedWorldTrials:[],      /* 预留：世界试炼阶段由试炼系统写入，阶段一无任何写入口 */
 createdAt:null,
 updatedAt:null
};}
/* —— 档案归一化：缺字段补默认、非法值回退默认、数组去重。
      幂等保证：normalize(normalize(p)) 与 normalize(p) 结果一致（迁移可重复执行） —— */
function normalizeLearnerProfile(p){var d=defaultLearnerProfile();if(!p||typeof p!=='object')return d;
 d.ageMode=(p.ageMode==='youth')?'youth':'standard';
 d.learningTrack=(p.learningTrack==='foundation')?'foundation':'beginner';
 d.role='learner';/* P1-02 阶段一固定 learner；guardian 待监护人中心开发时经 schema 升级开放 */
 d.onboardingCompleted=p.onboardingCompleted===true;
 d.assessmentCompleted=p.assessmentCompleted===true;
 d.declaredBasis=(p.declaredBasis==='none'||p.declaredBasis==='some')?p.declaredBasis:null;
 if(p.assessment&&typeof p.assessment==='object'){for(var k in d.assessment){var v=p.assessment[k];d.assessment[k]=(typeof v==='number'&&isFinite(v))?Math.max(0,Math.min(100,Math.round(v))):0;}}
 d.recommendedTrack=(p.recommendedTrack==='foundation')?'foundation':'beginner';
 d.confirmedTrack=(p.confirmedTrack==='foundation'||p.confirmedTrack==='beginner')?p.confirmedTrack:null;
 d.unlockedByAssessment=Array.isArray(p.unlockedByAssessment)?p.unlockedByAssessment.filter(function(x,i,arr){return typeof x==='string'&&arr.indexOf(x)===i;}):[];
 d.passedWorldTrials=Array.isArray(p.passedWorldTrials)?p.passedWorldTrials.filter(function(x,i,arr){return typeof x==='string'&&arr.indexOf(x)===i;}):[];
 d.createdAt=(typeof p.createdAt==='number'&&isFinite(p.createdAt))?p.createdAt:null;
 d.updatedAt=(typeof p.updatedAt==='number'&&isFinite(p.updatedAt))?p.updatedAt:null;
 return d;}
/* —— 学习路线配置：只控制解锁策略，不复制、不修改任何关卡本体 —— */
var LearningTracks={
 beginner:{id:'beginner',name:'零基础成长线',description:'从终端、代码逻辑开始，逐步完成 Agent 与工作流搭建。',unlockMode:'sequential',allowWorldTrial:false,defaultStartLevel:'ai_camp_1'},
 foundation:{id:'foundation',name:'有基础挑战线',description:'通过能力判断和世界试炼，减少重复学习，进入更高强度任务。',unlockMode:'assessment_and_trial',allowWorldTrial:true,defaultStartLevel:'ai_camp_1'}
};
function getActiveTrack(){var p=State.learnerProfile;var id=(p&&(p.confirmedTrack||p.learningTrack))||'beginner';return LearningTracks[id]||LearningTracks.beginner;}
function hasAnyLevelProgress(){for(var id in LevelData){if(State.levels[id]&&State.levels[id].completed)return true;}return State.xp>0;}
/* —— 预留接口：世界试炼解锁通道（阶段一恒为 false，不改变任何现有解锁行为）——
      放行条件必须同时满足：①当前路线允许试炼（foundation） ②关卡 id 在 unlockedByAssessment 中
      ③该关所属世界的试炼已通过（passedWorldTrials 含 'trial_'+world）。
      阶段一没有任何代码会写入这两个数组（世界试炼关卡尚未制作），因此本通道放行不了任何关卡；
      它只是给后续阶段留好的、走统一解锁函数的正规接口——不是隐藏后门。 —— */
var WORLD_TRIALS_ENABLED=false;/* P1-03 阶段一总闸门：世界试炼通道强制关闭。阶段二完成试炼关卡、写入逻辑和验收后才允许打开 */
function _trackTrialUnlockOk(id){if(!WORLD_TRIALS_ENABLED)return false;var p=State.learnerProfile;if(!p)return false;var tr=getActiveTrack();if(!tr.allowWorldTrial)return false;if(p.unlockedByAssessment.indexOf(id)<0)return false;var lv=LevelData[id];if(!lv)return false;return p.passedWorldTrials.indexOf('trial_'+lv.world)>=0;}
/* —— 简版能力判断题库：8 题 / 5 维（terminal×2 codeReading×2 debugging×1 agentConcepts×2 workflow×1）
      每题 dim=能力标签；选项 s=该题得分（正确=100，错误=0）。维度分=该维各题得分平均值。
      全部为客观知识题——推荐只看答题得分，与用户自选“零基础/有基础”无关。 —— */
var AssessmentQuestions=[
 {id:'q1',dim:'terminal',q:'电脑里有个文件的完整路径是：D盘 → projects → demo → report.txt。请问 report.txt 直接躺在哪个文件夹里？',opts:[{t:'projects 文件夹',s:0},{t:'demo 文件夹',s:100},{t:'D 盘最外层',s:0},{t:'看不出来',s:0}]},
 {id:'q2',dim:'terminal',q:'在终端（命令行黑窗口）里，想知道「我现在正待在哪个文件夹」，最接近的做法是？',opts:[{t:'输入一条「查询当前位置」的命令（比如 pwd）',s:100},{t:'用鼠标在桌面上找一找',s:0},{t:'把终端重启一遍就能看到',s:0},{t:'终端做不到这件事',s:0}]},
 {id:'q3',dim:'codeReading',q:'按顺序读这份任务清单：让 价格 = 10；让 数量 = 3；在屏幕上显示 价格 × 数量。屏幕最后会显示什么？',opts:[{t:'103',s:0},{t:'13',s:0},{t:'30',s:100},{t:'会报错',s:0}]},
 {id:'q4',dim:'codeReading',q:'规则是：如果 余额 大于 100，显示「可以购买」；否则显示「余额不足」。当 余额 = 80 时，屏幕显示什么？',opts:[{t:'可以购买',s:0},{t:'余额不足',s:100},{t:'两句都显示',s:0},{t:'什么都不显示',s:0}]},
 {id:'q5',dim:'debugging',q:'运行程序时弹出报错：File not found（文件未找到）。最合理的第一步是？',opts:[{t:'马上重装系统',s:0},{t:'检查文件路径和文件名有没有写错',s:100},{t:'把报错窗口关掉继续跑',s:0},{t:'换一台电脑再试',s:0}]},
 {id:'q6',dim:'agentConcepts',q:'聊天机器人（Chatbot）和智能体（Agent）最关键的区别是？',opts:[{t:'Agent 说话更礼貌',s:0},{t:'Agent 能调用工具真正动手执行任务，Chatbot 主要停留在对话',s:100},{t:'两者没有区别',s:0},{t:'Chatbot 比 Agent 更聪明',s:0}]},
 {id:'q7',dim:'agentConcepts',q:'你让 Agent 帮忙整理了一批文件，它回复「已完成」。你最应该做的是？',opts:[{t:'直接相信，不用看',s:0},{t:'抽查验收结果，确认符合要求再算完成',s:100},{t:'立刻让它原样再做一遍',s:0},{t:'把 Agent 关掉',s:0}]},
 {id:'q8',dim:'workflow',q:'要搭一条「自动生成周报」的工作流，有三步：A 排版美化 / B 收集本周数据 / C 生成文字总结。合理的执行顺序是？',opts:[{t:'B → C → A',s:100},{t:'A → B → C',s:0},{t:'C → A → B',s:0},{t:'顺序无所谓',s:0}]}
];
/* —— 五维打分：answers[i]=第 i 题所选选项下标；返回 {terminal,codeReading,debugging,agentConcepts,workflow}（各 0-100） —— */
function computeAssessmentScores(answers){var dims={terminal:[],codeReading:[],debugging:[],agentConcepts:[],workflow:[]};AssessmentQuestions.forEach(function(q,i){var oi=answers&&answers[i];var sc=(q.opts[oi]&&typeof q.opts[oi].s==='number')?q.opts[oi].s:0;dims[q.dim].push(sc);});var out={};Object.keys(dims).forEach(function(k){var a=dims[k],s=0;a.forEach(function(x){s+=x;});out[k]=a.length?Math.round(s/a.length):0;});return out;}
/* —— 路线推荐（集中管理，禁止散落在点击事件里）——
      规则：技术均分 = (terminal+codeReading+debugging)/3；Agent认知均分 = (agentConcepts+workflow)/2
            技术均分 >= 60 且 Agent认知均分 >= 30 → foundation（有基础挑战线）
            否则 → beginner（零基础成长线）
      说明：只依据客观答题得分，绝不依据用户自选的基础情况；推荐 ≠ 永久锁定，用户可改选/重测。 —— */
function recommendLearningTrack(assessment){var a=assessment||{};var technicalAverage=((a.terminal||0)+(a.codeReading||0)+(a.debugging||0))/3;var agentAverage=((a.agentConcepts||0)+(a.workflow||0))/2;if(technicalAverage>=60&&agentAverage>=30){return 'foundation';}return 'beginner';}
/* —— 动画/素材事件钩子（阶段一仅预留：全部空实现，不影响功能；后续接动画时填充即可） —— */
var OnboardHooks={onEnterStep:null,onAnswer:null,onResult:null,onConfirmTrack:null};
var SCHEMA_VERSION=3;/* 存档版本 v3：新增 learnerProfile（分层学习系统 阶段一）；v2 及更早旧档由 migrateSaveData 无损迁移 */
var State={
  currentLevel:'ai_camp_1',
  levels:{},
  xp:0,totalStars:0,achievements:[],peipeiFound:false,learnerProfile:defaultLearnerProfile(),schemaVersion:SCHEMA_VERSION,
  save(){try{localStorage.setItem('agent_village_d',JSON.stringify({schemaVersion:SCHEMA_VERSION,currentLevel:this.currentLevel,levels:this.levels,xp:this.xp,totalStars:this.totalStars,achievements:this.achievements,peipeiFound:this.peipeiFound,learnerProfile:this.learnerProfile}))}catch(e){}},
  load(){try{var r=localStorage.getItem('agent_village_d');if(!r){if(typeof _refreshUnlockedFlags==='function')_refreshUnlockedFlags();return;}var d=JSON.parse(r);d=migrateSaveData(d);this.currentLevel=d.currentLevel||this.currentLevel;this.xp=d.xp||0;this.totalStars=d.totalStars||0;this.achievements=d.achievements||[];this.peipeiFound=d.peipeiFound||false;this.learnerProfile=normalizeLearnerProfile(d.learnerProfile);if(d.levels)for(var k in d.levels){if(this.levels[k])this.levels[k]=d.levels[k]}this.schemaVersion=SCHEMA_VERSION;if(typeof _refreshUnlockedFlags==='function')_refreshUnlockedFlags();if(typeof _validateCurrentLevel==='function')_validateCurrentLevel();this.save();}catch(e){}}
};
var TEST_MODE=true;/* 测试模式:所有关可点+答错也能跳下一关。正式发布改 false */
 var BUILD_TAG='开发测试版';/* 版本标识 */
var WORLDS={
  ai_camp:{name:'AI 启蒙营',bg:'B01',boss:'D01',cert:{id:'ai_camp_complete',name:'AI 认知入门',world:'AI 启蒙营',tag:'E01'},levels:['ai_camp_1','ai_camp_2','ai_camp_3','ai_camp_4','ai_camp_5','ai_camp_6','ai_camp_7','ai_camp_8','ai_camp_9','ai_camp_10','ai_camp_11']},

var LevelData={
  'ai_camp_1':{world:'ai_camp',n:1,a:'01',boss:false,type:'core',optional:false,title:'AI 是什么，不是什么',goal:'认识 AI',xp:100,content:{
    flow:[
      {talk:'先搞清楚它到底是不是个人|你肯定听人吹过 AI 多神，甚至有人说它快成精了。可它到底是个啥，是不是像电影里那种有自我意识、会思考的机器人？我先把话撂这儿：<strong>都不是。它是个读了海量文字、特别会顺着话往下接的家伙。</strong>这一关咱们不整虚的，边讲边试，把它的老底彻底掀开。'},
      {talk:'① 它干活的样子，你其实天天都见|你手机打字，打「我今天」，输入法立马蹦出「很忙」「上班」「不太舒服」让你选——它在猜你下一个想打的词。<strong>AI 干的就是这件事，只是超级加强版</strong>：它不光猜一个词，还能一个接一个往下接，接出一整句、一整段、甚至一整篇。'},
      {try:{q:'我发「今天天气真＿＿」，你猜 AI 最可能接哪个？',opts:[{t:'不错',ok:true},{t:'香蕉',ok:false},{t:'生气',ok:false}],fb:'再想想——日常这句话后面，大伙儿几乎不过脑子就顺口接啥？'}},
      {talk:'② 它凭啥能接得这么准|因为它读过的东西多到你想象不到——差不多把整个互联网的文字、几亿本书、无数人的聊天都过了一遍。读多了它就摸透一件事：<strong>什么话后面，一般跟着什么话</strong>。所以你让它写句春节祝福、写个请假条，它唰一下给你一堆——不是它懂这些事，是这类话它见得实在太多了。'},
      {talk:'③ 但关键来了——它其实并不懂|它接「天气真不错」的时候，根本不知道「天气」是什么、「热」是什么感觉、「不错」是种什么心情。它只是在飞快地算一件事：这个词后面，接哪个词的概率最高。<strong>说白了，它是个读书破亿、特别会接话的话搭子，不是一个真正理解世界的人。</strong>'},
      {talk:'④ 一个会让你恍然大悟的例子|你可能听过，有时候问 AI「9.11 和 9.9 哪个大」，它居然会答错。为啥？因为它压根不是在算数，是在猜——它见过太多 9.11 这种版本号、日期、新闻，顺着印象就猜歪了。这件小事最能说明问题：<strong>它是在接话、找规律，不是在动脑子算。</strong>（记住这个，后面讲它为啥会一本正经胡说，就全通了。）'},
      {try:{q:'那你觉得，AI 真的「知道」天气热是什么感觉吗？',opts:[{t:'知道，它啥都懂',ok:false},{t:'不知道，它只是会接话',ok:true}],fb:'回头看③④——它只是在算词、找规律，没有真正的感受和理解哦。'}},
      {talk:'⑤ 破除一个最常见的大误会|很多人以为 AI 像一本活的百科全书：存好标准答案，你一问它一查就给你。<strong>那可差远了。</strong>它更像一个见多识广、张口就来的人——答案是它当场顺出来的，不是查出来的。这就是为啥它偶尔会特别自信地编瞎话：它本来就是在接话，接得顺不等于接得对。'},
      {talk:'⑥ 那这跟你到底有啥关系|关系大了。同一个 AI，有人用得神、有人用得废，差别就在这一点上：<br>· 会用的人，拿它当超级熟练的助手——让它干擅长的（写东西、改文字、出点子、陪你想），关键的数字和事实自己再核一遍；<br>· 不会用的人，拿它当万能真理机，它一胡说就被带沟里。'},
      {try:{q:'下面哪种用法更聪明？',opts:[{t:'问 AI「我这病该吃啥药」，然后直接照它说的吃',ok:false},{t:'让 AI 帮我把一段话改得更通顺、更好听',ok:true}],fb:'想想「信熟练、别信权威」——改文字是它的熟练活；吃药这种人命关天的，得信医生。'}},
      {try:{q:'最后总结一下：哪句最贴近 AI 真实的干活方式？',opts:[{t:'它像真人，有自己的想法和情绪',ok:false},{t:'它像个会接话的高手，看着上文猜下一个词',ok:true},{t:'它像个数据库，存了标准答案一问就查',ok:false}],fb:'结合前面①到⑥想想：它是猜、接出来的，不是查、懂出来的。'}}
    ],
    aha:{goal:'把这一关的老底记牢',text:'<strong>原来 AI 不是懂，是猜得准。</strong>从今往后你每次打开 AI，心里都可以默念一句：它是在猜得准，不是真的懂。就这一句，你已经甩开大多数以为 AI 无所不知的人一大截了。<br>而且你现在还顺手明白了它为啥会算错数、为啥会一本正经胡说——这些后面都会细讲。<br>下一关：把你天天听的那些名字——ChatGPT、DeepSeek、豆包、文心——到底都是啥，一次性理清楚。'}
  }},
  'ai_camp_2':{world:'ai_camp',n:2,a:'20',boss:false,type:'core',optional:false,title:'你天天听的 AI 都是啥',goal:'认识大模型',xp:100,content:{

      {talk:'① 它们其实是一类东西|这一堆名字，其实都是同一类东西，有个统称叫「大模型」。说白了，就是上一关讲的那种读了海量文字、特别会接话的家伙——只是不同公司各自训了一个，起了不同名字。'},

      {talk:'② 打个你熟悉的比方|就像手机：华为、小米、苹果，牌子不同、样子不同，但本质都是手机，都能打电话、上网、拍照。这些 AI 也一样——牌子不同，本质都是「大模型」。'},
      {talk:'③ 那它们到底有没有区别|有，就像不同牌子手机各有脾气：有的写代码厉害、有的聊天有趣、有的中文特别溜、有的能实时联网查资料。但这些只是口味差异，不影响它们是同一类。'},
      {try:{q:'那不同的 AI 之间，是什么关系？',opts:[{t:'完全一样，随便用哪个都行',ok:false},{t:'本质一类，但各有各的擅长',ok:true},{t:'越贵的才是真 AI',ok:false}],fb:'像手机——都是手机，但各有各的强项。'}},
      {talk:'④ 所以你该怎么办|一句话：别被这一堆名字唬住。它们都是「大模型」这一类，挑个顺手的往死里用就行。国内像豆包、DeepSeek、Kimi、文心，都能免费上手。'},

  'ai_camp_3':{world:'ai_camp',n:3,a:'21',boss:false,type:'core',optional:false,title:'AI 的十八般武艺',goal:'认识多模态',xp:100,content:{
    flow:[
      {talk:'见识一下它的真本事|上一关结尾我卖了个关子：大模型不只会打字聊天。这关就带你见识它的十八般武艺。'},
      {talk:'① 很多人的误会|不少人以为 AI 就是个聊天框，只会跟你打字唠嗑。其实它早就不止这一样了。'},
      {talk:'② 它还会啥|你给它一张图，它能看懂里面是啥（看图）；你说句话，它能画出来（画图）；你说话它能听、还能配音（语音）；甚至给几句话，它能生成一段视频。这些本事合起来有个词叫「多模态」——就是能处理多种形式，不只文字。'},
      {try:{q:'「AI 只能陪你打字聊天，别的干不了」——这话对吗？',opts:[{t:'对，它就是个聊天机器人',ok:false},{t:'错，它还能看图、画图、语音、视频',ok:true},{t:'只有付费版才能聊天',ok:false}],fb:'你自己是不是都用 AI 生过图了？它早不止会打字。'}},
      {talk:'③ 这对你意味着啥|意味着你以后遇到事，可以先想一句：这事有没有 AI 能帮我？想写东西、想做图、想把文章读成语音、想剪个小视频……多半都有对应的 AI 能上手。'},
      {try:{q:'你想把一篇文章变成一段配音，该找哪种 AI？',opts:[{t:'只会打字的聊天 AI',ok:false},{t:'带语音（能配音）本事的 AI',ok:true},{t:'AI 干不了这个',ok:false}],fb:'对应需求找对应本事——要配音就找会语音的。'}},
      {talk:'④ 一个提醒|这些本事不一定都在同一个 AI 里。有的专门画图、有的专门做视频，就像工具箱里不同的工具，用哪样找哪样。'},
      {try:{q:'遇到一个新任务，聪明的第一反应是？',opts:[{t:'觉得 AI 肯定干不了',ok:false},{t:'先想一句"有没有 AI 能帮我做这个"',ok:true},{t:'只拿它聊天',ok:false}],fb:'AI 是多面手，先想想有没有对应的本事。'}}
    ],
    aha:{goal:'遇事先想有没有 AI 能帮',text:'<strong>原来 AI 会的远不止聊天——看图、画图、语音、视频，样样来。</strong>以后想干啥，先问一句"有没有 AI 能帮我"，多半有。<br>下一关：想让 AI 干得好，一半功夫在你怎么开口——也就是「Prompt」。'}
  }},
  'ai_camp_4':{world:'ai_camp',n:4,a:'02',boss:false,type:'core',optional:false,title:'Prompt 是什么',goal:'学会写清楚的 Prompt',xp:100,content:{
    flow:[
      {talk:'学会把话说到点子上|上一关结尾说了：AI 干得好不好，一半看你怎么开口。这关就教你把话说到点子上。'},
      {talk:'① 一个扎心的真相|你跟 AI 说"帮我写点东西"，它八成给你一坨你不想要的。不是它笨——是你没说清楚。你给它的那句要求，有个名字叫「Prompt」（提示词）。'},
      {talk:'② 烂 Prompt 长啥样|比如"写篇作文""帮我写点关于狗的"——太笼统了，它只能瞎猜：写谁？多长？啥风格？给谁看？它全不知道，只能随便给你。'},
      {try:{q:'下面哪个是"好 Prompt"？',opts:[{t:'写篇作文',ok:false},{t:'帮我写点关于狗的',ok:false},{t:'你是宠物博主，写一条 50 字朋友圈，夸我家金毛乖巧爱吃',ok:true}],fb:'好 Prompt 要说清"让它当谁、干啥、要啥"。'}},
      {talk:'③ 好 Prompt 的诀窍|说清这几样，它就干得准：① <strong>目标</strong>（要达成啥）② <strong>背景/材料</strong>（给它啥信息）③ <strong>限制</strong>（别做啥、多长、啥范围）④ <strong>输出格式</strong>（要成什么样）⑤ <strong>验收标准</strong>（怎样算做好了）；需要它给依据时，再加⑥ <strong>证据要求</strong>（说清来源）。让它「当谁」（角色）是可选加分项、不再是第一位。比如"你是宠物博主，写一条 50 字朋友圈，夸我家金毛乖、爱吃"——角色、任务、字数、重点全齐了，它就干得准。'},
      {try:{q:'"帮我写个通知"想变成好 Prompt，最该补上啥？',opts:[{t:'啥都不用补',ok:false},{t:'补上"什么通知、给谁看、多长、什么语气"',ok:true},{t:'多说几遍"写好点"',ok:false}],fb:'说清目标和要求——什么通知、给谁看、多长、啥语气，AI 才不用猜。'}},
      {talk:'④ 为啥这事对你特别重要|因为同一个 AI，你会不会说清楚话，结果天差地别。这也是为啥有人用 AI 用得神、有人用得废——差的往往不是 AI，是 Prompt。这本事你以后指挥任何 AI 工具都用得上。'},
      {try:{q:'同一个 AI，有人用得神有人用得废，最关键的差别常常是？',opts:[{t:'谁的电脑好',ok:false},{t:'谁更会把要求说清楚（Prompt）',ok:true},{t:'谁充了钱',ok:false}],fb:'一半功夫在"你怎么开口"。'}}
    ],
    aha:{goal:'把要求说完整',text:'<strong>原来 AI 干得好不好，一半靠你会不会说清楚话。</strong>记住这套：说清目标、背景、限制、输出格式、验收标准（要依据时再加证据要求）；角色是可选加分项。<br>下一关：AI 还有个特别的"记性"，你得摸透它，不然它老是答非所问。'}
  }},
  'ai_camp_5':{world:'ai_camp',n:5,a:'03',boss:false,type:'core',optional:false,title:'上下文为什么重要',goal:'理解上下文',xp:100,content:{
    flow:[
      {talk:'摸透 AI 的记性|上一关结尾提到 AI 有个特别的"记性"。这关讲清楚——搞懂它，AI 就不会老答非所问了。'},
      {talk:'① 一个常见的懵|你劈头问 AI"它多高？"，它一脸懵："谁啊？"。不是它笨——是你没告诉它"它"指谁。'},
      {talk:'② AI 的记性是啥|AI 主要记住的，是你这次对话里说过的话，这有个名字叫「上下文」。（有些产品还能读你给的文件、记住你的偏好、连外部资料，看产品能力而定。）你说过的它才记得，你没说的它不知道，也不会猜你心里想啥。'},
      {try:{q:'你直接问 AI"它多高"，它答不上来，最可能因为？',opts:[{t:'AI 坏了',ok:false},{t:'你没说"它"指谁，缺了背景',ok:true},{t:'AI 不想理你',ok:false}],fb:'它只看你这次说过的话，缺了背景就抓瞎。'}},
      {talk:'③ 打个比方|就像你跟一个刚认识、啥都不知道的人聊天——你得先把背景交代清楚，他才接得上。AI 也一样，它不会读心。'},
      {talk:'④ 那正确的问法|把背景一次说清："姚明身高多少？"——它立马答得上；或者接着上文："我刚说的姚明，他多高？"——因为上下文里有姚明，它就懂了。'},
      {try:{q:'想让 AI 答得准，下面哪种做法对？',opts:[{t:'问得越短越好，背景它自己会猜',ok:false},{t:'把它需要的背景在对话里说清楚',ok:true},{t:'反复问同一句',ok:false}],fb:'它不读心，把背景给全，它才聪明。'}},
      {talk:'⑤ 这是指挥 AI 的基本功|"把背景交代清楚"听着简单，却是你以后指挥任何 AI、任何 Agent 的基本功。信息给全，它就聪明；给漏了，它就抓瞎。'},
      {try:{q:'AI 突然答非所问，你第一反应该是？',opts:[{t:'骂它笨',ok:false},{t:'回头看看是不是自己漏说了关键背景',ok:true},{t:'关掉不用了',ok:false}],fb:'多半是背景没给全——补上就好。'}}
    ],
    aha:{goal:'给全背景它才聪明',text:'<strong>原来 AI 的"记性"，就是你这次对话里给过的信息（上下文）。</strong>给全了它聪明，给漏了它抓瞎。<br>下一关：它靠猜、靠你给的信息——那它会不会一本正经地骗你？（还记得第 1 关那个 9.11 的例子吗？）'}
  }},
  'ai_camp_6':{world:'ai_camp',n:6,a:'04',boss:false,type:'core',optional:false,title:'AI 为什么会出错',goal:'理解 AI 幻觉',xp:100,content:{
    flow:[
      {talk:'先给你打个预防针|上一关你学会了把背景给全，AI 就聪明了。但这一关得先泼盆冷水——<strong>就算背景给全，AI 有时还是会一本正经地骗你</strong>。搞懂它为啥这样、你该咋办，你就比一大半人会用 AI 了。'},
      {talk:'① 它几乎不说「我不知道」|你问 AI 一件它其实不知道的事，它<strong>不会</strong>老实说「我不知道」——反而当场<strong>编一个像模像样的答案</strong>塞给你，语气还特别自信。这个「一本正经地瞎编」，有个专门的名字，叫<strong>「幻觉」</strong>。'},
      {talk:'② 它为啥要编|还记得第 1 关吗？AI 干的事，本质是<strong>「猜下一个词」</strong>。它没把握的时候，<strong>照样猜，还猜得理直气壮</strong>。它不是存心骗你——是它「不知道自己不知道」，自己都以为猜的是对的。'},
      {try:{q:'AI 编出一个假答案，最根本的原因是？',opts:[{t:'它故意骗你、想害你',ok:false},{t:'它靠「猜」，没把握时也照猜，还不知道自己在猜',ok:true},{t:'你网络不好，把答案传错了',ok:false}],fb:'它不是存心骗——是「猜下一个词」的机制决定的，猜错了它自己都不知道。'}},
      {talk:'③ 哪种答案最容易是编的|闲聊、写文案这种「没有标准答案」的，编了也无所谓。<strong>真正要小心的是三样——数字、名字、日期</strong>。比如「某公司去年营收多少」「这本书作者是谁」「这条法律哪年颁布」，AI 张口就来，<strong>但很可能是错的</strong>。'},
      {talk:'④ 那你该怎么办|办法就一句话：<strong>它说的别照单全收，尤其数字、名字、日期，自己核一遍</strong>。查一下、搜一下、对一下原始资料。花不了一分钟，能帮你躲开大坑。'},
      {try:{q:'下面哪种 AI 回答，你最该停下来核一核？',opts:[{t:'帮我把这句话改得通顺一点',ok:false},{t:'「这款药成人用量是每天 3 次、每次 2 片」',ok:true},{t:'帮我想三个短视频标题',ok:false}],fb:'涉及具体数字、剂量、事实的，错了后果最大，必须自己核；改文案、起标题错了无所谓。'}},
      {talk:'⑤ 这恰恰是你的本事|会用 AI 的人和「闭眼信 AI」的人，差距就在这。<strong>你永远是最后把关的那个人</strong>——AI 出草稿，你来验收。懂得「它会自信地猜错、所以我得核一遍」，你就已经赢了一大半人。'},
      {try:{q:'AI 给了个看起来很专业、很肯定的答案，你该？',opts:[{t:'它这么肯定，直接拿来用',ok:false},{t:'关键信息（数字/名字/出处）自己核一遍再用',ok:true},{t:'我不懂，只能信它',ok:false}],fb:'猜得肯定 ≠ 猜得对，关键信息你来把最后一道关。'}}
    ],
    aha:{goal:'明白你比「只会用 AI 的人」强在哪',text:'<strong>AI 会自信地猜错，这叫幻觉——尤其数字、名字、日期。</strong><br>所以你永远是最后把关的人，这恰恰是你比「闭眼信 AI」的人强的地方。<br>下一关：AI 还有个「软肋」你得知道——它的知识有「保质期」。'}
  }},
  'ai_camp_7':{world:'ai_camp',n:7,a:'22',boss:false,type:'core',optional:false,title:'AI 的知识有"保质期"',goal:'理解知识截止',xp:100,content:{
    flow:[
      {talk:'先搞清楚它为啥答不上最新的事|上一关你学会了防"幻觉"——AI 会自信地猜错。这关再补一个坑：<strong>有时候它不是猜错，是压根不知道</strong>——因为它学的资料有"保质期"。'},
      {talk:'① 它的知识从哪来|AI 的本事来自"学过的资料"——网上搜来的文章、代码、书。但你想想，<strong>这些资料是过去某个时间点之前收集的</strong>，那之后的事它没学过，自然不知道。'},
      {talk:'② 打个比方：图书馆|想象你进了一座巨大的图书馆，里面有全世界的书——但<strong>门上有块牌子写"更新到某年某月（不同 AI 各不相同）"</strong>。书里没写的，图书管理员一个字也答不出。AI 就是这个管理员。'},
      {try:{q:'你问 AI"昨天出了啥新闻"，它答不上来，最可能是因为？',opts:[{t:'AI 坏了，帮我重启一下',ok:false},{t:'它学的资料是过去的、昨天的事没进资料库',ok:true},{t:'我问的方式不对',ok:false}],fb:'AI 不是实时全知的，它靠的是学过的旧资料——新发生的事不在资料库里。'}},
      {talk:'③ 问最新的事该怎么办|两招。一招：<strong>用带"联网搜索"的 AI</strong>——它会临时上网查新的。二招：<strong>自己对关键最新信息核一遍</strong>。哪招方便用哪招。'},
      {talk:'④ 但也别怕——大部分事它知道|日常用 AI 写文案、改简历、问概念、翻译——这些不需要"最新"的信息，它的知识库足够。只有问<strong>刚发生的新闻、刚发布的政策、刚更新的数据</strong>，你才需要多想一步。'},
      {try:{q:'下面哪个问题最该多留个心眼？',opts:[{t:'"帮我翻译这段英文"',ok:false},{t:'"帮我优化这段简历"',ok:false},{t:'"上个月新出的那个手机，参数是多少"',ok:true}],fb:'最新发布的手机参数没在它的资料库里——要么联网搜索，要么自己查官方。'}},
      {talk:'⑤ 这是你的第二道防线|第一道防线是防幻觉（数字/名字/日期自己核），第二道防线是<strong>防过时</strong>（最新的事自己去搜）。两层加一起，你就不太会被 AI 坑了。'},
      {try:{q:'AI 答了一个看起来靠谱、但你隐约觉得"这不对吧"的答案，最该做的是？',opts:[{t:'算了，反正我看着像对的',ok:false},{t:'自己去查一下原始来源、核对数字和日期',ok:true},{t:'换个问题问 AI',ok:false}],fb:'有了"保质期"和"幻觉"两把尺子——数字/名字/日期自己查，最新的信息也别全信 AI。'}}
    ],
    aha:{goal:'明白 AI 的"时间边界"在哪',text:'<strong>AI 靠学过的资料干活，它的"保质期"是个时间边界</strong>——边界之前的事它懂，之后的事它不一定知道。<br>问最新的事，去搜原资料；问日常的，放心让它干。<br>下一关：用得好好的 AI 突然弹报错——又是咋回事？'}
  }},
  'ai_camp_8':{world:'ai_camp',n:8,a:'23',boss:false,type:'core',optional:false,title:'AI 突然罢工了，咋回事',goal:'看懂报错',xp:100,content:{
    flow:[
      {talk:'先给你吃颗定心丸|用得好好的 AI 突然弹红字、或者转圈不动、或者"服务器繁忙"——<strong>先别慌，十有八九不关你事，真不是你把它弄坏了。</strong>'},
      {talk:'① 最常见的两种|🌐 <strong>你网卡了/断了</strong>——AI 在云端，连不上就报错。检查 WiFi 或流量。<br>🕐 <strong>用的人太多了</strong>——"服务器繁忙，请稍后再试"，是它那边排队的人太多。等你一会儿再试就好。'},
      {try:{q:'弹出"服务器繁忙，请稍后再试"，先做啥？',opts:[{t:'慌了、以为把 AI 弄坏了',ok:false},{t:'等一小会儿再重试（它那边人太多）',ok:true},{t:'把电脑重装一遍',ok:false}],fb:'服务器繁忙=它那边忙，跟你没关系。等一会儿再试。'}},
      {talk:'② 还有这几种|📊 <strong>免费额度用完了</strong>——等你刷新免费额度或充值。<br>📏 <strong>你发的太长了</strong>——超过了它一次能处理的量，说短点就行。<br>🚫 <strong>问的踩了红线</strong>——敏感内容被自动拦了。换个问法或换个问题。'},
      {talk:'③ 一张"对号入座"图|拿到报错，先判断是哪种——对上网的、对太忙的、对额度的、对太长的、对红线的——对上了就基本能自己搞定。'},
      {try:{q:'AI 报错说"您的输入太长"，最该做的是？',opts:[{t:'反复重试，希望能过',ok:false},{t:'把话拆成几段发，一次说短点',ok:true},{t:'换一个更贵的 AI',ok:false}],fb:'超过处理量就拆短——这是最简单的。'}},
      {talk:'④ 心态才是关键|不会用 AI 的人一报错就懵，觉得"完了我不会"。<strong>会用 AI 的人一报错就对号入座——网卡了、太忙了、额度没了、说长了、踩红线了</strong>——基本都能自己弄好。你学完这一关，你就是第二种。'},
      {talk:'⑤ 真搞不定怎么办|很少有你真搞不定的——但也试试：关掉重开、等半小时再试、换个 AI（比如 ChatGPT 卡了就试试 DeepSeek）。'},{try:{q:'你试了几种办法都还没恢复，最聪明的做法是？',opts:[{t:'气得摔键盘',ok:false},{t:'换个 AI 试试，或者等会儿再来',ok:true},{t:'从此不用 AI 了',ok:false}],fb:'AI 又不是只有一家——换一个试试，或者等它恢复。别跟机器置气。'}}
    ],
    aha:{goal:'下次报错你不会慌了',text:'<strong>报错大多是"网络、太忙、额度、太长、踩红线"这几种，基本不是你的错，还大多能自己搞定。</strong><br>会用 AI 的人和一报错就懵的人，差的就是这个。<br>下一关：用 AI 有个底线绝对不能碰——有些东西别喂给它。'}
  }},
  'ai_camp_9':{world:'ai_camp',n:9,a:'24',boss:false,type:'core',optional:false,title:'别把这些喂给 AI',goal:'隐私安全',xp:100,content:{
    flow:[
      {talk:'先立个规矩|AI 好用，但有件事千万别干——<strong>把银行卡号、密码、身份证、公司还没公开的机密原样发给它</strong>。这些话可能被存下来（不同产品、套餐、设置的处理方式不同）、甚至哪天被别人看到。'},
      {talk:'① 什么绝对不能发|💰 银行卡号、密码、验证码 → 钱可能没了<br>🆔 身份证号、家庭住址、手机号全套 → 身份可能被盗<br>🏢 公司没公开的财报、还在保密期的方案 → 泄密<br>判断标准就一句话：<strong>这信息泄露了会不会出事？会出事的就别发。</strong>'},
      {try:{q:'下面哪个可以放心发给 AI？',opts:[{t:'我的银行卡号和密码',ok:false},{t:'帮我改一段不含敏感信息的产品文案',ok:true},{t:'公司还没公开的财务数据',ok:false}],fb:'不含敏感信息的，随便发；钱、密码、机密——别发。'}},
      {talk:'② 但我确实需要 AI 处理这些咋办|抹掉敏感部分再发——真名换成"张三"，卡号只留后四位（****1234），地址只写到城市。把"要害"抹掉，AI 照样能干别的活。'},
      {talk:'③ 这不是教你防 AI（AI 不坏），是教你别大意|AI 不坏，是你发过去的信息<strong>可能被存下来、被训练、传输中被别人看到</strong>。你是在公共场合跟它说话——别把家门钥匙放桌上。'},
      {try:{q:'你需要让 AI 帮忙处理一份名单（含姓名+身份证号+手机号），最安全的做法是？',opts:[{t:'原样全发给它',ok:false},{t:'先把身份证号和手机号打码抹掉，再发处理后的',ok:true},{t:'把 AI 离线了再用',ok:false}],fb:'打码！把要害信息抹了，剩下的让它处理。'}},
      {talk:'④ 一个简单的自检习惯|每次发东西给 AI 前，花 2 秒扫一眼——"这里面有没有啥泄露了会出事的东西？"有就抹掉，没有就发。养成这个习惯，就能躲开绝大部分麻烦。'},
      {try:{q:'记住这一关的底线：发给 AI 的东西，最该担心什么？',opts:[{t:'AI 会嘲笑我的问题',ok:false},{t:'敏感信息可能被存下来、被训练、被看到',ok:true},{t:'AI 会变慢',ok:false}],fb:'AI 不是保险箱——泄露了会出事的，别原样喂给它。'}}
    ],
    aha:{goal:'记住一条能躲大麻烦的规矩',text:'<strong>敏感信息（钱、密码、身份证、机密）别原样发给 AI。</strong>养成发之前花 2 秒扫一眼的习惯。<br>这一条记住，能帮你躲开大麻烦。<br>下一关：反过来——怎么让 AI 更懂"你自己的东西"？'}
  }},
  'ai_camp_10':{world:'ai_camp',n:10,a:'25',boss:false,type:'core',optional:false,title:'让 AI 懂你的资料',goal:'投喂/知识库',xp:100,content:{
    flow:[
      {talk:'先搞清楚：AI 懂不懂"你自己的东西"|前面几关你知道了 AI 靠学的资料干活。但它学的都是<strong>公开的、大路货的知识</strong>——你公司的规章、你写的笔记、你的产品说明，它完全不知道。那咋办？'},
      {talk:'① 答案就一个：喂给它|把你的文档、资料、规定直接发给 AI（或上传），让它<strong>照着你的资料来回答</strong>，而不是靠它自己瞎编。喂了啥它就知道啥，没喂的还是不知道。'},
      {try:{q:'想让 AI 按你公司的退款政策回答客户，最靠谱的做法是？',opts:[{t:'直接问，指望它天生知道你们公司的事',ok:false},{t:'把退款政策文档喂给它，让它照着答',ok:true},{t:'换一个更贵的 AI',ok:false}],fb:'AI 不知道你家的事——喂给它它才有据可答。'}},
      {talk:'② 这就是"AI 知识库"|把一堆跟你有关系的资料（制度、产品手册、FAQ、你的个人笔记）一次性喂进去，AI 就从"什么都懂一点却不懂你"变成<strong>"专门懂你这摊事"</strong>。很多企业和个人都在用这招。'},
      {talk:'③ 不用搞很复杂|你把一段产品说明粘贴到对话框里说"照着这个回答"，就是在"投喂"。你放一个 PDF 让它读，也是"投喂"。<strong>关键不是工具多高级，是你有没有这个习惯——把自己的资料给 AI。</strong>'},
      {try:{q:'你想让 AI 帮你写一份项目周报，你准备了 3 份原始材料。哪种做法最好？',opts:[{t:'把 3 份材料一起发给 AI，告诉它照着写',ok:true},{t:'什么都不给，让 AI 凭空写',ok:false},{t:'发给 AI 一句"帮我写个周报"，让 AI 猜公司在干啥',ok:false}],fb:'把资料喂给它——AI 就从不靠谱的"瞎猜"变成靠谱的"有据可依"。'}},
      {talk:'④ 这招在工作里多值钱|同样的 AI，别人用是通用款，回答得"好像对"。你用是定制款——<strong>喂了自己公司、自己行业、自己产品的资料</strong>，答得又准又贴。这招是让你从"AI 用着还行"到"A 真好用"的那一步。'},
      {try:{q:'以下哪句最能总结这关的核心？',opts:[{t:'AI 越贵越懂你',ok:false},{t:'想让 AI 懂你的事，就把你的资料喂给它',ok:true},{t:'AI 天生就应该知道你的工作内容',ok:false}],fb:'它不知道你家的事，除非你告诉它。喂了资料它才有据可答——这招在工作里特别值钱。'}}
    ],
    aha:{goal:'明白这招能让你比九成人用得好',text:'<strong>想让 AI 懂"你自己的东西"，就把资料喂给它</strong>——它就从"什么都懂一点"变成"专门懂你这摊事"。<br>这招是 AI 用得好不好的分水岭。<br>下一关是 Boss 战——把学过的全部串起来！'}
  }},
  'ai_camp_11':{world:'ai_camp',n:11,a:'05',boss:true,type:'core',optional:false,title:'AI/工具/Agent/工作流',goal:'理解四者关系',xp:200,achievement:'ai_camp_complete',content:{
    flow:[
      {talk:'Boss 战来了——把这几个词彻底捋清|AI、工具、Agent、工作流——这四个词你整个新手村都在听，现在 Boss 战一次捋清。<strong>这不是背概念，是给你后面所有关卡画一张地图。</strong>'},
      {talk:'AI = 会思考的大脑 🧠|AI 只能"想"和"说"，<strong>动不了手</strong>。它能帮你写文案、分析数据、总结报告——但全在脑子里，碰不到现实世界。'},
      {talk:'工具 = 给 AI 配的手 🖐️|让 AI 能干"想"之外的事：查天气、搜网页、发邮件、算账、读文件。这些叫<strong>工具</strong>。给 AI 配了工具，就像给人配了手。'},
      {try:{q:'现在的聊天 AI（ChatGPT/DeepSeek）属于哪个？',opts:[{t:'有手有脑，啥都能自己干的 Agent',ok:false},{t:'只会想不会动手的 AI',ok:true},{t:'一条固定流水线',ok:false}],fb:'聊天 AI 纯属于"脑"——它只能想和说，你没给它配工具时，它连查天气都做不到。'}},
      {talk:'Agent = 大脑 + 手，能自己干活了 🤖|把 AI 这个"脑"+ 工具这双"手"合在一起，能<strong>自己想、自己动手、自己把事干完</strong>的，就叫<strong>Agent</strong>（智能体）。比如"帮我查明天北京的天气，如果有雨就邮件提醒我"——Agent 能自己查天气、自己判断要不要下雨、自己发邮件。全自动。'},
      {talk:'工作流 = 把 Agent 的步骤固定成流水线 🏗️|你发现"查天气→判断下雨→发提醒"这套步骤老要用。<strong>把它固定下来、每次自动跑</strong>——这条流水线就叫<strong>工作流</strong>。以后同类的话说一遍就行了。'},
      {try:{q:'从"能力从小到大"排个序，哪个对？',opts:[{t:'工作流 → Agent → AI',ok:false},{t:'AI（脑）→ 加工具（手）→ 合成 Agent → 串成工作流',ok:true},{t:'Agent → AI → 工具',ok:false}],fb:'先有脑（AI），给它手（工具），脑+手=Agent，再把 Agent 的活固定成流水线=工作流。'}},
      {talk:'你学完 AI 启蒙营，在哪一层？|你现在处于<strong>把 AI 当脑子用</strong>这一层——会问、会防坑、会用。后面黑窗口村教你<strong>怎么指挥电脑干活</strong>（这是"手"的基础）。一步一步往上走，最后你会自己能搭 Agent、能组工作流。'},
      {try:{q:'你现在学完启蒙营，最应该清楚的是？',opts:[{t:'我可以直接去造工作流了',ok:false},{t:'我在"脑子"层打好了基础，接下来要学"手"——怎么让 AI 真正动手干活',ok:true},{t:'启蒙营没什么用',ok:false}],fb:'你现在打好了"认知"的地基——知道 AI 是什么、怎么用、防什么坑。接下来黑窗口村，学真正动手。'}}
    ],
    aha:{goal:'🎓 恭喜——你拿到第一个认证了',text:'捋清了：<strong>AI 是脑，工具是手，Agent 是脑＋手能干活，工作流是把活固定成流水线。</strong><br>这就是你整个新手村的地图。<br>🎓 赢得认证：<strong>AI 认知入门</strong>！接下来去黑窗口村，学怎么真正指挥电脑干活。'}
  }},
  'w1_1':{world:'w1',n:1,a:'06',boss:false,type:'core',optional:false,title:'初识终端',goal:'看懂命令和回显的区别',xp:100,content:{
    flow:[
      {talk:'黑窗口不吓人|电影里黑客噼里啪啦敲的那个黑窗口，叫<strong>终端</strong>。说白了，它就是<strong>你跟电脑对话的聊天框</strong>——平时你用鼠标点图标，在这儿改成<strong>打字下命令</strong>。就这么点区别，一点都不神秘。'},
      {talk:'① 为啥要学？因为 Agent 就住这儿|你在 AI 启蒙营学过：给 AI 下清楚的指令它才干得对。命令是同一回事——<strong>命令，就是你下给电脑的、最精确的一句指令</strong>。以后你指挥 Agent 装软件、配服务器，它执行的每一步，底层都是在这个黑窗口里敲命令。你看懂命令，就看懂了 Agent 到底在替你干啥。'},
      {talk:'② 两条线：你敲的 vs 电脑回的|终端里永远有两类东西：<strong>你敲进去的命令</strong>（PS 村庄> 开头），和<strong>电脑返回的结果</strong>（没有 PS 村庄>）。别搞混——你要看的是电脑回了啥，这才是命令的「作用」。'},
      {talk:'③ 现在，敲第一条命令|你想知道自己在电脑里「站在哪」，电脑怎么回答你？试试看。'},
      {cmd:{mode:'session',initCwd:'C:/村庄/你家',fs:{"C:": {"\u6751\u5e84": {"\u4f60\u5bb6": {"\u7b14\u8bb0.txt": {"_type": "file", "_content": "\u4eca\u5929\u8981\u505a\u7684\u4e8b\uff1a\n1. \u5b66\u4f1a\u7ec8\u7aef\u547d\u4ee4\n2. \u53bb\u7167\u7247\u6587\u4ef6\u5939\u770b\u4e00\u773c\n3. \u8bb0\u5f97\u62a5\u9500\u5dee\u65c5\u8d39\uff08\u91d1\u989d\uff1a580\u5143\uff09"}, "\u7167\u7247": {}, "\u65e7\u6587\u4ef6.txt": {"_type": "file", "_content": "\u8fd9\u662f\u53bb\u5e74\u7684\u65e7\u5f85\u529e\uff0c\u5df2\u7ecf\u6ca1\u7528\u4e86\u3002"}}}}},steps:[
        {ask:'确认你站在哪——选出正确的命令并敲下去',cmdBlocks:['Get-Location','Get-ChildItem','Set-Location'],expect:{command:'Get-Location',error:false},note:'好——你敲了第一条命令。上面那行「Get-Location」是你敲的（命令），下面那行「C:/村庄/你家」是电脑回的（回显）。命令和回显，分清了吗？',hints:['Get = 获取，Location = 位置 → 就是 Get-Location。']}
      ]}},
      {talk:'④ 你敲了 Get-Location，电脑回你 C:/村庄/你家|这就是终端最基础的对话：<strong>你问（命令）→ 电脑答（回显）</strong>。Get-Location 不改变任何东西——它只是「看一眼」你在哪。'},
      {talk:'⑤ 连回 AI / Agent|Agent 替你跑的命令，跟你在终端敲的一模一样——它也是「问一句→看回显→决定下一步」。你看懂了命令和回显的对话，就看懂了 Agent 干活的底层对话。'},
      {try:{q:'终端里，哪一行是你敲的命令、哪一行是电脑的回显？',opts:[{t:'上面 PS 村庄> 开头的是命令，下面不带 PS 的是回显',ok:true},{t:'分不清，都一样',ok:false},{t:'下面的是命令，上面的是回显',ok:false}],fb:'上面带 PS 村庄> 的是你敲的命令，下面不带的是电脑的回显。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'终端里永远分两行：<strong>命令（你敲的）和回显（电脑回的）。</strong>Get-Location 是「只看不改」的问路。<br>第一条命令记录：Get-Location → C:/村庄/你家。'}
  }},'w1_2':{world:'w1',n:2,a:'07',boss:false,type:'core',optional:false,title:'看看周围',goal:'用 Get-ChildItem 看清目录内容',xp:100,content:{
    flow:[
      {lessonCycle:{probe:{q:'想知道当前文件夹里有哪些东西，你会先选哪个命令？',opts:[{t:'Get-ChildItem——直接列出当前目录里有什么',key:'a'},{t:'Get-Location——先看看自己在哪',key:'b'}]},explanation:{title:'先定位，再查看',text:'两个命令都很重要：<strong>Get-Location 看自己在哪</strong>，<strong>Get-ChildItem 看当前目录里有什么</strong>。最稳妥的流程是先定位（确认自己站在正确的文件夹里），再查看里面的内容。养成这个习惯——每一步都清楚自己的位置。',byChoice:{a:'你选了 Get-ChildItem——直接查看。也行！能马上看到内容。但做之前最好先用 Get-Location 确认自己的位置。先定位、再查看——这是操作员的肌肉记忆。',b:'你选了 Get-Location——先看自己在哪，再查里面有什么。这就是操作员的铁律：先定位，再查看。每一步都知道自己在哪、在干什么。'}},reinforce:{q:'你已经确认自己在「你家」文件夹，现在想查看里面有哪些文件，应该用什么？',opts:[{t:'Get-ChildItem',ok:true},{t:'Set-Location',ok:false}],fb:'查看内容用 Get-ChildItem——把当前目录里有什么都列出来。'}}},
      {talk:'② 命令是人话翻译|想让电脑「把这儿的东西列出来」，敲：<strong>Get-ChildItem</strong>。Get ＝ 获取；Child ＝ 里面的；Item ＝ 东西。合起来 ＝ <strong>「这儿都有啥？」</strong>'},
      {cmd:{mode:'session',initCwd:'C:/村庄/你家',fs:{"C:": {"\u6751\u5e84": {"\u4f60\u5bb6": {"\u7b14\u8bb0.txt": {"_type": "file", "_content": "\u4eca\u5929\u8981\u505a\u7684\u4e8b\uff1a\n1. \u5b66\u4f1a\u7ec8\u7aef\u547d\u4ee4\n2. \u53bb\u7167\u7247\u6587\u4ef6\u5939\u770b\u4e00\u773c\n3. \u8bb0\u5f97\u62a5\u9500\u5dee\u65c5\u8d39\uff08\u91d1\u989d\uff1a580\u5143\uff09"}, "\u7167\u7247": {}, "\u65e7\u6587\u4ef6.txt": {"_type": "file", "_content": "\u8fd9\u662f\u53bb\u5e74\u7684\u65e7\u5f85\u529e\uff0c\u5df2\u7ecf\u6ca1\u7528\u4e86\u3002"}}}}},steps:[
        {ask:'第1步：先看看你在哪',cmdBlocks:['Get-Location','Get-ChildItem'],expect:{command:'Get-Location',error:false},note:'对——先定位，再探索。这是好习惯。',hints:['先确认位置，用 Get-Location。']},
        {ask:'第2步：现在看看这间房里有什么',cmdBlocks:['Get-ChildItem','Get-Location'],expect:{command:'Get-ChildItem',error:false},note:'看到了？笔记.txt（文件）、照片（文件夹）、旧文件.txt（文件）。文件夹是你可以「走进去」的，文件是「一张纸」。',hints:['Get-ChildItem = 「把这儿的东西列出来」。']}
      ]}},
      {try:{q:'你敲 Get-ChildItem 后，怎么判断哪个是文件夹、哪个是文件？',opts:[{t:'通常无后缀（如「照片」）是文件夹，有 .txt 后缀的是文件',ok:true},{t:'完全分不出来',ok:false},{t:'名字长的是文件夹，短的是文件',ok:false}],fb:'通常文件夹没有后缀，而文件有后缀（如「笔记.txt」）。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'Get-ChildItem = 「这儿都有啥？」。养成习惯：<strong>先 Get-Location 确认位置，再 Get-ChildItem 看清东西</strong>。'}
  }},'w1_3':{world:'w1',n:3,a:'08',boss:false,type:'core',optional:false,title:'去别的地方',goal:'用 Set-Location 进出目录',xp:100,content:{
    flow:[
      {lessonCycle:{probe:{q:'想进入「照片」文件夹，应该用 Get 还是 Set 开头的命令？',opts:[{t:'Get 开头的命令——只查看、不改动',key:'a'},{t:'Set 开头的命令——会改变状态',key:'b'}]},explanation:{title:'Get 只看，Set 会改',text:'Get 开头的命令（Get-Location、Get-ChildItem）都是<strong>只查看、不改动</strong>。Set 开头的命令<strong>会改变状态</strong>——Set-Location 会改变你当前的位置。因为进入目录会改变当前位置（你挪窝了），所以要用 Set-Location。记住这条分水岭：Get＝看，Set＝改。',byChoice:{a:'你选了 Get 开头的——Get 只管看，不动任何东西。想看可以，但要「进去」就得 Set-Location。记好了：Get 是观察者，Set 是行动者。',b:'你选了 Set 开头的——对了！Get 只管看，Set 才管改。Set-Location 就是「把我挪到那个文件夹去」，会改变你当前的位置。Get 和 Set 的分水岭：Get＝观察者，Set＝行动者。'}},reinforce:{q:'想从「照片」返回上一级「你家」，最合适的操作是什么？',opts:[{t:'Set-Location ..',ok:true},{t:'Get-ChildItem ..',ok:false}],fb:'返回上一级用 Set-Location ..（两个点代表「上一级」）。'}}},
      {talk:'② 大分水岭：Get 是看，Set 是改|前面两关的命令都以 Get 开头——都是「看一眼、不改动」。现在你要「改变自己所在的位置」，得换一个词：<strong>Set ＝ 设置／改变</strong>。'},
      {cmd:{mode:'session',initCwd:'C:/村庄/你家',fs:{"C:": {"\u6751\u5e84": {"\u4f60\u5bb6": {"\u7b14\u8bb0.txt": {"_type": "file", "_content": "\u4eca\u5929\u8981\u505a\u7684\u4e8b\uff1a\n1. \u5b66\u4f1a\u7ec8\u7aef\u547d\u4ee4\n2. \u53bb\u7167\u7247\u6587\u4ef6\u5939\u770b\u4e00\u773c\n3. \u8bb0\u5f97\u62a5\u9500\u5dee\u65c5\u8d39\uff08\u91d1\u989d\uff1a580\u5143\uff09"}, "\u7167\u7247": {}, "\u65e7\u6587\u4ef6.txt": {"_type": "file", "_content": "\u8fd9\u662f\u53bb\u5e74\u7684\u65e7\u5f85\u529e\uff0c\u5df2\u7ecf\u6ca1\u7528\u4e86\u3002"}}}}},steps:[
        {ask:'第1步：先看看这间房里有什么',cmdBlocks:['Get-ChildItem','Get-Location'],expect:{command:'Get-ChildItem',error:false},note:'看到「照片」文件夹了吗？那就是你的目标。',hints:['先看清单——用 Get-ChildItem。']},
        {ask:'第2步：选「照片」文件夹走进去',cmdBlocks:['Set-Location'],arg1Blocks:['./照片','./笔记.txt','..'],expect:{command:'Set-Location',error:false,cwd:'C:/村庄/你家/照片'},note:'你进去了！现在位置变成了 C:/村庄/你家/照片。',hints:['Set-Location = 改变位置。后面跟目标路径 ./照片。']},

        {ask:'第5步：用 .. 返回上一级（回到你家）',cmdBlocks:['Set-Location'],arg1Blocks:['..','./照片'],expect:{command:'Set-Location',error:false,cwd:'C:/村庄/你家'},note:'.. 代表「上一级」。回到了 C:/村庄/你家。',hints:['返回上一级用 ..（两个点）。']}
      ]}},
      {try:{q:'你刚用 Set-Location 进了一个文件夹。最稳妥的做法是？',opts:[{t:'立刻用 Get-Location 确认自己确实到了',ok:true},{t:'不用确认，肯定到了',ok:false},{t:'直接开始删东西',ok:false}],fb:'每次进文件夹、出文件夹，都养成 Get-Location 确认位置的习惯。'}}

    aha:{goal:'你今天真正学会的',text:'Set-Location = 「把我挪到某个地方」。三步铁律：<strong>① 先看→② 进去→③ 确认。</strong>.. = 返回上一级。走错有报错——先用 Get-ChildItem 核对名字。'}
  }},'w1_4':{world:'w1',n:4,a:'09',boss:false,type:'core',optional:false,title:'打开文件',goal:'用 Get-Content 读文件内容',xp:100,content:{
    flow:[
      {talk:'① 接上一关|你现在能走文件夹了。回到「你家」，看到「笔记.txt」这个文件。你想<strong>看看这张纸上写了啥</strong>。'},
      {talk:'② Get-Content = 「把文件里的字念给我听」|和 Get-ChildItem 的区别：ChildItem 看清单，Content 看内容。'},
      {cmd:{mode:'session',initCwd:'C:/村庄/你家',fs:{"C:": {"\u6751\u5e84": {"\u4f60\u5bb6": {"\u7b14\u8bb0.txt": {"_type": "file", "_content": "\u4eca\u5929\u8981\u505a\u7684\u4e8b\uff1a\n1. \u5b66\u4f1a\u7ec8\u7aef\u547d\u4ee4\n2. \u53bb\u7167\u7247\u6587\u4ef6\u5939\u770b\u4e00\u773c\n3. \u8bb0\u5f97\u62a5\u9500\u5dee\u65c5\u8d39\uff08\u91d1\u989d\uff1a580\u5143\uff09"}, "\u7167\u7247": {}, "\u65e7\u6587\u4ef6.txt": {"_type": "file", "_content": "\u8fd9\u662f\u53bb\u5e74\u7684\u65e7\u5f85\u529e\uff0c\u5df2\u7ecf\u6ca1\u7528\u4e86\u3002"}}}}},steps:[

        {ask:'第3步：试着读一个不存在的文件——看电脑怎么报错',cmdBlocks:['Get-Content'],arg1Blocks:['./不存在的文件.txt','./笔记.txt','./旧文件.txt'],expect:{command:'Get-Content',error:true,errorContains:'找不到文件'},note:'报错了——电脑找不到这个文件。命令类型对，文件名不对。回来用 Get-ChildItem 确认文件名。',hints:['试试读一个不存在的文件名。']}

    aha:{goal:'你今天真正学会的',text:'Get-Content = 「把文件里写的字念给我听」。<strong>读文件三步：确认位置→确认文件名→Get-Content 读出来。</strong>找不到文件先查 Get-ChildItem。'}
  }},'w1_5':{world:'w1',n:5,a:'10',boss:false,type:'core',optional:false,title:'新建东西',goal:'用 New-Item 创建文件和文件夹',xp:100,content:{
    flow:[
      {talk:'① 一个跨越：从「看」到「造」|前面四关你全在<strong>看</strong>（Get 家族）。但光看不够——真干活得能<strong>造东西</strong>。比如你想新建一个「计划.txt」。'},
      {talk:'② New-Item = 「新建一个东西」|不是「获取现成的」→ 用 New。电脑还要知道两件事：<strong>叫什么名字、是文件还是文件夹。</strong>用 -ItemType 来区分。'},
      {cmd:{mode:'session',initCwd:'C:/村庄/你家',fs:{"C:": {"\u6751\u5e84": {"\u4f60\u5bb6": {"\u7b14\u8bb0.txt": {"_type": "file", "_content": "\u4eca\u5929\u8981\u505a\u7684\u4e8b\uff1a\n1. \u5b66\u4f1a\u7ec8\u7aef\u547d\u4ee4\n2. \u53bb\u7167\u7247\u6587\u4ef6\u5939\u770b\u4e00\u773c\n3. \u8bb0\u5f97\u62a5\u9500\u5dee\u65c5\u8d39\uff08\u91d1\u989d\uff1a580\u5143\uff09"}, "\u7167\u7247": {}, "\u65e7\u6587\u4ef6.txt": {"_type": "file", "_content": "\u8fd9\u662f\u53bb\u5e74\u7684\u65e7\u5f85\u529e\uff0c\u5df2\u7ecf\u6ca1\u7528\u4e86\u3002"}}}}},steps:[
        {ask:'第1步：新建一个「计划.txt」文件',cmdBlocks:['New-Item'],arg1Blocks:['./计划.txt','./笔记.txt'],optBlocks:['-ItemType File','-ItemType Directory'],expect:{command:'New-Item',commandLine:'New-Item ./计划.txt -ItemType File',error:false,exists:['C:/村庄/你家/计划.txt'],types:{'C:/村庄/你家/计划.txt':'file'}},note:'创建成功！一个空的「计划.txt」出现在了房间里。',hints:['新建用 New-Item，选文件名，再选 -ItemType File。']},
        {ask:'第2步：再建一个「backup」文件夹',cmdBlocks:['New-Item'],arg1Blocks:['./backup','./计划.txt'],optBlocks:['-ItemType Directory','-ItemType File'],expect:{command:'New-Item',commandLine:'New-Item ./backup -ItemType Directory',error:false,exists:['C:/村庄/你家/backup'],types:{'C:/村庄/你家/backup':'directory'}},note:'backup 文件夹也建好了。文件是「一张纸」，文件夹是「一个空的抽屉」。',hints:['再建一个文件夹——选 -ItemType Directory。']},
        {ask:'第3步：用 Get-ChildItem 验证——确认两个新东西真的出现了',cmdBlocks:['Get-ChildItem','Get-Location'],expect:{command:'Get-ChildItem',error:false},note:'看到了吗？清单里多了「计划.txt」和「backup」。新建的和你验证的——一个闭环完成了。',hints:['验证用 Get-ChildItem —— 看看新东西出现没有。']},
        {ask:'第4步：试试新建一个已经存在的名字——看电脑怎么提醒你',cmdBlocks:['New-Item'],arg1Blocks:['./笔记.txt','./计划.txt'],optBlocks:['-ItemType File','-ItemType Directory'],expect:{command:'New-Item',commandLine:'New-Item ./笔记.txt -ItemType File',error:true,errorContains:'已经存在'},note:'报错了——电脑说「笔记.txt 已经存在」。新东西的名字不能和已有的重名。',hints:['试着新建一个已经存在的文件名——笔记.txt。']}
      ]}},

    ],
    aha:{goal:'你今天真正学会的',text:'New-Item = 「造一个新东西」。<strong>文件 = 一张纸，文件夹 = 一个抽屉。</strong>新建后必须 Get-ChildItem 验证。名字不能跟已有的重名。'}
  }},'w1_6':{world:'w1',n:6,a:'11',boss:false,type:'core',optional:false,title:'删除和复制',goal:'安全地 Copy 和 Remove',xp:150,content:{
    flow:[
      {talk:'① 接上一关：能造，也得能备份、能删|「笔记.txt」很重要——得<strong>备份</strong>一份到 backup 文件夹。「旧文件.txt」没用了——得<strong>删掉</strong>。'},
      {talk:'② Copy-Item = 复印一份（安全）|Copy-Item 源文件 目标路径。复制是安全的——原件不动。'},
      {talk:'③ Remove-Item = 删除（最危险）|敲 Remove 之前，必须先用 <strong>-WhatIf</strong> 来一次「安全预演」。确认安全了，再去掉 -WhatIf 真正执行。'},
      {cmd:{mode:'session',initCwd:'C:/村庄/你家',fs:{"C:": {"\u6751\u5e84": {"\u4f60\u5bb6": {"\u7b14\u8bb0.txt": {"_type": "file", "_content": "\u4eca\u5929\u8981\u505a\u7684\u4e8b\uff1a\n1. \u5b66\u4f1a\u7ec8\u7aef\u547d\u4ee4\n2. \u53bb\u7167\u7247\u6587\u4ef6\u5939\u770b\u4e00\u773c\n3. \u8bb0\u5f97\u62a5\u9500\u5dee\u65c5\u8d39\uff08\u91d1\u989d\uff1a580\u5143\uff09"}, "\u7167\u7247": {}, "\u65e7\u6587\u4ef6.txt": {"_type": "file", "_content": "\u8fd9\u662f\u53bb\u5e74\u7684\u65e7\u5f85\u529e\uff0c\u5df2\u7ecf\u6ca1\u7528\u4e86\u3002"}, "backup": {}}}}},steps:[
        {ask:'第1步：把「笔记.txt」复制到 backup 文件夹',cmdBlocks:['Copy-Item'],arg1Blocks:['./笔记.txt','./旧文件.txt'],arg2Blocks:['./backup/笔记_备份.txt'],arg2Label:'目标路径',expect:{command:'Copy-Item',commandLine:'Copy-Item ./笔记.txt ./backup/笔记_备份.txt',error:false,exists:['C:/村庄/你家/backup/笔记_备份.txt'],contentContains:{'C:/村庄/你家/backup/笔记_备份.txt':['报销差旅费']}},note:'复制成功！原件在、副本也在——安全。',hints:['Copy-Item 需要两个路径：先选源文件 ./笔记.txt，再选目标路径。']},
        {ask:'第2步：确认备份文件真的在 backup 里了',cmdBlocks:['Get-ChildItem'],arg1Blocks:['./backup'],expect:{command:'Get-ChildItem',error:false,outputContains:['笔记_备份']},note:'看到了——笔记_备份.txt 在 backup 文件夹里。',hints:['进 backup 看一眼——Get-ChildItem ./backup。']},
        {ask:'第3步：对「旧文件.txt」先用 -WhatIf 安全预演',cmdBlocks:['Remove-Item'],arg1Blocks:['./旧文件.txt'],optBlocks:['-WhatIf'],expect:{command:'Remove-Item',error:false,outputContains:['WhatIf','预演']},note:'电脑说：将会删除 旧文件.txt。⚠️ 这只是预演，没有真正删除。',hints:['删除前先用 -WhatIf 预演。先选文件，再选 -WhatIf。']},
        {ask:'第4步：-WhatIf 确认安全了，现在真正删除它',cmdBlocks:['Remove-Item'],arg1Blocks:['./旧文件.txt','./笔记.txt'],expect:{command:'Remove-Item',error:false,notExists:['C:/村庄/你家/旧文件.txt']},note:'已删除。<strong>先备份 → 再预演 → 确认安全 → 才真正删除。</strong>',hints:['确认安全后，直接选 ./旧文件.txt 删除（不要 -WhatIf）。']},
        {ask:'第5步：最后验证——旧文件.txt 已经不在了',cmdBlocks:['Get-ChildItem','Get-Location'],expect:{command:'Get-ChildItem',error:false},note:'旧文件.txt 确实消失了。完整安全链：备份准备 → 安全预演 → 确认删除 → 验证结果。',hints:['最后看一眼清单——旧文件还在不在？']}
      ]}},
      {try:{q:'为什么删除前必须先 -WhatIf？',opts:[{t:'让它先预演要删什么、确认安全再真删，删错就晚了',ok:true},{t:'纯粹为了多敲几个字',ok:false},{t:'-WhatIf 会让删除更快',ok:false}],fb:'命令删掉的东西很难找回——-WhatIf 是最后一道安全闸。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'Copy-Item = 复印（安全）。<strong>Remove-Item = 删除（最危险）= 必须先 -WhatIf 预演。</strong>安全流程：先备份 → 预演 → 确认 → 真删 → 验证。'}
  }},'w1_7':{world:'w1',n:7,a:'12',boss:false,type:'core',optional:false,title:'搜索与管道',goal:'用 Select-String 和 | 串联命令',xp:150,content:{
    flow:[
      {talk:'① 处境：东西多了，翻不过来|你有个「日志.txt」，里面记了很多事。你要找「报销」相关的行，但不想一行行翻。'},
      {talk:'② Select-String = 终端里的 Ctrl+F|Select-String -Path ./日志.txt -Pattern "报销" ＝「在日志.txt里，挑出含『报销』的行」。'},
      {talk:'③ 管道 | = 把两步接成一步|Get-ChildItem | Select-String -Pattern "txt" — 那个竖线 | 叫<strong>管道符</strong>——把左边命令的输出传给右边接着处理。'},
      {cmd:{mode:'session',initCwd:'C:/村庄/你家',fs:{"C:": {"\u6751\u5e84": {"\u4f60\u5bb6": {"\u7b14\u8bb0.txt": {"_type": "file", "_content": "\u4eca\u5929\u8981\u505a\u7684\u4e8b\uff1a\n1. \u5b66\u4f1a\u7ec8\u7aef\u547d\u4ee4\n2. \u53bb\u7167\u7247\u6587\u4ef6\u5939\u770b\u4e00\u773c\n3. \u8bb0\u5f97\u62a5\u9500\u5dee\u65c5\u8d39\uff08\u91d1\u989d\uff1a580\u5143\uff09"}, "\u7167\u7247": {}, "\u65e7\u6587\u4ef6.txt": {"_type": "file", "_content": "\u8fd9\u662f\u53bb\u5e74\u7684\u65e7\u5f85\u529e\uff0c\u5df2\u7ecf\u6ca1\u7528\u4e86\u3002"}, "\u65e5\u5fd7.txt": {"_type": "file", "_content": "2024-01-15 \u62a5\u9500\uff1a\u5dee\u65c5\u8d39 580\u5143\n2024-01-16 \u91c7\u8d2d\uff1a\u6587\u5177 35\u5143\n2024-01-17 \u62a5\u9500\uff1a\u9910\u8d39 120\u5143"}}}}},steps:[
        {ask:'第1步：用 Get-Content 完整读一遍「日志.txt」',cmdBlocks:['Get-Content'],arg1Blocks:['./日志.txt','./笔记.txt','./旧文件.txt'],expect:{command:'Get-Content',error:false,outputContains:['报销']},note:'看到了？有四行记录。下一步用搜索更快。',hints:['先读完整的——Get-Content ./日志.txt。']},
        {ask:'第2步：用 Select-String 挑出含「报销」的行',cmdBlocks:['Select-String'],arg1Blocks:['-Path ./日志.txt','-Path ./笔记.txt'],arg1Label:'文件',arg2Blocks:['-Pattern "报销"','-Pattern "采购"'],arg2Label:'关键词',expect:{command:'Select-String',error:false,outputContains:['报销','差旅费']},note:'找到了两行含「报销」的！跟刚才全文对比：Select-String 只吐出了你关心的那几行。',hints:['Select-String -Path ./日志.txt -Pattern "报销"。先选文件路径，再选搜索词。']},
        {ask:'第3步：用管道 | 把两步接成一步——列出文件→搜出含 txt 的',cmdBlocks:['Get-ChildItem'],arg1Blocks:['| Select-String -Pattern txt'],arg1Label:'管道',expect:{command:'Get-ChildItem',error:false,outputContains:['txt']},note:'管道把 Get-ChildItem 的输出直接交给 Select-String 过滤——含 "txt" 的三项留下了。<strong>多步接成一步。</strong>',hints:['先选 Get-ChildItem，再选 | Select-String -Pattern txt。']}
      ]}},
      {talk:'④ W7 伏笔|W7 工作流，就是把这个「多步接成一步」的管道思想放大——第一世界埋的管道种子，到最后一世界才开花。'},
      {try:{q:'Get-Content、Select-String、管道 | 三者的区别？',opts:[{t:'Content 读全文，Select-String 搜关键词，管道 | 把两步接成一步',ok:true},{t:'三者是同一个东西的三个名字',ok:false},{t:'Content 搜、Select 读、管道没用',ok:false}],fb:'Content = 念全文；Select-String = 搜关键词；管道 | = 把输出传给下一个命令。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'Select-String = 「在文件里搜关键词」。<strong>管道 | = 把左边命令的输出传给右边接着处理</strong>——把多步接成一步。'}
  }},'w1_8':{world:'w1',n:8,a:'13',boss:true,type:'core',optional:false,title:'Boss · 终端任务',goal:'完成完整的排错与备份任务',xp:300,achievement:'w1_complete',content:{
    flow:[
      {talk:'① Boss 登场：项目报错了，来排查|黑窗口村的毕业考——真实场景。项目跑着跑着报错了。你要：① 找到日志中的 ERROR；② 把日志备份到 backup；③ 确认备份成功。'},
      {cmd:{mode:'session',initCwd:'C:/村庄/项目',fs:{"C:": {"\u6751\u5e84": {"\u4f60\u5bb6": {"\u7b14\u8bb0.txt": {"_type": "file", "_content": "\u4eca\u5929\u8981\u505a\u7684\u4e8b\uff1a\n1. \u5b66\u4f1a\u7ec8\u7aef\u547d\u4ee4\n2. \u53bb\u7167\u7247\u6587\u4ef6\u5939\u770b\u4e00\u773c\n3. \u8bb0\u5f97\u62a5\u9500\u5dee\u65c5\u8d39\uff08\u91d1\u989d\uff1a580\u5143\uff09"}, "\u7167\u7247": {}, "\u65e7\u6587\u4ef6.txt": {"_type": "file", "_content": "\u8fd9\u662f\u53bb\u5e74\u7684\u65e7\u5f85\u529e\uff0c\u5df2\u7ecf\u6ca1\u7528\u4e86\u3002"}}, "\u9879\u76ee": {"README.txt": {"_type": "file", "_content": "\u9879\u76ee\u540d\u79f0\uff1a\u667a\u80fd\u6392\u73ed\u7cfb\u7edf\n\u8d1f\u8d23\u4eba\uff1a\u5c0f\u65b0\n\u72b6\u6001\uff1a\u5f00\u53d1\u4e2d"}, "config.txt": {"_type": "file", "_content": "\u6570\u636e\u5e93\u5730\u5740\uff1alocalhost\n\u7aef\u53e3\uff1a3306\n\u65e5\u5fd7\u7ea7\u522b\uff1aINFO"}, "logs": {"app.log": {"_type": "file", "_content": "2024-01-15 INFO \u670d\u52a1\u542f\u52a8\n2024-01-15 ERROR \u6570\u636e\u5e93\u8fde\u63a5\u8d85\u65f6\n2024-01-15 WARNING \u78c1\u76d8\u7a7a\u95f4\u4e0d\u8db3\n2024-01-15 INFO \u91cd\u8bd5\u8fde\u63a5\u6210\u529f\n2024-01-16 INFO \u5907\u4efd\u5b8c\u6210"}, "old.log": {"_type": "file", "_content": "2024-01-10 INFO \u65e7\u65e5\u5fd7\u5f52\u6863"}}, "data": {}}}}},steps:[
        {ask:'① 先确认你在哪',cmdBlocks:['Get-Location'],expect:{command:'Get-Location',error:false},note:'在 C:/村庄/项目。好，起点清楚了。',hints:['第一步永远是确认位置——Get-Location。']},
        {ask:'② 看看项目目录里有什么',cmdBlocks:['Get-ChildItem'],expect:{command:'Get-ChildItem',error:false},note:'README.txt、config.txt、logs 文件夹、data 文件夹。日志在 logs 里。',hints:['看清有什么——Get-ChildItem。']},
        {ask:'③ 进入 logs 文件夹',cmdBlocks:['Set-Location'],arg1Blocks:['./logs','./data'],expect:{command:'Set-Location',error:false,cwd:'C:/村庄/项目/logs'},note:'进来了。里面有 app.log 和 old.log。',hints:['进 logs 用 Set-Location ./logs。']},
        {ask:'④ 确认日志文件在这里',cmdBlocks:['Get-ChildItem'],expect:{command:'Get-ChildItem',error:false},note:'app.log 和 old.log。新日志是 app.log，读它。',hints:['进来了就看看有什么——Get-ChildItem。']},
        {ask:'⑤ 读取 app.log，找到 ERROR 行',cmdBlocks:['Get-Content'],arg1Blocks:['./app.log','./old.log'],expect:{command:'Get-Content',error:false,outputContains:['ERROR','数据库连接超时']},note:'找到了！第二行：ERROR 数据库连接超时。这就是项目报错的原因。',hints:['读文件内容——Get-Content ./app.log。']},
        {ask:'⑥ 返回项目目录（用 .. 回上一级）',cmdBlocks:['Set-Location'],arg1Blocks:['..','./logs'],expect:{command:'Set-Location',error:false,cwd:'C:/村庄/项目'},note:'回到 C:/村庄/项目。现在创建 backup 文件夹。',hints:['返回上一级用 Set-Location ..。']},
        {ask:'⑦ 创建 backup 文件夹',cmdBlocks:['New-Item'],arg1Blocks:['./backup'],optBlocks:['-ItemType Directory','-ItemType File'],expect:{command:'New-Item',commandLine:'New-Item ./backup -ItemType Directory',error:false,exists:['C:/村庄/项目/backup'],types:{'C:/村庄/项目/backup':'directory'}},note:'backup 文件夹已创建。现在备份日志。',hints:['新建文件夹——New-Item ./backup，选 -ItemType Directory。']},
        {ask:'⑧ 把 app.log 复制到 backup',cmdBlocks:['Copy-Item'],arg1Blocks:['./logs/app.log','./config.txt'],arg2Blocks:['./backup/app.log'],arg2Label:'目标',expect:{command:'Copy-Item',commandLine:'Copy-Item ./logs/app.log ./backup/app.log',error:false,exists:['C:/村庄/项目/backup/app.log'],contentContains:{'C:/村庄/项目/backup/app.log':['ERROR','数据库连接超时']}},note:'备份完成！原件还在 logs 里，副本在 backup 里。',hints:['源：./logs/app.log，目标：./backup/app.log。']},
        {ask:'⑨ 验证备份——看 backup 里有没有 app.log',cmdBlocks:['Get-ChildItem'],arg1Blocks:['./backup','./logs'],expect:{command:'Get-ChildItem',commandLine:'Get-ChildItem ./backup',error:false,outputContains:['app.log'],exists:['C:/村庄/项目/backup/app.log']},note:'app.log 在 backup 里了。备份成功！',hints:['验证用 Get-ChildItem ./backup。']},
        {ask:'⑩ 最后一步：确认原件还在——删除原日志是错误的',cmdBlocks:['Get-ChildItem'],arg1Blocks:['./logs','./backup'],expect:{command:'Get-ChildItem',commandLine:'Get-ChildItem ./logs',error:false,outputContains:['app.log'],exists:['C:/村庄/项目/logs/app.log']},note:'原件 app.log 还在 logs 里。备份是复制，不是移动。⚠️ 删除原日志是错误的做法——保留原件、只做备份。',hints:['原件在 ./logs 里——看一眼确认。']}
      ]}},
      {talk:'② 任务完成！|从报错项目目录开始，你完成了10步：确认位置→看清目录→进入logs→确认日志→读取找ERROR→返回上级→创建backup→复制备份→验证备份→确认原件保留。<strong>这就是你在终端里的第一次完整任务。</strong>'},
      {talk:'③ 你拿到了什么|一张<strong>终端任务记录卡</strong>：任务（找ERROR+备份日志）、起点（C:/村庄/项目）、10步操作链、关键回显（ERROR 数据库连接超时）、备份位置（backup/app.log）、验证（备份成功，原件未删）。'}
    ],
    aha:{goal:'🎓 恭喜——黑窗口村通关！',text:'📜 终端任务记录卡<br>任务：项目报错→找ERROR→备份日志→验证<br>起点：C:/村庄/项目<br>10步操作链<br>关键回显：ERROR 数据库连接超时<br>备份位置：backup/app.log<br>验证：备份成功，原件保留未删除<br><br>你学会的不是背命令，是<strong>根据回显连续操作的排错习惯</strong>。<br>🎓 赢得认证：<strong>终端操作</strong>！<br>下一站「代码森林」：命令只是起点——它们怎么组合成一个完整的程序？'}
  }},'w2_1':{world:'w2',n:1,a:'14',boss:false,type:'core',optional:false,title:'变量：给信息起名字',goal:'用变量保存信息',xp:100,content:{
    flow:[
      {talk:'① 从「敲命令」到「写程序」|在黑窗口村，你是一句句敲命令。可要是一件事有几十步呢？比如要进 20 个文件夹挨个处理，难道敲 20 次 Set-Location？太蠢了。<br>聪明的办法：<strong>把步骤写下来存成文件，让电脑照着一次跑完</strong>——这就是<strong>程序</strong>。代码森林就带你看：程序是用哪几种「零件」搭的。第一个零件，也是最基础的——<strong>变量</strong>。'},
      {talk:'② 变量到底是啥，就一句话|<strong>给一个信息起个名字，方便反复用。</strong>就这么简单。<br>别被「变量」这词吓着——它不是数学课上那个让你头疼的 x，它比那亲切多了。'},
      {talk:'③ 其实你天天在用「变量」|你手机里存着联系人「妈妈」：<strong>「妈妈」是你起的名，背后是一串你根本记不住的电话号码</strong>。你打电话点「妈妈」就行，不用背号码。<br>这就是变量——一个好记的名字，替你记住背后那串麻烦东西。WiFi 名、外卖地址簿、游戏存档……全是它的影子。'},
      {talk:'④ 写成代码长啥样（先看小黑示范）|<code style="background:#eee;padding:2px 8px;border-radius:4px">名字 = "小明"</code>——左边「名字」是你起的名（<strong>标签</strong>），右边「小明」是存进去的信息（<strong>内容</strong>）。以后喊「名字」，它自动变「小明」。<br>⚠️ 这个 <strong>=</strong> 不是数学的「等于」，是「<strong>把右边存进左边</strong>」——像往一个贴了标签的盒子里放东西。'},{blocks:{runType:'template',ask:'轮到你了——给「名字」这个变量填个值，点「运行」看输出。<strong>然后把名字改成另一个值，再运行一次</strong>，亲眼看看输出会不会跟着变：',lines:['问候 = "你好"','名字 = ‹name›','print(问候 + "，" + 名字 + "！")'],slots:{name:{label:'名字',ph:'填个名字，比如 小新'}},outputTemplate:'你好，{name}！',goalRuns:2,card:'变量运行卡',cardBody:'你给一段信息起了名（名字）、填了值、还换了个值——每换一次，输出就跟着变。这就是「变量」：一个不变的名字，装着可以随时换的内容。'}},{talk:'⑤ 为啥叫「变」量——因为内容能换|看到没？「名字」这个盒子，标签不变，里面的内容一换，输出立马就变。<br>再比如 <code style="background:#eee;padding:2px 8px;border-radius:4px">余额 = 100</code>，花了 30 就 <code style="background:#eee;padding:2px 8px;border-radius:4px">余额 = 70</code>：名字还叫「余额」，里面的数更新了。<strong>名字不变，内容变</strong>——这就是「变」量。'},
      {talk:'⑥ 变量为啥这么要紧|因为程序干活全靠——<strong>把中间结果存起来、后面接着用</strong>。没有变量，算出的东西转头就忘，啥也干不成。<strong>变量就是程序的「记性」</strong>。'},
      {try:{q:'为啥说没变量，程序就「啥也干不成」？',opts:[{t:'算出的中间结果存不下，下一步没法接着用',ok:true},{t:'变量能让代码好看',ok:false},{t:'没变量程序跑得慢',ok:false}],fb:'程序一步步干，每步的结果都得先「存起来起个名」，下一步才拿得出来。没记性，干一步忘一步。'}},
      {talk:'⑦ 连回 AI——这对你有啥用|你让 AI 干一串活，它满脑子都是变量：先把「读到的文件内容」存进一个变量，再把「总结出的结果」存进另一个……<strong>变量就是 Agent 的「记忆小抽屉」</strong>。以后你读 AI 写的代码，看到 <code style="background:#eee;padding:2px 8px;border-radius:4px">xxx = ...</code>，一眼就懂：哦，它在往一个抽屉里存东西。'}
    ],
    aha:{goal:'你今天真正学会的',text:'<strong>变量 = 给信息贴个标签，随时喊随时用、还能随时换。</strong><br>它是程序的「记性」，也是 Agent 的「记忆小抽屉」。<br>下一关：光会存不够，得让程序会——「看情况办事」。'}
  }},
  'w2_2':{world:'w2',n:2,a:'15',boss:false,type:'core',optional:false,title:'条件：如果...就...',goal:'用条件做判断',xp:100,content:{
    flow:[
      {talk:'① 接上一关：变量给程序「记性」了，还差点啥|会记还不够——程序得会<strong>看情况办事</strong>。你出门前看天气：「<strong>如果</strong>下雨，<strong>就</strong>带伞」。这就是条件判断——程序最基础的「会拐弯」的本事。'},
      {talk:'② 你天天在做条件判断|闹钟响了——如果今天是工作日，就起床；如果周末，再睡会儿。点外卖——如果有满减券，就用；如果没有，原价下单。打游戏——如果血条见底，吃药；如果满了，继续莽。<br><strong>「如果…就…」是你大脑里跑了一辈子的程序。</strong>'},
      {try:{q:'下面哪个是「条件判断」？',opts:[{t:'如果余额不足，就提醒充值',ok:true},{t:'把余额记在一个叫money的变量里',ok:false},{t:'对所有订单，逐个处理',ok:false}],fb:'「存进变量」和「逐个处理」都不是 ——「如果…就…」，带「如果」两个字的，才是条件判断。'}},
      {talk:'③ 写成代码长啥样|<code style="background:#eee;padding:2px 8px;border-radius:4px">如果 下雨： 带伞</code><br>程序跑到这，先看「下雨」成不成立：<strong>成立就干「带伞」，不成立就跳过</strong>。就像一个保安，先看健康码——绿的就放行，不是绿的就不放。'},
      {blocks:{runType:'branch',ask:'轮到你动手——给「余额」填个数，点运行看程序走哪条路。<strong>先填个够买的（比如 100），再填个不够的（比如 20），把两条路都走一遍：</strong>',lines:['商品价格 = 50','余额 = ‹balance›','如果 余额 >= 商品价格：print("买得起") 否则：print("买不起")'],input:'balance',op:'>=',ref:50,whenTrue:{tag:'如果',out:'✅ 余额够——买得起'},whenFalse:{tag:'否则',out:'❌ 余额不够——买不起'},goalBranches:['true','false'],card:'条件运行卡',cardBody:'同一段程序，你一个字的代码都没改，只换了「余额」这个输入——它就走了不同的路。这就是条件：让程序看情况办事。'}},
      {talk:'④ 还有「否则」——两条路|现实里常是两条路：下雨就带伞，<strong>否则</strong>就戴墨镜。<br><code style="background:#eee;padding:2px 8px;border-radius:4px">如果 下雨： 带伞； 否则： 戴墨镜</code><br>成立走第一条，不成立走「否则」那条。一次只走一条路，不会两条都走。'},
      {try:{q:'<code style="background:#eee;padding:2px 8px;border-radius:4px">如果 及格： 发奖状； 否则： 补考</code>，一个没及格的同学会？',opts:[{t:'走「否则」——补考',ok:true},{t:'既发奖状又补考',ok:false}],fb:'没及格 = 「如果」不成立，走「否则」那条：补考。一次只走一条路。'}},
      {talk:'⑤ 好几个「如果」摞起来|程序还能更灵光：<code style="background:#eee;padding:2px 8px;border-radius:4px">如果 余额小于0： 欠费； 否则如果 余额小于10： 提醒； 否则： 正常</code><br>一层层判断下来，找到对的那条。就像自动售货机——先看有没有投够钱，够就看有没有货，有才掉出来。<br>你不需要记住咋写，你只要看懂：<strong>程序在按条件一层层判断</strong>，就够了。'},
      {talk:'⑥ 连回 AI|Agent 干活时满肚子都是这个：<strong>文件存在就直接用、不存在就先下载</strong>（如果…就…）；能联网就查、断网就报错；问题清楚就回答、模糊就反问……<strong>Agent 每次「拐弯」，背后都是一个如果…就…。</strong>'},
      {try:{q:'Agent 面对不同情况选不同做法，核心是靠？',opts:[{t:'条件判断（如果…就…）——每个决策分岔都是一个如果',ok:true},{t:'循环（重复干）',ok:false},{t:'变量（存东西）',ok:false}],fb:'Agent 每次「拐弯」——选这个工具还是那个、走这条路还是那条——底层全是在跑条件判断。每个「如果」都是一个决策点。'}}
    ],
    aha:{goal:'你今天真正学会的',text:'<strong>条件 = 让程序「看情况办事」</strong>——如果…就…（还能否则走另一条，还能一层层往上摞）。<br>这是 Agent「会拐弯、会做决定」的底层本事。<br>下一关：有些活要重复干很多遍，总不能写一万遍——<strong>循环</strong>来了。'}
  }},
  'w2_3':{world:'w2',n:3,a:'16',boss:false,type:'core',optional:false,title:'循环：重复做事',goal:'用循环批量处理',xp:100,content:{
    flow:[
      {talk:'① 接上一关：会存、会拐弯了，还差一个本事|变量给程序「记性」，条件让它「会拐弯」。但还有个事：很多活得<strong>重复干</strong>。'},
      {talk:'② 一个扎心的画面|你开了个网店，要给 500 个买家发一模一样的发货通知。<br>打开聊天框 → 粘贴消息 → 发送 → 下一个 → 粘贴 → 发送 → ……500 次。<br>干到第 30 个人你就崩溃了。<strong>有没有办法：写一句「给所有人发这条」，然后坐那喝茶？</strong><br>这就是循环。'},
      {try:{q:'给 500 个人发同一条通知，最适合？',opts:[{t:'用循环——写一条消息，让它自动发 500 遍',ok:true},{t:'用手一个个发 500 遍',ok:false},{t:'用条件判断——如果这个人存在就发',ok:false}],fb:'500 遍手里一个个干？条件判断帮不了你——重复干活，正是循环的活。'}},
      {talk:'③ 写成代码长啥样|<code style="background:#eee;padding:2px 8px;border-radius:4px">重复 5 次： 打印一颗星</code><br>你只写一次，程序自动把「打印一颗星」干 5 遍。屏幕上出现 5 颗星。<br>循环的核心就一句话：<strong>告诉电脑「做这件事 N 次」，而不是写 N 行代码。</strong>'},
      {trace:{ask:'光知道次数还不够——得看清每一轮里变量怎么变。追踪这段循环：',code:['星星数 = 0','重复 3 次：','    星星数 = 星星数 + 1','    print(星星数)'],checkpoints:[{ask:'① 这个循环一共重复几次？',accept:['3','三','3次','三次']},{ask:'② 第 1 轮结束时，星星数是几？',accept:['1','一']},{ask:'③ 第 3 轮结束时，星星数是几？',accept:['3','三']}],finalOutput:{ask:'④ 屏幕会依次打印出哪几个数字？',need:['1','2','3']},hints:['循环次数看「重复 N 次」里的 N。','星星数从 0 开始，每轮 +1：第 1 轮就变成 1。','第1轮1、第2轮2、第3轮3——每轮在上一轮基础上再 +1。','每轮都 print 一次当前星星数，所以依次打印 1、2、3。'],card:'循环追踪卡',cardBody:'你看清了循环每一轮里变量怎么变：星星数 0→1→2→3，每轮 +1 再打印。循环 = 重复做，变量一轮轮累积。'}},
      {talk:'④ 更厉害：对着「一堆东西」挨个干|你还不用告诉它多少次！<code style="background:#eee;padding:2px 8px;border-radius:4px">对 每个 订单： 发通知</code>——有多少个订单，就自动干多少遍。<br>黑窗口村你敲 Get-ChildItem 列出文件，一个个处理太费劲吧？循环就是那种「挨个处理」的正式写法。'},
      {try:{q:'<code style="background:#eee;padding:2px 8px;border-radius:4px">对 每个 文件： 加上日期</code>，有 8 个文件，会执行几遍？',opts:[{t:'8 遍，有几个文件就自动干几遍',ok:true},{t:'1 遍',ok:false},{t:'5 遍',ok:false}],fb:'「对每个文件」= 有几个就干几遍。8 个文件，自动加 8 次日期，你甚至不用告诉它数字。'}},
      {talk:'⑤ 循环 + 条件 = 真正的自动脑子|<strong>两种零件合在一起才是真威力</strong>。循环能把前两关的变量和条件全串起来。'},
      {sequence:{ask:'轮到你搭一个循环——把「给每个订单发通知」的步骤拖成正确顺序：',items:[{id:'each',text:'对 每个 订单：（开始循环）'},{id:'check',text:'　检查这个订单的状态'},{id:'send',text:'　给这个订单发通知'},{id:'next',text:'　回到开头，处理下一个订单'}],answer:['each','check','send','next'],card:'循环结构卡',fb:'循环是「对每个 X，做一串事，再回头处理下一个」：先说对谁循环，再是每轮做的事，最后回到开头。顺序错了就跑不通。'}},
      {talk:'⑥ 连回 AI|你让 AI「把 50 个文件名全改一遍」「给 200 条评论挨个打标签」——它一秒干完不喊累，靠的就是循环。<strong>批量处理、不喊累，这是自动化的核心。</strong><br>以后看到代码里一堆重复的东西，你一眼就知道：哦，循环在干活。'}
    ],
    aha:{goal:'你今天真正学会的',text:'<strong>循环 = 让程序重复干活——一次写好，干无数遍。</strong><br>还能跟条件配合：对着每件东西，看情况分别处理——这是 Agent「批量干活、不喊累」的本事。<br>下一关：把常用的一串步骤打包——<strong>函数</strong>。'}
  }},
  'w2_4':{world:'w2',n:4,a:'17',boss:false,type:'core',optional:false,title:'函数：打包工具',goal:'把步骤打包成函数',xp:150,content:{
    flow:[
      {talk:'① 接上一关：会存、会拐弯、会重复——现在盘活它们|你学了三个零件，每个都要一句句写。但有些步骤你天天用——比如「泡面」要：烧水 → 放面 → 等 3 分钟 → 倒调料。<br><strong>能不能把这串步骤打包成一个词「泡面」，以后喊一声就全做了？</strong><br>能。这就是函数。'},
      {talk:'② 函数就是「打包」+「起名」+「复用」|把一串步骤绑在一起、贴个标签，以后喊标签就全跑——跟变量一样是「起名复用」，只不过变量打包的是<strong>一个信息</strong>，函数打包的是<strong>一串动作</strong>。'},
      {talk:'③ 生活里全是函数|洗衣机上那个「标准洗」按钮——按一下，注水→洗→漂→脱水，一串步骤自动跑。你从不关心它里面咋洗的，你只按一下。<br>微波炉的「热饭」、电饭煲的「煮饭」、手机的「一键导航」……<strong>你把一堆步骤打包成一个词，这个词就是函数。</strong>'},
      {try:{q:'下面哪个最像「函数」？',opts:[{t:'洗衣机上的「标准洗」——按一下，一串步骤自动跑，你不用管中间',ok:true},{t:'一个记录了水位的数字',ok:false},{t:'一遍又一遍地手洗衣服',ok:false}],fb:'记录水位的 = 变量（存一个信息）。一遍遍手洗 = 循环（重复）。按一下就自动跑完一串步骤 = 函数。'}},
      {talk:'④ 写成代码长啥样|<code style="background:#eee;padding:2px 8px;border-radius:4px">定义 泡面()： 烧水; 放面; 等3分钟; 倒调料</code><br>以后要泡面，喊一声 <code style="background:#eee;padding:2px 8px;border-radius:4px">泡面()</code>，里面那四步自动全跑。<br>好处？以后要给泡面加个蛋，改一次定义就行——所有喊「泡面」的地方自动升级。一改改全部，不用到处找。'},
      {blocks:{runType:'template',ask:'来调用一个函数——它叫「打招呼」，给它一个名字，它就返回一句问候。<strong>填个名字运行，再换个名字运行一次</strong>，看同一个函数怎么对不同输入给不同输出：',lines:['定义 打招呼(名字)：','    返回 "你好，" + 名字 + "！很高兴认识你"','','打招呼(‹name›)'],slots:{name:{label:'名字',ph:'填个名字，比如 小新'}},outputTemplate:'你好，{name}！很高兴认识你',goalRuns:2,card:'函数调用卡',cardBody:'同一个函数「打招呼」，喂不同的名字就返回不同的问候——一次定义、反复调用、输入不同输出不同。这就是函数为啥值钱。'}},
      {talk:'⑤ 你早就用过函数了——在黑窗口村|回想你敲过的命令：<strong>Get-Location、Get-ChildItem、Select-String</strong>……<br>这些命令，本质就是<strong>别人早给你打包好的函数</strong>。你喊一声名字，背后一堆步骤自动跑，你根本不用管里面咋实现的。<strong>你敲命令，就是在调用函数。</strong>'},
      {try:{q:'Get-ChildItem 这种命令，本质上是？',opts:[{t:'别人打包好的函数——你喊名，背后一串步骤自动跑',ok:true},{t:'一个变量',ok:false},{t:'一个循环',ok:false}],fb:'你敲 Get-ChildItem，背后是「问系统→整理→列出来」一串步骤——都打包好了，你只管喊名。这就是在用函数！'}},
      {talk:'⑥ 连回 AI——这是最要紧的一段|还记得启蒙营那句——<strong>「工具是 Agent 的手」</strong>吗？<br>Agent 的「会搜索」是一个函数。「会读文件」是一个函数。「会发邮件」也是一个函数。<strong>Agent 的每一件工具，底层就是一个个打包好的函数。</strong><br>你给它配工具，就是在给它加函数。<strong>命令、函数、Agent 工具 —— 本质相通，都是「打包好的一段能力」。</strong>'},
      {try:{q:'「Agent 的工具」和「函数」是啥关系？',opts:[{t:'Agent 的每个工具，底层就是一个打包好的函数',ok:true},{t:'两个完全无关的东西',ok:false}],fb:'工具是 Agent 的手；而每只「手」怎么动，是一个函数定义好的。给 Agent 加工具 = 给它加函数。<strong>命令、函数、工具——同一个东西。</strong>'}}
    ],
