# R1.2 Round3 持续集成 —— 11 项守门检查
#
# 触发: 推送到 r1.2-round3-dev 分支, 或对 main 开 PR。
# 设计原则(见开发指令 Section 七「严格禁止」):
#   * 不修改 Alpha2 冻结文件 / Round2-R2 交付件 / LevelData / 课程哈希 / 74·70·4·8 / TEST_MODE。
#   * 不依赖、不上传任何真实素材; 仅用 tests/fixtures/assets/ 确定性夹具。
#   * 派生构建(apply_round3.py)可复现, 不会污染已提交文件(见第 11 项 git status 干净)。
name: R1.2 Round3 CI

on:
  push:
    branches: [r1.2-round3-dev]
  pull_request:
    branches: [main]

jobs:
  r1-2-round3-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "1) Python 版本检查 (>=3.10)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "2) Node 版本检查 (>=18)"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "3) JS 语法检查 (round3_features.js + 9 个 Round3 新增测试)"
        run: |
          node --check round3_features.js
          node --check tests/test_round3_interaction_progress.js
          node --check tests/test_round3_error_feedback.js
          node --check tests/test_round3_key_levels.js
          node --check tests/test_round3_live_progress.js
          node --check tests/test_round3_gate_fail_closed.js
          node --check tests/test_round3_no_answer_leak.js
          node --check tests/test_round3_gate_missing_state.js
          node --check tests/test_round3_completion_state.js
          node --check tests/test_round3_engine_gate_submission.js

      - name: "4) 生成确定性 fixtures (无真实素材, 可清理)"
        run: |
          python tests/generate_fixture_assets.py --clean
          python tests/generate_fixture_assets.py

      - name: "5) 两次构建一致性 (派生构建可复现)"
        run: python tests/test_round3_reproducible_build.py

      - name: "6) 课程哈希校验 (== 56860b83...)"
        run: python tests/check_course_invariants.py

      - name: "7) 74/70/4/8 关卡计数校验"
        run: python tests/check_course_invariants.py

      - name: "安装 Python 依赖 (Pillow, run_all_tests 环境检查与测试需要)"
        run: python -m pip install --upgrade pip Pillow

      - name: "安装 Playwright Chromium (1.61.1, 仅测试用, 不上传素材)"
        run: |
          npm install
          npx -y playwright@1.61.1 install --with-deps chromium

      - name: "8-10) 运行全量测试套件 (27 原始 + Round3 新增, 含浏览器 pageerror/requestfailed 监控)"
        id: full
        continue-on-error: true
        run: python tests/run_all_tests.py --log-name r1.2-round3-ci.log

      - name: "8) 27 原始测试全部通过"
        if: always()
        run: grep -E "原始 27/27 测试组.*全部通过" tests/logs/r1.2-round3-ci.log

      - name: "9) Round3 新增测试全部通过"
        if: always()
        run: grep -E "Round3 相关 14 步.*全部通过" tests/logs/r1.2-round3-ci.log

      - name: "10) pageerror = 0 且 requestfailed = 0"
        if: always()
        run: |
          if grep -qE "pageerror = [1-9]" tests/logs/r1.2-round3-ci.log; then echo "FAIL: 存在 pageerror > 0"; exit 1; fi
          if grep -qE "requestfailed = [1-9]" tests/logs/r1.2-round3-ci.log; then echo "FAIL: 存在 requestfailed > 0"; exit 1; fi
          grep -qE "pageerror = 0" tests/logs/r1.2-round3-ci.log && echo "OK: 全部浏览器测试 pageerror = 0"
          grep -qE "requestfailed = 0" tests/logs/r1.2-round3-ci.log && echo "OK: 全部浏览器测试 requestfailed = 0"

      - name: "11) git status 干净 (派生构建可复现, 未污染已提交文件)"
        if: always()
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # ── CI 状态区分 ──
      #   CI_CONFIG_READY: 工作流文件与全部守门检查已就绪、本地全量测试已通过,
      #                    但分支尚未推送、工作流尚未在 CI 实际运行 → 只能标 READY。
      #   CI_PASS:        仅在工作流在 CI 上真实运行且 11 项全部通过后, 才允许标注 PASS。
      #   本轮(开发指令)明确: 分支不推送、不开 PR, 故此处只写 CI_CONFIG_READY, 不写 CI_PASS。
      - name: "CI 状态 (本轮 CONFIG_READY, 待真实运行后记录 PASS)"
        if: always()
        run: |
          echo "CI_CONFIG_READY"
          echo "说明: 分支 r1.2-round3-dev 已推送并开 PR(#2); 本工作流正在 CI 真实运行;"
          echo "      11 项守门全部通过后, 由后续提交记录 CI_PASS(见开发指令)。"
